 profit.","說明長期下廠商數目、市場價格與每家廠商的利潤會如何變化。"],"a":["Profits attract entry, market supply increases, and price falls back to $10 (constant cost). Each firm returns to q_{1} and zero economic profit.","利潤吸引新廠商進入，市場供給增加，價格回到 10 美元（固定成本產業）。每家廠商回到 q_{1}，經濟利潤為零。"]}]}]},{"id":"mi4","c":"micro","n":4,"t":["Imperfect Competition","不完全競爭"],"mcq":[{"k":"k","q":["Which set of characteristics describes a monopoly?","下列哪一組特徵描述的是獨占？"],"o":[["A few large sellers that are interdependent","少數幾家互相影響的大廠商"],["Many sellers, identical products and free entry","很多賣方、產品相同、自由進入"],["One buyer and many sellers","只有一個買方、很多賣方"],["One seller, no close substitutes and high barriers to entry","只有一個賣方、沒有相近替代品、進入障礙高"],["Many sellers, differentiated products and free entry","很多賣方、產品有差異、自由進入"]],"a":"D","e":["Monopoly: a single seller of a product without close substitutes, protected by barriers to entry.","獨占：單一賣方、產品沒有相近替代品，並受進入障礙保護。"]},{"k":"k","q":["For a single-price monopolist facing a downward-sloping demand curve, marginal revenue is","對面對負斜率需求曲線、只收單一價格的獨占者而言，邊際收益"],"o":[["less than price for every unit after the first","從第二單位起都小於價格"],["equal to price","等於價格"],["always positive","永遠為正"],["greater than price","大於價格"],["equal to average total cost","等於平均總成本"]],"a":"A","e":["To sell one more unit the monopolist must lower the price on all units, so MR falls below P.","要多賣一單位，獨占者必須降低所有單位的價格，所以 MR 小於 P。"]},{"k":"c","q":["A monopolist faces the demand schedule shown. What is the marginal revenue from selling the third unit?","某獨占者面對下表的需求。賣出第 3 單位的邊際收益是多少？"],"o":["$2","$4","$6","$8","$24"],"a":"C","e":["Total revenue is 10, 18, 24, 28, 30. MR of the 3rd unit = 24 − 18 = $6.","總收益依序為 10、18、24、28、30。第 3 單位的 MR = 24 − 18 = 6 美元。"],"tbl":{"h":[["Price ($)","價格（美元）"],["Quantity demanded","需求量"]],"r":[[10,1],[9,2],[8,3],[7,4],[6,5]]}},{"k":"c","q":["Using the same demand schedule, if the monopolist’s marginal cost is constant at $4, what output and price maximize its profit?","根據同一張需求表，若獨占者的邊際成本固定為 4 美元，利潤最大的產量與價格是多少？"],"o":[["4 units at $4","4 單位，4 美元"],["3 units at $8","3 單位，8 美元"],["5 units at $6","5 單位，6 美元"],["4 units at $7","4 單位，7 美元"],["6 units at $4","6 單位，4 美元"]],"a":"D","e":["MR is 10, 8, 6, 4, 2. MR = MC = $4 at the 4th unit, and the demand curve gives a price of $7 for 4 units.","MR 依序為 10、8、6、4、2，第 4 單位時 MR = MC = 4；需求表上 4 單位對應價格 7 美元。"],"tbl":{"h":[["Price ($)","價格（美元）"],["Quantity demanded","需求量"]],"r":[[10,1],[9,2],[8,3],[7,4],[6,5]]}},{"k":"k","q":["A profit-maximizing monopolist always produces in the range of the demand curve where","追求利潤極大的獨占者，一定在需求曲線的哪一段生產？"],"o":[["marginal revenue is negative","邊際收益為負的一段"],["demand is unit elastic","單位彈性的一點"],["demand is inelastic","需求缺乏彈性的一段"],["demand is elastic","需求有彈性的一段"],["price is below marginal cost","價格低於邊際成本的一段"]],"a":"D","e":["MC is positive, so MR = MC requires positive MR, which occurs only where demand is elastic.","MC 為正，MR = MC 表示 MR 為正，這只發生在需求有彈性的一段。"]},{"k":"k","q":["Compared with a perfectly competitive industry with the same costs, a monopoly","和成本相同的完全競爭產業相比，獨占會"],"o":[["charges a higher price, produces less and creates a deadweight loss","價格較高、產量較少，並產生無謂損失"],["is allocatively efficient but not productively efficient","有配置效率但沒有生產效率"],["earns zero economic profit in the long run","長期經濟利潤為零"],["charges a lower price and produces more","價格較低、產量較多"],["produces the same quantity at a higher price","產量相同但價格較高"]],"a":"A","e":["The monopolist restricts output to where MR = MC and charges more, so some mutually beneficial trades do not happen.","獨占者把產量限制在 MR = MC，並收取較高價格，有些互利的交易因此沒有發生。"]},{"k":"c","q":["A monopolist faces demand P = 20 − Q, so MR = 20 − 2Q. Marginal cost and average total cost are constant at $4. What is the monopolist’s maximum profit?","某獨占者的需求為 P = 20 − Q，所以 MR = 20 − 2Q。邊際成本與平均總成本固定為 4 美元。獨占者的最大利潤是多少？"],"o":["$32","$48","$64","$96","$128"],"a":"C","e":["MR = MC: 20 − 2Q = 4, so Q = 8 and P = 12. Profit = (12 − 4) × 8 = $64.","MR = MC：20 − 2Q = 4，Q = 8，P = 12。利潤 = (12 − 4) × 8 = 64 美元。"]},{"k":"c","q":["For the monopolist in the previous question, what is the deadweight loss?","承上題，這個獨占者造成的無謂損失是多少？"],"o":["$8","$16","$32","$64","$128"],"a":"C","e":["The efficient quantity is where P = MC: 20 − Q = 4, so Q = 16. DWL = ½ × (16 − 8) × (12 − 4) = $32.","有效率的數量在 P = MC：20 − Q = 4，Q = 16。DWL = ½ × (16 − 8) × (12 − 4) = 32 美元。"]},{"k":"c","q":["If the same monopolist (demand P = 20 − Q, MC = ATC = $4) could practice perfect price discrimination, its profit would be","如果同一個獨占者（需求 P = 20 − Q，MC = ATC = 4 美元）能實施完全差別取價，它的利潤會是"],"o":["$32","$64","$96","$128","$160"],"a":"D","e":["It sells 16 units, charging each buyer’s maximum price, so profit is the whole area between demand and MC: ½ × 16 × (20 − 4) = $128.","它會賣 16 單位，對每位買方收取最高願付價格，利潤是需求線與 MC 之間的全部面積：½ × 16 × (20 − 4) = 128 美元。"]},{"k":"k","q":["Under perfect price discrimination,","在完全差別取價下，"],"o":[["deadweight loss is larger than under single-price monopoly","無謂損失比單一價格的獨占更大"],["consumer surplus is maximized","消費者剩餘最大"],["marginal revenue is below price","邊際收益低於價格"],["output is lower than under single-price monopoly","產量低於單一價格的獨占"],["consumer surplus is zero and there is no deadweight loss","消費者剩餘為零，而且沒有無謂損失"]],"a":"E","e":["Each unit is sold at the buyer’s willingness to pay, so MR = P, output reaches the efficient level, and all surplus goes to the firm.","每單位都以買方的願付價格出售，MR = P，產量達到有效率水準，剩餘全部歸廠商。"]},{"k":"k","q":["Which condition is necessary for a firm to practice price discrimination?","廠商要實施差別取價，下列哪一個條件是必要的？"],"o":[["It has no fixed costs","沒有固定成本"],["It sells in a perfectly competitive market","在完全競爭市場中銷售"],["Its marginal cost is zero","邊際成本為零"],["All customers have the same price elasticity","所有顧客的價格彈性都相同"],["It can prevent customers from reselling the good","能防止顧客轉售商品"]],"a":"E","e":["Price discrimination requires market power, groups with different elasticities, and a way to stop resale.","差別取價需要市場力量、彈性不同的顧客群，以及防止轉售的方法。"]},{"k":"k","q":["A natural monopoly occurs when","自然獨占發生在"],"o":[["economies of scale are so large that one firm can supply the whole market at the lowest average cost","規模經濟很大，由一家廠商供應整個市場的平均成本最低"],["a firm owns a patent","廠商擁有專利"],["the government bans entry into the industry","政府禁止其他廠商進入"],["firms agree to fix prices","廠商協議固定價格"],["a firm controls a natural resource such as a mine","廠商控制礦山等自然資源"]],"a":"A","e":["In a natural monopoly LRATC is still falling at the quantity the market demands, so one firm is cheapest.","自然獨占的長期平均成本在市場需求量的範圍內仍在下降，一家廠商生產最便宜。"]},{"k":"k","q":["If regulators force a natural monopoly to charge the socially optimal price (P = MC), the firm will","如果主管機關要求自然獨占以社會最適價格（P = MC）定價，這家廠商會"],"o":[["produce less than the unregulated monopoly","產量比不受管制時少"],["earn exactly zero economic profit","經濟利潤剛好為零"],["earn an economic loss and may need a subsidy","產生經濟損失，可能需要補貼"],["earn an economic profit","有經濟利潤"],["raise its price","提高價格"]],"a":"C","e":["For a natural monopoly ATC is above MC at that output, so P = MC is below ATC and the firm loses money.","自然獨占在該產量下 ATC 高於 MC，P = MC 低於 ATC，廠商會虧損。"]},{"k":"k","q":["A “fair-return” price for a regulated monopoly is set where","受管制獨占的「合理報酬」價格設定在"],"o":[["marginal revenue equals marginal cost","邊際收益等於邊際成本"],["price equals marginal cost","價格等於邊際成本"],["price equals average total cost","價格等於平均總成本"],["price equals average variable cost","價格等於平均變動成本"],["marginal revenue equals zero","邊際收益等於零"]],"a":"C","e":["At P = ATC the firm earns zero economic profit (a normal return).","P = ATC 時廠商經濟利潤為零，也就是賺取正常報酬。"]},{"k":"k","q":["The government imposes a lump-sum tax on a profit-maximizing monopolist. In the short run the monopolist’s price and output will","政府對追求利潤極大的獨占者課徵定額稅。短期內獨占者的價格與產量會"],"o":[["not change, and its profit will fall","不變，利潤減少"],["change so that price falls and output rises","價格下降、產量上升"],["both rise","都上升"],["both fall","都下降"],["change so that price rises and output falls","價格上升、產量下降"]],"a":"A","e":["A lump-sum tax is a fixed cost: it does not change MR or MC, so price and quantity stay the same.","定額稅是固定成本，不影響 MR 與 MC，所以價格與數量不變。"]},{"k":"k","q":["A per-unit tax on a monopolist’s output will","對獨占者的產量課徵從量稅會"],"o":[["leave price and output unchanged","價格與產量不變"],["lower price and raise output","價格下降、產量增加"],["affect only fixed cost","只影響固定成本"],["raise marginal cost, reduce output and raise price","提高邊際成本，使產量減少、價格上升"],["shift the demand curve to the right","使需求曲線右移"]],"a":"D","e":["A per-unit tax raises MC, so MR = MC occurs at a smaller quantity and a higher price.","從量稅提高 MC，MR = MC 出現在較小的產量與較高的價格。"]},{"k":"k","q":["In long-run equilibrium, a firm in monopolistic competition","長期均衡時，獨占性競爭廠商"],"o":[["is allocatively efficient","具有配置效率"],["produces at minimum average total cost","在最低平均總成本生產"],["faces a horizontal demand curve","面對水平的需求曲線"],["earns positive economic profit because of product differentiation","因為產品差異而有正的經濟利潤"],["earns zero economic profit, charges P > MC and has excess capacity","經濟利潤為零、P > MC，而且有產能過剩"]],"a":"E","e":["Free entry drives profit to zero (demand tangent to ATC), but at that point price is above MC and output is below minimum-ATC output.","自由進入使利潤歸零（需求與 ATC 相切），但此時價格高於 MC，產量低於最低 ATC 的產量。"]},{"k":"k","q":["The demand curve facing a firm in monopolistic competition is","獨占性競爭廠商面對的需求曲線是"],"o":[["upward sloping","正斜率"],["the same as the market demand curve","與市場需求曲線相同"],["downward sloping and relatively elastic","負斜率而且相對有彈性"],["perfectly inelastic","完全無彈性"],["perfectly elastic","完全有彈性"]],"a":"C","e":["Product differentiation gives some price-setting power, but many close substitutes keep demand fairly elastic.","產品差異帶來一些定價能力，但相近替代品很多，需求相當有彈性。"]},{"k":"k","q":["The key feature that distinguishes oligopoly from other market structures is","區分寡占與其他市場結構的關鍵特徵是"],"o":[["a single seller","只有一個賣方"],["free entry and exit","自由進出"],["a perfectly elastic demand curve","完全有彈性的需求曲線"],["identical products","產品相同"],["interdependence among a few large firms","少數大廠商之間的相互依存"]],"a":"E","e":["With only a few firms, each firm’s best choice depends on what its rivals do, which is why game theory is used.","只有少數廠商時，每家的最佳選擇取決於對手的行動，所以要用賽局理論分析。"]},{"k":"c","q":["Refer to the payoff matrix (payoffs are A, B). What is the Nash equilibrium?","參考下列報酬矩陣（報酬依序為 A, B）。納許均衡是什麼？"],"o":[["A plays Up and B plays Left","A 選上、B 選左"],["There is no Nash equilibrium","沒有納許均衡"],["A plays Up and B plays Right","A 選上、B 選右"],["A plays Down and B plays Left","A 選下、B 選左"],["A plays Down and B plays Right","A 選下、B 選右"]],"a":"E","e":["A’s dominant strategy is Down (7 > 5, 4 > 3) and B’s is Right (6 > 5, 3 > 2), so the equilibrium is (Down, Right) with payoffs (4, 3).","A 的優勢策略是下（7 > 5、4 > 3），B 的優勢策略是右（6 > 5、3 > 2），均衡為（下，右），報酬（4, 3）。"],"tbl":{"h":["",["B: Left","B：左"],["B: Right","B：右"]],"r":[[["A: Up","A：上"],"5, 5","3, 6"],[["A: Down","A：下"],"7, 2","4, 3"]]}},{"k":"c","q":["In the same matrix, which outcome gives the largest combined payoff, and is it a Nash equilibrium?","在同一個矩陣中，哪一個結果的雙方報酬總和最大？它是納許均衡嗎？"],"o":[["(Down, Right); yes","（下，右）；是"],["(Up, Right); yes","（上，右）；是"],["(Up, Left); no","（上，左）；不是"],["(Down, Left); no","（下，左）；不是"],["(Up, Left); yes","（上，左）；是"]],"a":"C","e":["(Up, Left) totals 10, the highest. It is not an equilibrium: A would switch to Down (7 > 5) and B to Right (6 > 5). This is a prisoners’ dilemma.","（上，左）總和 10 最高，但不是均衡：A 會改選下（7 > 5），B 會改選右（6 > 5），這是囚犯困境。"],"tbl":{"h":["",["B: Left","B：左"],["B: Right","B：右"]],"r":[[["A: Up","A：上"],"5, 5","3, 6"],[["A: Down","A：下"],"7, 2","4, 3"]]}},{"k":"c","q":["Two firms decide whether to advertise (payoffs are A, B). Which statement is correct?","兩家廠商決定是否打廣告（報酬依序為 A, B）。下列何者正確？"],"o":[["The Nash equilibrium is (Don’t, Don’t)","納許均衡是（不打廣告，不打廣告）"],["Both firms have a dominant strategy to advertise","兩家都有優勢策略「打廣告」"],["Neither firm has a dominant strategy","兩家都沒有優勢策略"],["A has a dominant strategy to advertise, B has no dominant strategy, and the Nash equilibrium is (Advertise, Don’t)","A 有優勢策略「打廣告」，B 沒有優勢策略，納許均衡是（打廣告，不打廣告）"],["B has a dominant strategy not to advertise","B 有優勢策略「不打廣告」"]],"a":"D","e":["A: 6 > 5 and 9 > 8, so advertising is dominant. B: if A advertises, Don’t (5 > 4); if A doesn’t, Advertise (7 > 6), so B has no dominant strategy. B responds to A’s advertising with Don’t: (9, 5).","A：6 > 5、9 > 8，打廣告是優勢策略。B：A 打廣告時選不打（5 > 4），A 不打時選打（7 > 6），B 沒有優勢策略。B 對 A 打廣告的最佳反應是不打，均衡為（9, 5）。"],"tbl":{"h":["",["B: Advertise","B：打廣告"],["B: Don’t","B：不打廣告"]],"r":[[["A: Advertise","A：打廣告"],"6, 4","9, 5"],[["A: Don’t","A：不打廣告"],"5, 7","8, 6"]]}},{"k":"c","q":["In the first payoff matrix (Up/Down, Left/Right), suppose A’s payoff from (Down, Right) falls from 4 to 2. What is the new Nash equilibrium?","在第一個報酬矩陣（上/下、左/右）中，假設 A 在（下，右）的報酬從 4 降到 2。新的納許均衡是什麼？"],"o":[["(Down, Right)","（下，右）"],["(Up, Right)","（上，右）"],["(Up, Left)","（上，左）"],["There is no Nash equilibrium","沒有納許均衡"],["(Down, Left)","（下，左）"]],"a":"B","e":["B still always prefers Right (6 > 5, 3 > 2). A’s best response to Right is now Up (3 > 2), so the equilibrium is (Up, Right).","B 仍然一定選右（6 > 5、3 > 2）。A 對「右」的最佳反應變成上（3 > 2），均衡為（上，右）。"],"tbl":{"h":["",["B: Left","B：左"],["B: Right","B：右"]],"r":[[["A: Up","A：上"],"5, 5","3, 6"],[["A: Down","A：下"],"7, 2","2, 3"]]}},{"k":"k","q":["Cartel agreements tend to break down because","卡特爾協議容易瓦解，是因為"],"o":[["members’ costs are identical","成員的成本都相同"],["each member can raise its own profit by secretly producing more than its quota","每個成員偷偷超產都能提高自己的利潤"],["demand for the product becomes perfectly elastic","產品需求變成完全有彈性"],["prices are set too low","價格定得太低"],["cartels always earn zero economic profit","卡特爾的經濟利潤總是零"]],"a":"B","e":["At the cartel price, P > MC for each member, so cheating on output is individually profitable, just as in a prisoners’ dilemma.","在卡特爾價格下每個成員都是 P > MC，偷偷增產對個別成員有利，就像囚犯困境。"]}],"frq":[{"t":["A Profit-Maximizing Monopoly","追求利潤極大的獨占者"],"len":"Long","s":["A monopolist faces the demand curve P = 20 − Q, so its marginal revenue is MR = 20 − 2Q. Its marginal cost and average total cost are constant at $4.","某獨占者的需求曲線為 P = 20 − Q，邊際收益 MR = 20 − 2Q。邊際成本與平均總成本固定為 4 美元。"],"p":[{"q":["Draw a correctly labeled graph showing the demand, MR and MC = ATC curves. Label the profit-maximizing quantity Q_{m} and price P_{m}, and shade the monopoly profit.","畫出正確標示的需求、MR 與 MC = ATC 曲線，標出利潤最大的數量 Q_{m} 與價格 P_{m}，並把獨占利潤塗色。"],"a":["MR = MC gives Q_{m} = 8; the demand curve gives P_{m} = $12. Profit is the rectangle from $4 to $12 over 0 to 8 units.","由 MR = MC 得 Q_{m} = 8，需求線上對應 P_{m} = 12 美元。利潤是 0 到 8 單位、4 到 12 美元之間的長方形。"],"af":{"xm":22,"ym":22,"xl":"Quantity","yl":"Price ($)","xt":[[8,"8"],[16,"16"]],"yt":[[4,"4"],[12,"12"],[20,"20"]],"sh":[{"p":[[0,12],[8,12],[8,4],[0,4]],"c":"d","l":"Profit"},{"p":[[8,12],[16,4],[8,4]],"c":"c","l":"DWL","lx":10.6,"ly":6.6}],"ln":[{"p":[[0,20],[20,0]],"c":"d","l":"D"},{"p":[[0,20],[10,0]],"c":"p","l":"MR"},{"p":[[0,4],[21,4]],"c":"m","l":"MC = ATC","lp":[21,5],"la":"end"}],"g":[[8,12,"Q_m","P_m"]],"pt":[{"x":8,"y":12}]}},{"q":["Calculate the profit-maximizing quantity, price and profit.","計算利潤最大的數量、價格與利潤。"],"a":["20 − 2Q = 4 gives Q = 8 and P = 20 − 8 = $12. Profit = (12 − 4) × 8 = $64.","20 − 2Q = 4，Q = 8，P = 20 − 8 = 12 美元。利潤 = (12 − 4) × 8 = 64 美元。"]},{"q":["Is the monopolist allocatively efficient? Explain. Then calculate the deadweight loss and shade it on your graph.","這個獨占者有配置效率嗎？請說明，並計算無謂損失，在圖上塗色。"],"a":["No: P = $12 is greater than MC = $4. The efficient quantity is 16 (where P = MC), so DWL = ½ × (16 − 8) × (12 − 4) = $32.","沒有：P = 12 大於 MC = 4。有效率數量是 P = MC 的 16 單位，DWL = ½ × (16 − 8) × (12 − 4) = 32 美元。"]},{"q":["If the government sets the price at the socially optimal level, what quantity is produced and what is the firm’s economic profit?","如果政府把價格訂在社會最適水準，產量是多少？廠商的經濟利潤是多少？"],"a":["P = MC = $4, so Q = 16 and profit = (4 − 4) × 16 = $0.","P = MC = 4 美元，Q = 16，利潤 = (4 − 4) × 16 = 0。"]},{"q":["Instead, the government imposes a lump-sum tax of $20 on the unregulated monopolist. How do its price, quantity and profit change?","若政府改為對不受管制的獨占者課徵 20 美元的定額稅，它的價格、數量與利潤會如何變化？"],"a 7],[4.6725,2.9965],[4.74,2.9584],[4.8075,2.9244],[4.875,2.8945],[4.9425,2.8687],[5.01,2.847],[5.0775,2.8295],[5.145,2.816],[5.2125,2.8066],[5.28,2.8013],[5.3475,2.8001],[5.415,2.803],[5.4825,2.81],[5.55,2.8211],[5.6175,2.8363],[5.685,2.8557],[5.7525,2.8791],[5.82,2.9066],[5.8875,2.9382],[5.955,2.9739],[6.0225,3.0137],[6.09,3.0576],[6.1575,3.1057],[6.225,3.1578],[6.2925,3.214],[6.36,3.2743],[6.4275,3.3387],[6.495,3.4073],[6.5625,3.4799],[6.63,3.5566],[6.6975,3.6374],[6.765,3.7224],[6.8325,3.8114],[6.9,3.9045],[6.9675,4.0017],[7.035,4.1031],[7.1025,4.2085],[7.17,4.318],[7.2375,4.4316],[7.305,4.5494],[7.3725,4.6712],[7.44,4.7971],[7.5075,4.9272],[7.575,5.0613],[7.6425,5.1995],[7.71,5.3418],[7.7775,5.4883],[7.845,5.6388],[7.9125,5.7934],[7.98,5.9522],[8.0475,6.115],[8.115,6.282],[8.1825,6.453],[8.25,6.6281],[8.3175,6.8074],[8.385,6.9907],[8.4525,7.1781],[8.52,7.3697],[8.5875,7.5653],[8.655,7.7651],[8.7225,7.9689],[8.79,8.1768],[8.8575,8.3889],[8.925,8.605],[8.9925,8.8253],[9.06,9.0496],[9.1275,9.2781],[9.195,9.5106],[9.2625,9.7473],[9.33,9.988],[9.3975,10.2329],[9.465,10.4818],[9.5325,10.7349],[9.6,10.992]]}],"g":[[5,7.35]],"pt":[{"x":5,"y":7.35}]}},{"q":["In long-run equilibrium, is the coffee shop allocatively efficient? Is it productively efficient? Explain.","長期均衡時，這家咖啡店有配置效率嗎？有生產效率嗎？請說明。"],"a":["Neither. P is greater than MC, so it is not allocatively efficient; it produces to the left of minimum ATC (excess capacity), so it is not productively efficient.","兩者都沒有。P 大於 MC，沒有配置效率；產量在最低 ATC 的左邊（產能過剩），沒有生產效率。"]}]}]},{"id":"mi5","c":"micro","n":5,"t":["Factor Markets","要素市場"],"mcq":[{"k":"k","q":["The demand for labor is called a derived demand because it","勞動需求被稱為引申需求，是因為它"],"o":[["is always perfectly elastic","總是完全有彈性"],["is derived from the supply of labor","由勞動供給推導而來"],["depends only on the wage rate","只取決於工資"],["is set by the government","由政府決定"],["depends on the demand for the goods that labor helps produce","取決於勞動所生產商品的需求"]],"a":"E","e":["Firms want workers because of the output they produce, so labor demand comes from demand for the product.","廠商需要勞工是為了他們生產的產品，所以勞動需求來自產品需求。"]},{"k":"k","q":["A profit-maximizing firm hires workers up to the point where","追求利潤極大的廠商會僱用勞工直到"],"o":[["marginal product equals the wage","邊際產量等於工資"],["the wage equals the price of the product","工資等於產品價格"],["total product is maximized","總產量最大"],["marginal revenue product equals marginal factor (resource) cost","邊際收益產值等於邊際要素成本"],["average product is maximized","平均產量最大"]],"a":"D","e":["Hiring another worker pays as long as the revenue that worker adds (MRP) covers the cost of hiring them (MFC).","只要多僱一位勞工帶來的收益（MRP）足以支付僱用成本（MFC），就值得僱用。"]},{"k":"c","q":["A firm sells its output in a perfectly competitive market at $5 per unit. The fourth worker adds 6 units of output. What is the marginal revenue product of the fourth worker?","某廠商在完全競爭市場以每單位 5 美元出售產品。第四位勞工使產量增加 6 單位。第四位勞工的邊際收益產值是多少？"],"o":["$6","$11","$24","$30","$35"],"a":"D","e":["MRP = MP × MR = 6 × $5 = $30 (in a competitive output market MR = P).","MRP = MP × MR = 6 × 5 = 30 美元（完全競爭產品市場中 MR = P）。"]},{"k":"c","q":["A firm sells its product for $3 in a perfectly competitive market and hires labor in a perfectly competitive labor market at a wage of $15. Using the table, how many workers will it hire?","某廠商在完全競爭市場以 3 美元出售產品，並在完全競爭勞動市場以工資 15 美元僱用勞工。根據下表，它會僱用幾位勞工？"],"o":["1","2","3","4","5"],"a":"C","e":["MP = 10, 8, 6, 4, 2, so MRP = 30, 24, 18, 12, 6. Hire while MRP ≥ $15: three workers.","MP = 10、8、6、4、2，MRP = 30、24、18、12、6。只要 MRP ≥ 15 就僱用：共 3 位。"],"tbl":{"h":[["Workers","勞工人數"],["Total product","總產量"]],"r":[[0,0],[1,10],[2,18],[3,24],[4,28],[5,30]]}},{"k":"c","q":["Using the same table and product price, if the market wage falls from $15 to $9, how many additional workers will the firm hire?","根據同一張表與產品價格，若市場工資從 15 美元降到 9 美元，廠商會多僱用幾位勞工？"],"o":["0","1","2","3","4"],"a":"B","e":["At $9 the firm hires while MRP ≥ 9: workers 1–4 (MRP 12 ≥ 9), not the 5th (MRP 6). It goes from 3 to 4 workers.","工資 9 美元時，MRP ≥ 9 的勞工有第 1 到第 4 位（MRP 12 ≥ 9），第 5 位不僱（MRP 6），從 3 位增加到 4 位。"],"tbl":{"h":[["Workers","勞工人數"],["Total product","總產量"]],"r":[[0,0],[1,10],[2,18],[3,24],[4,28],[5,30]]}},{"k":"k","q":["A firm that is a monopolist in its output market has a marginal revenue product of labor that is lower than the value of the marginal product because","在產品市場是獨占者的廠商，其勞動邊際收益產值低於邊際產值，原因是"],"o":[["marginal product is negative","邊際產量為負"],["marginal revenue is less than price","邊際收益小於價格"],["it pays a higher wage","它付比較高的工資"],["it faces a horizontal demand curve","它面對水平的需求曲線"],["its workers are less productive","它的勞工生產力比較低"]],"a":"B","e":["MRP = MP × MR while VMP = MP × P. For a monopolist MR < P, so MRP < VMP.","MRP = MP × MR，VMP = MP × P；獨占者 MR < P，所以 MRP < VMP。"]},{"k":"k","q":["Which of the following would shift a firm’s demand curve for labor to the right?","下列何者會使廠商的勞動需求曲線右移？"],"o":[["An increase in the price of the product the workers make","勞工所生產產品的價格上漲"],["An increase in the wage rate","工資上升"],["A decrease in workers’ productivity","勞工生產力下降"],["A decrease in the wage rate","工資下降"],["A decrease in demand for the product","產品需求減少"]],"a":"A","e":["Higher output prices raise MRP = MP × P at every level of employment. A change in the wage is a movement along the curve.","產品價格上漲使每個僱用量的 MRP = MP × P 都提高；工資改變只是沿著曲線移動。"]},{"k":"k","q":["An increase in the market wage, other things equal, causes a firm to","其他條件不變，市場工資上升會使廠商"],"o":[["hire more workers","僱用更多勞工"],["shift its labor demand curve to the right","勞動需求曲線右移"],["shift its labor demand curve to the left","勞動需求曲線左移"],["raise its product price","提高產品價格"],["move up along its labor demand curve and hire fewer workers","沿著勞動需求曲線往上移動，僱用較少勞工"]],"a":"E","e":["A change in the wage changes the quantity of labor demanded, not labor demand itself.","工資改變影響的是勞動需求量，不是勞動需求本身。"]},{"k":"k","q":["For a firm hiring in a perfectly competitive labor market, the supply of labor to the firm is","對在完全競爭勞動市場僱用勞工的廠商而言，它面對的勞動供給是"],"o":[["upward sloping, so MFC is above the wage","正斜率，所以 MFC 高於工資"],["vertical at the number of workers hired","在僱用人數處的垂直線"],["downward sloping","負斜率"],["horizontal at the market wage, so MFC equals the wage","在市場工資處的水平線，所以 MFC 等於工資"],["the same as the market labor demand curve","與市場勞動需求曲線相同"]],"a":"D","e":["The firm is a wage taker: it can hire as many workers as it wants at the market wage, so each extra worker costs exactly the wage.","廠商是工資接受者，以市場工資想僱多少就僱多少，每多一位勞工的成本就是工資。"]},{"k":"k","q":["Which of the following would increase the market supply of nurses?","下列何者會增加護理師的市場供給？"],"o":[["An increase in the demand for health care","醫療需求增加"],["New licensing rules that are harder to meet","更嚴格的執照規定"],["An increase in the number of trained nurses immigrating into the country","受過訓練的護理師移民進來的人數增加"],["Higher wages in other jobs nurses could do","護理師可從事的其他工作工資上升"],["An increase in the wage paid to nurses","護理師的工資上升"]],"a":"C","e":["More qualified workers shift labor supply right. A higher nurse wage is a movement along supply; better alternatives and stricter licensing reduce supply.","合格勞工增加使勞動供給右移；工資上升是沿著供給曲線移動；其他工作更好或執照更嚴則使供給減少。"]},{"k":"c","q":["A firm’s marginal product of labor is 20 and the wage is $10. Its marginal product of capital is 30 and the rental price of capital is $20. To produce its output at the lowest cost, the firm should","某廠商的勞動邊際產量為 20，工資 10 美元；資本邊際產量為 30，資本租金 20 美元。為了以最低成本生產，廠商應該"],"o":[["use less of both inputs","兩種投入都少用"],["keep its current input combination","維持目前的投入組合"],["use more of both inputs","兩種投入都多用"],["use more labor and less capital","多用勞動、少用資本"],["use more capital and less labor","多用資本、少用勞動"]],"a":"D","e":["MP per dollar: labor 20/10 = 2, capital 30/20 = 1.5. Labor gives more output per dollar, so shift spending toward labor until the ratios are equal.","每一元的邊際產量：勞動 20/10 = 2，資本 30/20 = 1.5。勞動較划算，應把支出移向勞動，直到兩者相等。"]},{"k":"c","q":["A firm is using the least-cost combination of labor and capital. The marginal product of labor is 40, the wage is $20, and the rental price of capital is $30. What is the marginal product of capital?","某廠商使用最低成本的勞動與資本組合。勞動邊際產量為 40，工資 20 美元，資本租金 30 美元。資本的邊際產量是多少？"],"o":["20","30","40","60","80"],"a":"D","e":["Least-cost rule: MP_{L}/w = MP_{K}/r, so 40/20 = MP_{K}/30 and MP_{K} = 60.","最低成本法則：MP_{L}/w = MP_{K}/r，40/20 = MP_{K}/30，MP_{K} = 60。"]},{"k":"k","q":["A firm is using the profit-maximizing combination of labor and capital when","廠商使用利潤最大的勞動與資本組合，條件是"],"o":[["MP_{L}/w = MP_{K}/r, whatever the level of output","MP_{L}/w = MP_{K}/r，不論產量多少"],["MRP_{L} = wage and MRP_{K} = rental price of capital","MRP_{L} = 工資，而且 MRP_{K} = 資本租金"],["the wage equals the rental price of capital","工資等於資本租金"],["MRP_{L} = MRP_{K}","MRP_{L} = MRP_{K}"],["MP_{L} = MP_{K}","MP_{L} = MP_{K}"]],"a":"B","e":["Profit maximization requires each input to be hired until its MRP equals its price. The least-cost rule alone does not pick the output level.","利潤最大要求每種投入都僱用到 MRP 等於其價格；只滿足最低成本法則還不能決定產量。"]},{"k":"k","q":["Compared with a perfectly competitive labor market, a monopsony employer hires","和完全競爭勞動市場相比，獨買雇主會"],"o":[["the same number of workers at a lower wage","以較低工資僱用相同人數"],["more workers at a lower wage","以較低工資僱用較多勞工"],["fewer workers at a lower wage","以較低工資僱用較少勞工"],["fewer workers at a higher wage","以較高工資僱用較少勞工"],["more workers at a higher wage","以較高工資僱用較多勞工"]],"a":"C","e":["The monopsonist hires where MRP = MFC, with MFC above the supply curve, then pays only the wage on the supply curve.","獨買者在 MRP = MFC 決定僱用量，MFC 高於供給線，工資只付供給線上的水準。"]},{"k":"c","q":["A monopsonist faces the labor supply schedule below. What is the marginal factor cost of hiring the third worker?","某獨買者面對下列勞動供給表。僱用第三位勞工的邊際要素成本是多少？"],"o":["$8","$10","$11","$12","$30"],"a":"D","e":["Total factor cost: 1 × 8 = 8, 2 × 9 = 18, 3 × 10 = 30. MFC of the 3rd worker = 30 − 18 = $12, more than the $10 wage because all workers get the raise.","總要素成本：8、18、30。第 3 位的 MFC = 30 − 18 = 12 美元，高於工資 10 美元，因為所有勞工都要加薪。"],"tbl":{"h":[["Workers","勞工人數"],["Wage ($)","工資（美元）"]],"r":[[1,8],[2,9],[3,10],[4,11]]}},{"k":"k","q":["In a monopsony labor market, a minimum wage set between the monopsony wage and the competitive wage will","在獨買勞動市場中，若最低工資訂在獨買工資與競爭工資之間，會"],"o":[["lower both the wage and employment","使工資與就業都減少"],["have no effect","沒有任何影響"],["raise the wage but lower employment","使工資上升但就業減少"],["raise both the wage and employment","使工資與就業都增加"],["create a surplus of labor equal to the monopsony employment","造成與獨買僱用量相等的勞動過剩"]],"a":"D","e":["The minimum wage makes MFC flat at that wage, so the monopsonist hires more workers, up to where the supply curve meets it.","最低工資使 MFC 在該工資處變成水平，獨買者會增加僱用，直到供給線與它相交。"]},{"k":"k","q":["A minimum wage set above the equilibrium wage in a perfectly competitive labor market will","在完全競爭勞動市場中，高於均衡工資的最低工資會"],"o":[["increase employment","增加就業"],["have no effect on employment","對就業沒有影響"],["create a shortage of labor","造成勞動短缺"],["lower the wage","使工資下降"],["create a surplus of labor (unemployment)","造成勞動過剩（失業）"]],"a":"E","e":["At a wage above equilibrium, more people want to work than firms want to hire.","工資高於均衡時，想工作的人多於廠商想僱用的人。"]},{"k":"k","q":["Coal miners earn more than office clerks with similar skills. This is best explained by","與技能相近的辦公室職員相比，煤礦工人的工資比較高。這最能用下列何者解釋？"],"o":[["monopsony power of mining companies","礦業公司的獨買力量"],["a minimum wage law","最低工資法"],["a surplus of miners","礦工過剩"],["a compensating wage differential for dangerous work","危險工作的補償性工資差異"],["lower productivity of miners","礦工生產力較低"]],"a":"D","e":["Unpleasant or risky jobs must pay more to attract workers: a compensating differential.","辛苦或危險的工作必須付比較高的工資才請得到人，這是補償性工資差異。"]},{"k":"k","q":["A supermarket installs self-checkout machines that replace cashiers. Other things equal, the demand for cashiers will","超市裝設自助結帳機取代收銀員。其他條件不變，收銀員的需求會"],"o":[["decrease, because the machines are a substitute for cashiers","減少，因為機器是收銀員的替代品"],["increase, because the machines are a complement","增加，因為機器是互補品"],["become perfectly inelastic","變成完全無彈性"],["increase, because sales rise","增加，因為銷售增加"],["not change, because wages are unchanged","不變，因為工資沒變"]],"a":"A","e":["When capital substitutes for a type of labor and becomes cheaper or better, demand for that labor falls.","當資本可以替代某種勞動並變得更便宜或更好時，該勞動的需求會減少。"]},{"k":"k","q":["A firm’s demand curve for labor is the same as its","廠商的勞動需求曲線就是它的"],"o":[["total product curve","總產量曲線"],["marginal factor cost curve","邊際要素成本曲線"],["average product curve","平均產量曲線"],["marginal revenue product curve","邊際收益產值曲線"],["marginal product curve","邊際產量曲線"]],"a":"D","e":["At each wage the firm hires until MRP equals that wage, so the MRP curve shows how many workers it demands at each wage.","在每個工資下，廠商僱用到 MRP 等於工資，所以 MRP 曲線就表示各工資下的勞動需求量。"]},{"k":"c","q":["A monopolist sells 10 units at $50 each with 3 workers. Hiring a 4th worker raises output to 14 units, which it can sell only at $45 each. What is the marginal revenue product of the 4th worker?","某獨占者用 3 位勞工生產 10 單位，每單位賣 50 美元。僱用第 4 位勞工後產量增加到 14 單位，但只能以每單位 45 美元出售。第 4 位勞工的邊際收益產值是多少？"],"o":["$45","$50","$130","$180","$630"],"a":"C","e":["Total revenue rises from 10 × $50 = $500 to 14 × $45 = $630, so MRP = $130 (less than 4 × $45 = $180 because the price fell).","總收益從 10 × 50 = 500 增加到 14 × 45 = 630，MRP = 130 美元（因為價格下降，小於 4 × 45 = 180）。"]}],"frq":[{"t":["A Perfectly Competitive Labor Market","完全競爭勞動市場"],"len":"Long","s":["A firm sells its output in a perfectly competitive market at $5 per unit and hires workers in a perfectly competitive labor market where the wage is $20.","某廠商在完全競爭產品市場以每單位 5 美元出售產品，並在工資 20 美元的完全競爭勞動市場僱用勞工。"],"tbl":{"h":[["Workers","勞工"],["Total product","總產量"],["Marginal product","邊際產量"],["MRP ($)","邊際收益產值（美元）"]],"r":[[0,0,"—","—"],[1,12,12,60],[2,22,10,50],[3,30,8,40],[4,36,6,30],[5,40,4,20],[6,42,2,10]],"b":[[2,2],[3,3],[4,2],[4,3],[5,3],[6,2],[6,3]]},"p":[{"q":["Complete the table.","把表格填完。"],"a":["MP = change in total product; MRP = MP × $5. The filled values are highlighted in the table.","MP = 總產量的變動；MRP = MP × 5 美元。填好的數值在表中以底色標示。"]},{"q":["How many workers will the firm hire? Explain.","廠商會僱用幾位勞工？請說明。"],"a":["5 workers. The firm hires until MRP = MFC = wage: the 5th worker’s MRP is $20, equal to the wage, and the 6th worker’s MRP ($10) is below it.","5 位。廠商僱用到 MRP = MFC = 工資：第 5 位的 MRP 為 20 美元，等於工資；第 6 位的 MRP（10 美元）低於工資。"]},{"q":["Draw correctly labeled side-by-side graphs of the labor market and the firm. Show the market wage W_{m}, the firm’s MFC, its MRP (labor demand) and the number of workers it hires, Q_{f}.","並排畫出勞動市場與廠商正確標示的圖，標出市場工資 W_{m}、廠商的 MFC、MRP（勞動需求）與僱用人數 Q_{f}。"],"a":["Market: labor supply and demand set W_{m} = $20. Firm: a horizontal line at $20 is its labor supply = MFC; the downward-sloping MRP crosses it at Q_{f} = 5.","市場：勞動供給與需求決定 W_{m} = 20 美元。廠商：20 美元的水平線是它面對的勞動供給 = MFC；負斜率的 MRP 在 Q_{f} = 5 與它相交。"],"af":[{"w":300,"xm":10,"ym":10,"xl":"Q of labor (market)","yl":"Wage","yt":[[5,"W_m = $20"]],"ln":[{"p":[[1,9],[9,1]],"c":"d","l":"D_L"},{"p":[[1,1],[9,9]],"c":"s","l":"S_L"}],"g":[[5,5]],"pt":[{"x":5,"y":5}]},{"w":300,"xm":7,"ym":70,"xl":"Q of labor (firm)","yl":"Wage, MRP","xt":[[5,"5"]],"yt":[[20,"$20"]],"ln":[{"p":[[1,60],[6,10]],"c":"d","l":"MRP = D"},{"p":[[0,20],[6.8,20]],"c":"s","l":"S = MFC","lp":[6.8,24],"la":"end"}],"g":[[5,20]],"pt":[{"x":5,"y":20}]}]},{"q":["The price of the firm’s product rises to $10. How many workers will the firm now hire? Show your calculation.","產品價格上漲到 10 美元。廠商現在會僱用幾位勞工？請列出計算。"],"a":["MRP doubles to 120, 100, 80, 60, 40, 20. At a $20 wage the firm hires 6 workers (the 6th worker’s MRP is $20).","MRP 變成兩倍：120、100、80、60、40、20。工資 20 美元時廠商僱用 6 位（第 6 位 MRP 為 20 美元）。"]},{"q":["Instead, many new workers enter this labor market. What happens to the market wage and to the number of workers this firm hires?","若改為有許多新勞工進入這個勞動市場，市場工資與這家廠商的僱用人數會如何變化？"],"a":["Market labor supply increases, so the market wage falls. The firm’s MFC line shifts down and it hires more workers.","市場勞動供給增加，市場工資下降。廠商的 MFC 線下移，僱用人數增加。"]}]},{"t":["A Monopsony Employer","獨買雇主"],"len":"Short","s":["A factory is the only employer in a small town. The table shows the wage it must pay to attract each number of workers and each worker’s MRP.","某工廠是小鎮上唯一的雇主。下表是吸引各人數勞工所需的工資，以及每位勞工的 MRP。"],"tbl":{"h":[["Workers","勞工"],["Wage ($)","工資（美元）"],["Total factor cost ($)","總要素成本"],["MFC ($)","邊際要素成本"],["MRP ($)","邊際收益產值"]],"r":[[1,4,4,4,30],[2,6,12,8,26],[3,8,24,12,22],[4,10,40,16,18],[5,12,60,20,14],[6,14,84,24,10]],"b":[[1,2],[2,2],[2,3],[3,2],[3,3],[4,3],[5,2],[5,3]]},"p":[{"q":["Complete the table.","把表格填完。"],"a":["Total factor cost = workers × wage; MFC = change in total factor cost. The filled values are highlighted in the table.","總要素成本 = 人數 × 工資；MFC = 總要素成本的變動。填好的數值在表中以底色標示。"]},{"q":["How many workers will the monopsonist hire, and what wage will it pay?","獨買者會僱用幾位勞工？付多少工資？"],"a":["4 workers: the 4th worker’s MRP ($18) exceeds MFC ($16), but the 5th worker’s MRP ($14) is below MFC ($20). It pays the wage on the supply schedule for 4 workers, $10.","4 位：第 4 位的 MRP（18）大於 MFC（16），第 5 位的 MRP（14）小於 MFC（20）。工資依供給表 4 人的水準，付 10 美元。"]},{"q":["Draw a correctly labeled monopsony graph showing the labor supply, MFC and MRP curves. Label the monopsony quantity Q_{m} and wage W_{m}.","畫出正確標示的獨買圖，包含勞動供給、MFC 與 MRP 曲線，標出獨買僱用量 Q_{m} 與工資 W_{m}。"],"a":["MFC lies above the supply curve. Q_{m} is where MRP = MFC; W_{m} is read down to the supply curve at Q_{m}, below MRP.","MFC 位於供給線上方。Q_{m} 在 MRP = MFC 處；W_{m} 由 Q_{m} 往下對到供給線，低於 MRP。"],"af":{"xm":8,"ym":36,"xl":"Quantity of labor","yl":"Wage, MRP","xt":[[4,"Q_m = 4"],[5.33,"Q_c"]],"yt":[[10,"W_m = $10"]],"ln":[{"p":[[0,2],[8,18]],"c":"s","l":"S = AFC"},{"p":[[0,2],[7.8,33.2]],"c":"m","l":"MFC"},{"p":[[0,34],[8,2]],"c":"d","l":"MRP = D"}],"g":[[4,18],[4,10]],"pt":[{"x":4,"y":18},{"x":4,"y":10},{"x":5.33,"y":12.67,"o":1,"l":"competitive","dy":18}]}},{"q":["If this labor market were perfectly competitive, how many workers would be hired and at what wage? Use the table.","如果這個勞動市場是完全競爭的，會僱用幾位勞工？工資是多少？請用表格回答。"],"a":["Hire until MRP ≥ wage: the 5th worker (MRP $14 ≥ wage $12) but not the 6th (MRP $10 < $14). So 5 workers at a wage of $12, more workers at a higher wage than under monopsony.","僱用到 MRP ≥ 工資：第 5 位（MRP 14 ≥ 工資 12）會被僱用，第 6 位（MRP 10 < 14）不會。共 5 位、工資 12 美元，人數與工資都高於獨買。"]}]}]},{"id":"mi6","c":"micro","n":6,"t":["Market Failure and the Role of Government","市場失靈與政府角色"],"mcq":[{"k":"k","q":["When the production of a good creates a negative externality, the unregulated market quantity is","當某商品的生產產生負外部性時，未受管制的市場數量"],"o":[["less than the socially optimal quantity","小於社會最適數量"],["zero","為零"],["equal to the socially optimal quantity","等於社會最適數量"],["greater than the socially optimal quantity","大於社會最適數量"],["determined by marginal social benefit alone","只由社會邊際利益決定"]],"a":"D","e":["Producers ignore the external cost, so the market uses MPC instead of the higher MSC and overproduces.","生產者忽略外部成本，用較低的 MPC 而非 MSC 決策，因此生產過多。"]},{"k":"k","q":["Flu vaccines create a positive externality in consumption. Without government action,","流感疫苗在消費上產生正外部性。若政府不介入，"],"o":[["the market quantity is efficient","市場數量有效率"],["marginal private benefit exceeds marginal social benefit, and too many vaccines are bought","私人邊際利益大於社會邊際利益，疫苗購買量太多"],["marginal social benefit exceeds marginal private benefit, and too few vaccines are bought","社會邊際利益大於私人邊際利益，疫苗購買量太少"],["the price of vaccines is too low","疫苗價格太低"],["marginal social cost exceeds marginal private cost","社會邊際成本大於私人邊際成本"]],"a":"C","e":["Buyers count only their own benefit, not the protection others get, so demand (MPB) is below MSB and the market underproduces.","買方只考慮自己的利益，不計別人得到的保護，需求（MPB）低於 MSB，市場數量太少。"]},{"k":"k","q":["To correct a negative externality, the efficient per-unit (Pigouvian) tax should equal","為了矯正負外部性，有效率的每單位（皮古）稅應等於"],"o":[["the firm’s total profit","廠商的總利潤"],["the marginal external cost at the socially optimal quantity","社會最適數量下的邊際外部成本"],["the firm’s average total cost","廠商的平均總成本"],["the marginal private benefit","私人邊際利益"],["the market price of the good","商品的市場價格"]],"a":"B","e":["A tax equal to the external cost makes producers face the full social cost, moving output to where MSB = MSC.","稅額等於外部成本，讓生產者面對完整的社會成本，產量移到 MSB = MSC。"]},{"k":"c","q":["In a market, demand (MPB = MSB) is P = 20 − 0.2Q and marginal private cost is P = 2 + 0.1Q. Each unit produced causes $3 of pollution damage. Compared with the socially optimal quantity, the market overproduces by","某市場的需求（MPB = MSB）為 P = 20 − 0.2Q，私人邊際成本為 P = 2 + 0.1Q。每生產一單位造成 3 美元的污染損害。和社會最適數量相比，市場多生產了"],"o":["5","10","15","50","60"],"a":"B","e":["Market: 20 − 0.2Q = 2 + 0.1Q gives Q = 60. Optimum uses MSC = 5 + 0.1Q: 20 − 0.2Q = 5 + 0.1Q gives Q = 50. Overproduction = 10.","市場：20 − 0.2Q = 2 + 0.1Q，Q = 60。最適用 MSC = 5 + 0.1Q：20 − 0.2Q = 5 + 0.1Q，Q = 50。多生產 10 單位。"]},{"k":"c","q":["For the market in the previous question, what is the deadweight loss from the externality?","承上題，這個外部性造成的無謂損失是多少？"],"o":["$10","$15","$30","$60","$150"],"a":"B","e":["The DWL triangle has a height of $3 (the external cost) and a base of 10 extra units: ½ × 3 × 10 = $15.","無謂損失三角形高 3 美元（外部成本）、底 10 單位：½ × 3 × 10 = 15 美元。"]},{"k":"c","q":["For a good with a positive externality, MPB = 30 − Q, MSB = 36 − Q and MC = 6 + Q. What per-unit subsidy leads to the socially optimal quantity, and how many more units are produced?","某商品有正外部性，MPB = 30 − Q，MSB = 36 − Q，MC = 6 + Q。每單位補貼多少可以達到社會最適數量？產量會增加多少？"],"o":[["$6 per unit; 3 more units","每單位 6 美元；增加 3 單位"],["$12 per unit; 15 more units","每單位 12 美元；增加 15 單位"],["$6 per unit; 6 more units","每單位 6 美元；增加 6 單位"],["$3 per unit; 3 more units","每單位 3 美元；增加 3 單位"],["$36 per unit; 12 more units","每單位 36 美元；增加 12 單位"]],"a":"A","e":["Market: 30 − Q = 6 + Q, so Q = 12. Optimum: 36 − Q = 6 + Q, so Q = 15. A subsidy equal to the $6 external benefit raises output by 3 units.","市場：30 − Q = 6 + Q，Q = 12；最適：36 − Q = 6 + Q，Q = 15。補貼等於外部利益 6 美元，產量增加 3 單位。"]},{"k":"k","q":["A public good is","公共財是"],"o":[["nonrival and nonexcludable","不具敵對性也不具排他性"],["any good produced by the government","任何由政府生產的商品"],["rival but nonexcludable","具敵對性但不具排他性"],["nonrival but excludable","不具敵對性但具排他性"],["rival and excludable","具敵對性也具排他性"]],"a":"A","e":["One person’s use does not reduce another’s (nonrival), and nonpayers cannot be kept out (nonexcludable), like national defense.","一個人使用不會減少別人能用的量（無敵對性），也無法排除不付費者（無排他性），例如國防。"]},{"k":"k","q":["Private markets tend to underprovide public goods mainly because of","私人市場往往提供太少公共財，主要原因是"],"o":[["the law of demand","需求法則"],["price ceilings","價格上限"],["diminishing marginal returns","邊際報酬遞減"],["economies of scale","規模經濟"],["the free-rider problem","搭便車問題"]],"a":"E","e":["People can benefit without paying, so few are willing to pay and firms cannot earn enough revenue to supply the efficient amount.","人們不付錢也能受益，願意付費的人很少，廠商收不到足夠收入來提供有效率的數量。"]},{"k":"k","q":["Fish in the open ocean are overfished because they are","公海的魚會被過度捕撈，是因為牠們"],"o":[["rival but nonexcludable","具敵對性但不具排他性"],["rival and excludable","具敵對性也具排他性"],["nonrival and nonexcludable","不具敵對性也不具排他性"],["a public good","是公共財"],["nonrival but excludable","不具敵對性但具排他性"]],"a":"A","e":["Common resources are used up by each user (rival) but no one can be kept out (nonexcludable): the tragedy of the commons.","共有資源每用一份就少一份（敵對性），卻無法排除他人使用（無排他性），造成公地悲劇。"]},{"k":"c","q":["A town of three residents is deciding how many streetlights to install. Each light costs $30. The table shows each resident’s marginal benefit. What is the efficient number of streetlights?","某小鎮有三位居民，正在決定要裝幾盞路燈，每盞成本 30 美元。下表是每位居民的邊際利益。有效率的路燈數量是多少？"],"o":["0","1","2","3","4"],"a":"C","e":["For a public good, add marginal benefits vertically: 45, 30, 15. Install lights while MSB ≥ MC = $30: two lights.","公共財要把每個人的邊際利益垂直加總：45、30、15。只要 MSB ≥ MC = 30 就裝：共 2 盞。"],"tbl":{"h":[["Streetlight","路燈"],["Ann ($)","Ann（美元）"],["Ben ($)","Ben（美元）"],["Cal ($)","Cal（美元）"]],"r":[["1st (第 1 盞)",20,15,10],["2nd (第 2 盞)",14,10,6],["3rd (第 3 盞)",8,5,2]]}},{"k":"k","q":["According to the Coase theorem, an externality can be solved without government action if","根據寇斯定理，若下列條件成立，外部性不需政府介入也能解決："],"o":[["many people are affected and transaction costs are high","受影響的人很多而且交易成本很高"],["the government imposes a Pigouvian tax","政府課徵皮古稅"],["the market is a monopoly","市場是獨占"],["property rights are clearly defined and bargaining costs are low","財產權明確且協商成本低"],["the good is a public good","商品是公共財"]],"a":"D","e":["With clear rights and cheap negotiation, the parties can bargain to the efficient outcome on their own.","財產權明確、協商便宜時，當事人可以自行協商出有效率的結果。"]},{"k":"k","q":["A system of tradable pollution permits reduces pollution at the lowest total cost because","可交易的污染許可制度能以最低總成本減少污染，原因是"],"o":[["permits are free, so firms pollute less","許可是免費的，所以廠商減少排放"],["every firm must cut pollution by the same amount","每家廠商都必須減少相同的污染量"],["firms that can cut pollution cheaply do more of the cutting and sell their permits","減污成本低的廠商多減一些，並把許可賣掉"],["the government chooses which firms may pollute","由政府決定哪些廠商可以排放"],["it raises the price of the final good to zero","它使最終商品價格降為零"]],"a":"C","e":["Trading lets low-cost abaters reduce more and sell permits to high-cost firms, so the cap is met as cheaply as possible.","交易讓減污成本低的廠商多減並賣出許可給成本高的廠商，用最低成本達成總量上限。"]},{"k":"k","q":["A Lorenz curve that lies farther from the line of perfect equality indicates","離完全平均線越遠的勞倫茲曲線代表"],"o":[["less income inequality and a lower Gini coefficient","所得越平均，吉尼係數越低"],["a more progressive tax system","稅制越累進"],["greater income inequality and a higher Gini coefficient","所得越不平均，吉尼係數越高"],["greater inequality and a lower Gini coefficient","所得越不平均，吉尼係數越低"],["higher average income","平均所得越高"]],"a":"C","e":["The bigger the gap between the Lorenz curve and the equality line, the larger the Gini coefficient and the more unequal the distribution.","勞倫茲曲線與平均線的差距越大，吉尼係數越大，所得分配越不平均。"]},{"k":"c","q":["The area between a country’s Lorenz curve and the line of perfect equality is 0.15. The total area under the line of equality is 0.5. What is the Gini coefficient?","某國勞倫茲曲線與完全平均線之間的面積為 0.15，平均線以下的總面積為 0.5。吉尼係數是多少？"],"o":["0.15","0.30","0.35","0.50","0.65"],"a":"B","e":["Gini = area between the curves ÷ area under the equality line = 0.15 ÷ 0.5 = 0.30.","吉尼係數 = 兩線之間的面積 ÷ 平均線以下面積 = 0.15 ÷ 0.5 = 0.30。"]},{"k":"c","q":["A person earning $20,000 pays $2,000 in a tax, and a person earning $80,000 pays $6,000. This tax is","所得 20,000 美元的人繳稅 2,000 美元，所得 80,000 美元的人繳 6,000 美元。這種稅是"],"o":[["a Pigouvian tax","皮古稅"],["proportional","比例稅"],["a lump-sum tax","定額稅"],["regressive","累退稅"],["progressive","累進稅"]],"a":"D","e":["Average tax rates are 2,000/20,000 = 10% and 6,000/80,000 = 7.5%. The rate falls as income rises, so the tax is regressive.","平均稅率分別為 10% 與 7.5%，所得越高稅率越低，是累退稅。"]},{"k":"k","q":["In a progressive income tax system,","在累進所得稅制度下，"],"o":[["everyone pays the same dollar amount of tax","每個人繳一樣金額的稅"],["everyone pays the same tax rate","每個人的稅率都一樣"],["the average tax rate falls as income rises","平均稅率隨所得增加而下降"],["only low-income households pay tax","只有低所得家庭要繳稅"],["the average tax rate rises as income rises","平均稅率隨所得增加而上升"]],"a":"E","e":["Progressive: higher incomes pay a larger share of income in tax.","累進稅：所得越高，繳稅占所得的比例越大。"]},{"k":"k","q":["A sales tax on food is usually considered regressive because","食物的銷售稅通常被認為是累退的，因為"],"o":[["food is a luxury good","食物是奢侈品"],["only businesses pay the tax","只有企業要繳這個稅"],["low-income households spend a larger share of their income on food","低所得家庭花在食物上的支出占所得比例比較高"],["the tax rate rises with income","稅率隨所得上升"],["high-income households buy more food in total","高所得家庭購買的食物總量比較多"]],"a":"C","e":["Everyone pays the same rate on purchases, but poorer households spend more of their income on food, so the tax takes a larger share of their income.","購買時稅率相同，但低所得家庭把較多比例的所得花在食物，這個稅占他們所得的比例較高。"]},{"k":"k","q":["A price ceiling set between a monopolist’s marginal cost and its profit-maximizing price can","若價格上限訂在獨占者的邊際成本與利潤最大價格之間，可以"],"o":[["have no effect on the monopolist","對獨占者沒有影響"],["reduce output and increase deadweight loss","減少產量並增加無謂損失"],["create a shortage, as in a competitive market","像競爭市場一樣造成短缺"],["increase the monopolist’s profit","增加獨占者的利潤"],["increase output and reduce deadweight loss","增加產量並減少無謂損失"]],"a":"E","e":["The ceiling makes MR flat at the capped price, so the monopolist produces more, moving output toward the efficient level.","上限使 MR 在上限價格處變成水平，獨占者會增產，使產量接近有效率水準。"]},{"k":"k","q":["In a market with a positive externality in production, a per-unit subsidy to producers equal to the external benefit will","在生產有正外部性的市場中，給生產者等於外部利益的每單位補貼，會"],"o":[["shift the demand curve to the left","使需求曲線左移"],["create a deadweight loss where none existed","在原本沒有無謂損失的地方產生無謂損失"],["reduce output below the market level","使產量低於市場水準"],["raise the price consumers pay","提高消費者支付的價格"],["increase output to the socially optimal level","把產量提高到社會最適水準"]],"a":"E","e":["The subsidy lowers producers’ cost by the external benefit, so the market moves to where MSB = MSC.","補貼使生產者成本降低外部利益的金額，市場移到 MSB = MSC 的數量。"]},{"k":"c","q":["The table shows the cumulative share of income received by households in a country. What share of total income do the richest 20 percent of households receive?","下表是某國家庭的累積所得份額。最富有的 20% 家庭得到總所得的多少？"],"o":["25%","30%","45%","55%","100%"],"a":"C","e":["The poorest 80% receive 55%, so the richest 20% receive 100% − 55% = 45%.","最窮的 80% 得到 55%，所以最富的 20% 得到 100% − 55% = 45%。"],"tbl":{"h":[["Poorest … of households","最窮的 …% 家庭"],["Cumulative income share","累積所得份額"]],"r":[["20%","5%"],["40%","15%"],["60%","30%"],["80%","55%"],["100%","100%"]]}},{"k":"k","q":["Which policy would most directly reduce income inequality?","下列哪一項政策最能直接降低所得不平均？"],"o":[["A progressive income tax combined with transfer payments to low-income households","累進所得稅搭配給低所得家庭的移轉性支付"],["A regressive payroll tax","累退的薪資稅"],["Lower taxes on inheritance","降低遺產稅"],["A lump-sum tax on every household","對每個家庭課徵定額稅"],["A higher sales tax on necessities","提高必需品的銷售稅"]],"a":"A","e":["Taxing high incomes at higher rates and transferring income to poorer households narrows the gap.","對高所得課較高稅率並把所得移轉給較窮家庭，能縮小差距。"]}],"frq":[{"t":["Pollution from a Steel Market","鋼鐵市場的污染"],"len":"Long","s":["In the perfectly competitive steel market, demand (MPB = MSB) is P = 100 − Q and marginal private cost is P = 20 + Q. Each ton of steel causes $20 of pollution damage to people near the mills.","在完全競爭的鋼鐵市場中，需求（MPB = MSB）為 P = 100 − Q，私人邊際成本為 P = 20 + Q。每生產一噸鋼對工廠附近居民造成 20 美元的污染損害。"],"p":[{"q":["Draw a correctly labeled graph showing MPB = MSB, MPC and MSC. Label the market quantity Q_{m} and the socially optimal quantity Q_{s}.","畫出正確標示的 MPB = MSB、MPC 與 MSC 曲線，標出市場數量 Q_{m} 與社會最適數量 Q_{s}。"],"a":["MSC = MPC + $20 lies above MPC. Q_{m} is where demand meets MPC; Q_{s} is where demand meets MSC, to the left of Q_{m}.","MSC = MPC + 20，位於 MPC 上方。Q_{m} 是需求與 MPC 的交點，Q_{s} 是需求與 MSC 的交點，在 Q_{m} 左邊。"],"af":{"xm":110,"ym":110,"xl":"Quantity of steel","yl":"Price ($)","xt":[[30,"30"],[40,"40"]],"yt":[[60,"60"],[70,"70"]],"sh":[{"p":[[30,70],[40,80],[40,60]],"c":"c","l":"DWL","lx":47,"ly":74}],"ln":[{"p":[[0,100],[100,0]],"c":"d","l":"MPB = MSB"},{"p":[[0,20],[80,100]],"c":"s","l":"MPC"},{"p":[[0,40],[60,100]],"c":"m","l":"MSC"}],"g":[[40,60],[30,70]],"pt":[{"x":40,"y":60,"l":"market","dy":16},{"x":30,"y":70,"l":"optimal","a":"end","dx":-8}]}},{"q":["Calculate Q_{m} and Q_{s} and the prices at each.","計算 Q_{m} 與 Q_{s}，以及各自對應的價格。"],"a":["Market: 100 − Q = 20 + Q, so Q_{m} = 40 and P = $60. Optimum: 100 − Q = 40 + Q, so Q_{s} = 30 and P = $70.","市場：100 − Q = 20 + Q，Q_{m} = 40，P = 60 美元。最適：100 − Q = 40 + Q，Q_{s} = 30，P = 70 美元。"]},{"q":["Shade the deadweight loss on your graph and calculate its value.","在圖上把無謂損失塗色，並計算其金額。"],"a":["The DWL triangle lies between MSC and demand from Q = 30 to Q = 40: ½ × (80 − 60) × (40 − 30) = $100.","無謂損失是 Q = 30 到 40 之間、MSC 與需求之間的三角形：½ × (80 − 60) × (40 − 30) = 100 美元。"]},{"q":["What per-unit tax would move the market to the socially optimal quantity? How much revenue would it raise?","每單位課多少稅可以讓市場達到社會最適數量？稅收是多少？"],"a":["A $20 per-unit tax, equal to the marginal external cost. Revenue = $20 × 30 = $600.","每單位 20 美元，等於邊際外部成本。稅收 = 20 × 30 = 600 美元。"]},{"q":["After the tax, how does the price steel buyers pay change?","課稅後，鋼鐵買方支付的價格如何變化？"],"a":["It rises from $60 to $70.","從 60 美元上升到 70 美元。"]}]},{"t":["Lorenz Curves and Taxes","勞倫茲曲線與稅制"],"len":"Short","s":["The table shows the cumulative share of income earned by households in two countries.","下表是兩個國家家庭的累積所得份額。"],"tbl":{"h":[["Poorest … of households","最窮的 …% 家庭"],["Country A","A 國"],["Country B","B 國"]],"r":[["20%","10%","4%"],["40%","25%","12%"],["60%","45%","25%"],["80%","70%","50%"],["100%","100%","100%"]]},"p":[{"q":["Draw a correctly labeled graph with the line of perfect equality and the Lorenz curves for Country A and Country B.","畫出正確標示的圖，包含完全平均線以及 A 國與 B 國的勞倫茲曲線。"],"a":["Both curves start at (0, 0) and end at (100%, 100%). Country B’s curve lies below Country A’s, farther from the equality line.","兩條曲線都從 (0, 0) 到 (100%, 100%)。B 國的曲線在 A 國下方，離平均線比較遠。"],"af":{"xm":100,"ym":100,"xl":"Cumulative % of households","yl":"Cumulative % of income","xt":[[20,"20"],[40,"40"],[60,"60"],[80,"80"],[100,"100"]],"yt":[[50,"50"],[100,"100"]],"ln":[{"p":[[0,0],[100,100]],"c":"k","d":1,"l":"Equality","lp":[36,48],"la":"end"},{"p":[[0,0],[20,10],[40,25],[60,45],[80,70],[100,100]],"c":"d","l":"A","lp":[78,76]},{"p":[[0,0],[20,4],[40,12],[60,25],[80,50],[100,100]],"c":"s","l":"B","lp":[84,44]}]}},{"q":["Which country has the more unequal distribution of income? Use the data to explain.","哪一國的所得分配比較不平均？請用資料說明。"],"a":["Country B. Its poorest 40% earn only 12% of income (vs. 25% in A), and its richest 20% earn 50% (vs. 30% in A).","B 國。B 國最窮的 40% 只得到 12% 的所得（A 國 25%），最富的 20% 得到 50%（A 國 30%）。"]},{"q":["The area between Country B’s Lorenz curve and the line of equality is 0.20. Calculate Country B’s Gini coefficient.","B 國勞倫茲曲線與平均線之間的面積為 0.20。計算 B 國的吉尼係數。"],"a":["Gini = 0.20 ÷ 0.50 = 0.40.","吉尼係數 = 0.20 ÷ 0.50 = 0.40。"]},{"q":["In Country A, a household earning $30,000 pays $3,000 in income tax and a household earning $90,000 pays $9,000. Is this tax progressive, regressive or proportional? What would the $90,000 household have to pay for the tax to be progressive?","在 A 國，所得 30,000 美元的家庭繳 3,000 美元所得稅，所得 90,000 美元的家庭繳 9,000 美元。這種稅是累進、累退還是比例稅？所得 90,000 美元的家庭要繳多少，這個稅才是累進的？"],"a":["Proportional: both pay 10% of income. It would be progressive if the $90,000 household paid more than $9,000 (an average rate above 10%).","比例稅：兩者都繳所得的 10%。如果 90,000 美元的家庭繳超過 9,000 美元（平均稅率高於 10%），就是累進稅。"]}]}]},{"id":"ma1","c":"macro","n":1,"t":["Basic Economic Concepts","基本經濟觀念"],"mcq":[{"k":"k","q":["Macroeconomics focuses mainly on","總體經濟學主要研究"],"o":[["how a single firm sets its price","單一廠商如何訂價"],["the wage paid in one labor market","單一勞動市場的工資"],["how one consumer chooses between two goods","單一消費者如何在兩種商品間選擇"],["economy-wide measures such as GDP, unemployment and inflation","整體經濟的指標，例如 GDP、失業與通膨"],["the market for one product","單一產品的市場"]],"a":"D","e":["Macroeconomics studies the economy as a whole; the other choices are microeconomic topics.","總體經濟學研究整體經濟；其他選項都是個體經濟學的主題。"]},{"k":"k","q":["The opportunity cost of using public funds to build a new highway is","用公共資金興建新公路的機會成本是"],"o":[["the value of the next-best use of those funds and resources","這些資金與資源次佳用途的價值"],["the tolls drivers will pay","駕駛人將支付的過路費"],["the dollar cost of the highway only","只有公路的金錢成本"],["zero, because taxpayers already paid","零，因為納稅人已經付過錢了"],["the total value of all other possible projects combined","所有其他可能計畫的價值總和"]],"a":"A","e":["Opportunity cost is the single best alternative given up, not the sum of all alternatives.","機會成本是被放棄的「最佳」替代選擇，而不是所有替代選擇的總和。"]},{"k":"k","q":["A production possibilities curve that is a straight line shows that","一條直線的生產可能曲線表示"],"o":[["the economy is growing","經濟正在成長"],["resources are unemployed","資源閒置"],["the opportunity cost of one good in terms of the other is constant","一種商品以另一種商品表示的機會成本固定"],["opportunity costs are increasing","機會成本遞增"],["the two goods are produced with no opportunity cost","兩種商品的生產沒有機會成本"]],"a":"C","e":["A constant slope means each extra unit of one good always costs the same amount of the other.","斜率固定，代表每多一單位某商品，總是放棄同樣數量的另一種商品。"]},{"k":"c","q":["Using all its resources, a country can produce either 100 computers or 400 tons of rice, with constant opportunity cost. What is the opportunity cost of one computer?","某國用盡所有資源，可以生產 100 台電腦或 400 噸稻米，機會成本固定。一台電腦的機會成本是多少？"],"o":[["4 tons of rice","4 噸稻米"],["400 tons of rice","400 噸稻米"],["100 tons of rice","100 噸稻米"],["0.25 ton of rice","0.25 噸稻米"],["0.4 computer","0.4 台電腦"]],"a":"A","e":["Giving up 400 tons of rice to make 100 computers means each computer costs 400 ÷ 100 = 4 tons of rice.","生產 100 台電腦要放棄 400 噸稻米，每台電腦的機會成本 = 400 ÷ 100 = 4 噸稻米。"]},{"k":"k","q":["Economic growth is best shown on a PPC graph as","在 PPC 圖上，經濟成長最適合以下列何者表示？"],"o":[["an outward shift of the PPC","PPC 向外移動"],["an inward shift of the PPC","PPC 向內移動"],["a point outside the PPC","PPC 外的一點"],["a movement along the PPC","沿著 PPC 移動"],["a movement from a point inside the PPC to the curve","從 PPC 內部的點移到曲線上"]],"a":"A","e":["Growth means the economy can produce more of both goods, so the whole curve moves out.","經濟成長表示兩種商品都能生產更多，整條曲線向外移動。"]},{"k":"k","q":["A country that chooses to produce more capital goods and fewer consumer goods today will most likely","一國今天選擇多生產資本財、少生產消費財，最可能"],"o":[["have a PPC that shifts farther outward in the future","未來的 PPC 向外移動得更多"],["move to a point inside its PPC","移到 PPC 內部"],["face constant opportunity costs","面對固定的機會成本"],["have a PPC that shifts inward in the future","未來的 PPC 向內移動"],["eliminate scarcity","消除稀少性"]],"a":"A","e":["More machines and factories raise future productive capacity, so the PPC grows faster.","更多的機器與工廠提高未來的生產能力，PPC 會擴張得更快。"]},{"k":"k","q":["During a recession with high unemployment, an economy is best represented by","在失業率高的經濟衰退期，經濟最適合以下列何者表示？"],"o":[["an outward shift of its PPC",  tea increases: the price and quantity of tea both rise.","咖啡變貴，茶的需求增加，茶的價格與數量都上升。"]}]}]},{"id":"ma2","c":"macro","n":2,"t":["Economic Indicators and the Business Cycle","經濟指標與景氣循環"],"mcq":[{"k":"k","q":["Which of the following is included in this year’s U.S. GDP?","下列何者計入今年的美國 GDP？"],"o":[["A Social Security payment to a retiree","發給退休人士的社會安全給付"],["A share of stock bought this year","今年買進的一張股票"],["A new house built this year","今年新蓋的房子"],["A used car sold this year","今年賣出的二手車"],["Flour bought by a bakery to make bread for sale","麵包店買來做麵包販售的麵粉"]],"a":"C","e":["GDP counts final goods and services newly produced this year. Used goods, financial assets, transfer payments and intermediate goods are excluded.","GDP 只計算今年新生產的最終商品與服務。二手貨、金融資產、移轉支付與中間財都不計入。"]},{"k":"k","q":["Goods produced in the United States by a Japanese-owned factory are","日本公司在美國的工廠所生產的商品"],"o":[["excluded from GDP because the owner is foreign","因為業主是外國人而不計入 GDP"],["included in Japan’s GDP","計入日本 GDP"],["included in U.S. GDP","計入美國 GDP"],["included in both countries’ GDP","同時計入兩國 GDP"],["counted as U.S. imports","計為美國的進口"]],"a":"C","e":["GDP measures output produced within a country’s borders, regardless of who owns the factory.","GDP 衡量的是在國境內生產的產出，與工廠所有權屬於誰無關。"]},{"k":"c","q":["In an economy, C = $600 billion, I = $150 billion, G = $200 billion, exports = $80 billion and imports = $100 billion. GDP equals","某經濟體 C = 6,000 億美元，I = 1,500 億，G = 2,000 億，出口 = 800 億，進口 = 1,000 億。GDP 等於"],"o":[["$1,050 billion","1 兆 500 億美元"],["$950 billion","9,500 億美元"],["$1,130 billion","1 兆 1,300 億美元"],["$970 billion","9,700 億美元"],["$930 billion","9,300 億美元"]],"a":"E","e":["GDP = C + I + G + (X − M) = 600 + 150 + 200 + (80 − 100) = $930 billion.","GDP = C + I + G + (X − M) = 600 + 150 + 200 + (80 − 100) = 9,300 億美元。"]},{"k":"c","q":["A farmer sells wheat to a miller for $100. The miller sells flour to a baker for $250. The baker sells bread to consumers for $600. How much is added to GDP?","農夫把小麥以 100 美元賣給磨坊，磨坊把麵粉以 250 美元賣給麵包師傅，麵包師傅把麵包以 600 美元賣給消費者。GDP 增加多少？"],"o":[["$100","100 美元"],["$250","250 美元"],["$350","350 美元"],["$600","600 美元"],["$950","950 美元"]],"a":"D","e":["Only the final good counts: $600. Equivalently, the value added is 100 + 150 + 350 = $600.","只計算最終財：600 美元。用附加價值法：100 + 150 + 350 = 600 美元，結果相同。"]},{"k":"k","q":["A firm produces goods this year that are not sold and are added to its inventory. In GDP accounting, these goods are","廠商今年生產但沒賣出、成為存貨的商品，在 GDP 帳中"],"o":[["counted as government spending","算為政府支出"],["subtracted from GDP","從 GDP 中扣除"],["counted as consumption this year","算為今年的消費"],["not counted until they are sold","要等賣出才計入"],["counted as investment this year","算為今年的投資"]],"a":"E","e":["Changes in inventories are part of gross private domestic investment, so unsold output is counted in the year it is produced.","存貨變動屬於國內私人投資毛額，所以沒賣出的產出在生產的那一年就計入。"]},{"k":"k","q":["Which is NOT counted as investment (I) in GDP?","下列何者「不」算 GDP 中的投資（I）？"],"o":[["A firm’s purchase of new machinery","廠商購買新機器"],["A firm’s new factory building","廠商新建廠房"],["An increase in business inventories","企業存貨增加"],["Construction of a new house","興建新房屋"],["A household’s purchase of corporate bonds","家庭購買公司債"]],"a":"E","e":["Buying bonds is a financial transaction, not the purchase of new physical capital.","購買債券是金融交易，不是購買新的實體資本。"]},{"k":"c","q":["A country has 200 million working-age adults. 120 million are employed and 8 million are unemployed. What is the unemployment rate?","某國有 2 億名工作年齡成人，其中 1.2 億人就業、800 萬人失業。失業率是多少？"],"o":[["About 6.7%","約 6.7%"],["4%","4%"],["About 6.3%","約 6.3%"],["8%","8%"],["About 3.8%","約 3.8%"]],"a":"C","e":["Labor force = 120 + 8 = 128 million. Unemployment rate = 8 ÷ 128 ≈ 6.25%.","勞動力 = 120 + 800 萬 = 1.28 億。失業率 = 8 ÷ 128 ≈ 6.25%。"]},{"k":"c","q":["Using the same data, what is the labor force participation rate?","用同一組資料，勞動力參與率是多少？"],"o":[["40%","40%"],["60%","60%"],["64%","64%"],["67%","67%"],["94%","94%"]],"a":"C","e":["LFPR = labor force ÷ working-age population = 128 ÷ 200 = 64%.","勞參率 = 勞動力 ÷ 工作年齡人口 = 128 ÷ 200 = 64%。"]},{"k":"k","q":["A worker gives up looking for a job because she believes none are available. As a result, the measured unemployment rate","一位工人認為找不到工作而放棄求職。結果，統計上的失業率"],"o":[["decreases, and the labor force participation rate increases","下降，勞動力參與率上升"],["increases, and the labor force participation rate does not change","上升，勞動力參與率不變"],["decreases, and the labor force participation rate decreases","下降，勞動力參與率也下降"],["does not change","不變"],["increases, and the labor force participation rate decreases","上升，勞動力參與率下降"]],"a":"C","e":["A discouraged worker leaves the labor force: the number unemployed and the labor force both fall, so both rates decrease.","喪志工人退出勞動力：失業人數與勞動力都減少，兩個比率都下降。"]},{"k":"k","q":["A software engineer who quits her job to search for a better-paying one is","辭職去找待遇更好工作的軟體工程師屬於"],"o":[["structurally unemployed","結構性失業"],["not in the labor force","不在勞動力中"],["frictionally unemployed","摩擦性失業"],["cyclically unemployed","循環性失業"],["a discouraged worker","喪志工人"]],"a":"C","e":["Frictional unemployment is the time spent moving between jobs or searching for a good match.","摩擦性失業是在換工作或尋找合適工作期間的失業。"]},{"k":"k","q":["Coal miners lose their jobs because power plants switch to solar energy, and their skills do not match available jobs. This is","發電廠改用太陽能，煤礦工人失業，而且他們的技能不符合現有職缺。這屬於"],"o":[["frictional unemployment","摩擦性失業"],["underemployment","低度就業"],["seasonal unemployment","季節性失業"],["cyclical unemployment","循環性失業"],["structural unemployment","結構性失業"]],"a":"E","e":["A mismatch between workers’ skills and the jobs available, caused by changes in the economy’s structure, is structural unemployment.","產業結構改變造成技能與職缺不相符，是結構性失業。"]},{"k":"k","q":["The natural rate of unemployment is the sum of","自然失業率是哪些失業的總和？"],"o":[["all types of unemployment","所有類型的失業"],["frictional and cyclical unemployment","摩擦性與循環性失業"],["structural and cyclical unemployment","結構性與循環性失業"],["cyclical unemployment only","只有循環性失業"],["frictional and structural unemployment","摩擦性與結構性失業"]],"a":"E","e":["At full employment, cyclical unemployment is zero; only frictional and structural unemployment remain.","充分就業時循環性失業為零，只剩摩擦性與結構性失業。"]},{"k":"c","q":["A market basket costs $250 in the base year and $275 this year. What is this year’s CPI?","一籃商品在基期年價格為 250 美元，今年為 275 美元。今年的 CPI 是多少？"],"o":[["10","10"],["27.5","27.5"],["90.9","90.9"],["110","110"],["125","125"]],"a":"D","e":["CPI = (cost this year ÷ cost in base year) × 100 = 275 ÷ 250 × 100 = 110.","CPI =（今年成本 ÷ 基期成本）× 100 = 275 ÷ 250 × 100 = 110。"]},{"k":"c","q":["The CPI rises from 120 to 126. What is the inflation rate?","CPI 從 120 上升到 126。通貨膨脹率是多少？"],"o":[["4.8%","4.8%"],["5%","5%"],["6%","6%"],["20%","20%"],["26%","26%"]],"a":"B","e":["Inflation = (126 − 120) ÷ 120 × 100 = 5%.","通膨率 =（126 − 120）÷ 120 × 100 = 5%。"]},{"k":"c","q":["Nominal GDP is $1,500 billion and the GDP deflator is 125. What is real GDP?","名目 GDP 為 1 兆 5,000 億美元，GDP 平減指數為 125。實質 GDP 是多少？"],"o":[["$1,200 billion","1 兆 2,000 億美元"],["$1,250 billion","1 兆 2,500 億美元"],["$1,375 billion","1 兆 3,750 億美元"],["$1,875 billion","1 兆 8,750 億美元"],["$1,500 billion","1 兆 5,000 億美元"]],"a":"A","e":["Real GDP = nominal GDP ÷ (deflator ÷ 100) = 1,500 ÷ 1.25 = $1,200 billion.","實質 GDP = 名目 GDP ÷（平減指數 ÷ 100）= 1,500 ÷ 1.25 = 1 兆 2,000 億美元。"]},{"k":"c","q":["Your nominal wage rises by 3% while the price level rises by 5%. Your real wage","你的名目工資上漲 3%，物價水準上漲 5%。你的實質工資"],"o":[["falls by about 2%","下降約 2%"],["rises by about 8%","上升約 8%"],["falls by about 8%","下降約 8%"],["does not change","不變"],["rises by about 2%","上升約 2%"]],"a":"A","e":["% change in real wage ≈ % change in nominal wage − inflation = 3% − 5% = −2%.","實質工資變動率 ≈ 名目工資變動率 − 通膨率 = 3% − 5% = −2%。"]},{"k":"k","q":["Unanticipated inflation is most likely to benefit","未預期的通貨膨脹最可能使誰受益？"],"o":[["borrowers with fixed-rate loans","背負固定利率貸款的借款人"],["lenders with fixed-rate loans","以固定利率放款的貸款人"],["retirees on fixed pensions","領固定退休金的退休人士"],["savers holding cash","持有現金的儲蓄者"],["workers on fixed multiyear wage contracts","簽了多年期固定工資合約的工人"]],"a":"A","e":["Borrowers repay loans with dollars that buy less than expected, so wealth shifts from lenders to borrowers.","借款人用購買力比預期低的錢還款，財富從貸款人移轉到借款人。"]},{"k":"k","q":["The CPI tends to overstate the true increase in the cost of living because it","CPI 往往高估實際的生活成本上升，原因是它"],"o":[["does not fully account for consumers substituting toward cheaper goods","沒有完全反映消費者改買較便宜商品的替代行為"],["includes the prices of imported goods","包含進口商品的價格"],["changes the market basket every month","每個月都更換一籃商品"],["measures only the prices of capital goods","只衡量資本財的價格"],["excludes the prices of services","不包含服務的價格"]],"a":"A","e":["The fixed basket ignores substitution, quality improvements and new goods, all of which make the CPI overstate inflation.","固定的一籃商品忽略了替代效果、品質改善與新商品，因此 CPI 會高估通膨。"]},{"k":"k","q":["During the recession phase of the business cycle,","在景氣循環的衰退期，"],"o":[["real GDP rises and unemployment falls","實質 GDP 上升、失業率下降"],["the economy produces beyond its PPC","經濟生產超出 PPC"],["real GDP falls and unemployment rises","實質 GDP 下降、失業率上升"],["real GDP and inflation both rise rapidly","實質 GDP 與通膨都快速上升"],["cyclical unemployment equals zero","循環性失業等於零"]],"a":"C","e":["A recession (contraction) is a period of falling real output and rising cyclical unemployment.","衰退（緊縮）是實質產出下降、循環性失業上升的時期。"]},{"k":"c","q":["Real GDP rises from $2,000 billion to $2,080 billion. What is the economic growth rate?","實質 GDP 從 2 兆美元增加到 2 兆 800 億美元。經濟成長率是多少？"],"o":[["2%","2%"],["3.8%","3.8%"],["4%","4%"],["8%","8%"],["80%","80%"]],"a":"C","e":["Growth rate = (2,080 − 2,000) ÷ 2,000 × 100 = 4%.","成長率 =（2,080 − 2,000）÷ 2,000 × 100 = 4%。"]},{"k":"k","q":["When an economy is at full employment,","經濟處於充分就業時，"],"o":[["frictional unemployment is zero","摩擦性失業為零"],["structural unemployment is zero","結構性失業為零"],["actual unemployment equals the natural rate of unemployment","實際失業率等於自然失業率"],["the unemployment rate is zero","失業率為零"],["real GDP is above potential GDP","實質 GDP 高於潛在 GDP"]],"a":"C","e":["Full employment means no cyclical unemployment; frictional and structural unemployment still exist.","充分就業代表沒有循環性失業；摩擦性與結構性失業仍然存在。"]},{"k":"k","q":["A household pays a plumber $200 to fix a pipe, and also spends $300 on a new refrigerator. GDP rises by","一個家庭付 200 美元請水電工修水管，又花 300 美元買新冰箱。GDP 增加"],"o":[["$0","0 美元"],["$100","100 美元"],["$200","200 美元"],["$300","300 美元"],["$500","500 美元"]],"a":"E","e":["Both are final purchases by a household: a service ($200) and a new good ($300), so GDP rises by $500.","兩者都是家庭的最終購買：服務 200 美元加新商品 300 美元，GDP 增加 500 美元。"]}],"frq":[{"t":["Measuring GDP and Prices","衡量 GDP 與物價"],"len":"Long","s":["An economy produces only pizzas and books. Year 1 is the base year. Fill in the blank cells, then answer the questions.","某經濟體只生產披薩與書。第 1 年為基期年。請填寫空格，再回答問題。"],"tbl":{"h":[["Year","年"],["Price of pizza ($)","披薩價格"],["Pizzas","披薩數量"],["Price of book ($)","書的價格"],["Books","書數量"],["Nominal GDP ($)","名目 GDP"],["Real GDP ($, year-1 prices)","實質 GDP（第 1 年價格）"],["GDP deflator","GDP 平減指數"]],"r":[[1,10,100,20,50,2000,2000,100],[2,12,110,22,50,2420,2100,"115.2"],[3,15,120,25,60,3300,2400,"137.5"]],"b":[[0,5],[0,6],[0,7],[1,5],[1,6],[1,7],[2,5],[2,6],[2,7]]},"p":[{"q":["Fill in nominal GDP, real GDP and the GDP deflator for each year (deflator to one decimal place).","填寫每年的名目 GDP、實質 GDP 與 GDP 平減指數（平減指數取到小數點後一位）。"],"a":["Year 1: 10×100 + 20×50 = $2,000; real $2,000; deflator 100. Year 2: 12×110 + 22×50 = $2,420; real 10×110 + 20×50 = $2,100; deflator 2,420 ÷ 2,100 × 100 ≈ 115.2. Year 3: 15×120 + 25×60 = $3,300; real 10×120 + 20×60 = $2,400; deflator 137.5.","第 1 年：10×100 + 20×50 = 2,000 美元；實質 2,000；平減指數 100。第 2 年：12×110 + 22×50 = 2,420；實質 10×110 + 20×50 = 2,100；平減指數 2,420 ÷ 2,100 × 100 ≈ 115.2。第 3 年：15×120 + 25×60 = 3,300；實質 10×120 + 20×60 = 2,400；平減指數 137.5。"]},{"q":["Calculate the growth rate of real GDP from Year 2 to Year 3.","計算第 2 年到第 3 年實質 GDP 的成長率。"],"a":["(2,400 − 2,100) ÷ 2,100 × 100 ≈ 14.3%.","（2,400 − 2,100）÷ 2,100 × 100 ≈ 14.3%。"]},{"q":["Calculate the inflation rate from Year 2 to Year 3 using the GDP deflator.","用 GDP 平減指數計算第 2 年到第 3 年的通膨率。"],"a":["(137.5 − 115.2) ÷ 115.2 × 100 ≈ 19.4%.","（137.5 − 115.2）÷ 115.2 × 100 ≈ 19.4%。"]},{"q":["Why is real GDP a better measure than nominal GDP for comparing output across years?","比較不同年份的產出時，為什麼實質 GDP 比名目 GDP 好？"],"a":["Real GDP holds prices constant, so it changes only when quantities produced change; nominal GDP also rises when only prices rise.","實質 GDP 固定價格，只有生產數量改變時才會變動；名目 GDP 在只有價格上漲時也會增加。"]},{"q":["Draw a correctly labeled business cycle graph with time on the horizontal axis and real GDP on the vertical axis. Label the peak, the trough, a recession, an expansion and the long-run growth trend.","以時間為橫軸、實質 GDP 為縱軸，畫出正確標示的景氣循環圖。標出高峰、谷底、衰退、擴張與長期成長趨勢。"],"a":["Real GDP fluctuates around an upward-sloping trend line: it falls from a peak to a trough (recession) and rises from a trough to the next peak (expansion).","實質 GDP 圍繞一條向上的趨勢線波動：從高峰下降到谷底是衰退，從谷底上升到下一個高峰是擴張。"],"af":{"xm":10,"ym":10,"xl":"Time","yl":"Real GDP","ln":[{"p":[[0.3,2.87],[9.6,7.98]],"c":"n","d":1,"l":"Trend"},{"a":0.3,"b":9.6,"n":80,"c":"d","l":"Real GDP","lp":[8.3,5.5],"p":[[0.3,3.3385],[0.4163,3.5738],[0.5325,3.7976],[0.6487,4.0071],[0.765,4.1996],[0.8812,4.3728],[0.9975,4.5248],[1.1138,4.6541],[1.23,4.7594],[1.3462,4.8401],[1.4625,4.8957],[1.5787,4.9266],[1.695,4.9332],[1.8113,4.9166],[1.9275,4.8782],[2.0437,4.8198],[2.16,4.7437],[2.2762,4.6523],[2.3925,4.5484],[2.5087,4.435],[2.625,4.3153],[2.7412,4.1925],[2.8575,4.07],[2.9737,3.9511],[3.09,3.839],[3.2062,3.7369],[3.3225,3.6478],[3.4387,3.5744],[3.555,3.5192],[3.6712,3.4842],[3.7875,3.4713],[3.9037,3.4818],[4.02,3.5166],[4.1362,3.5763],[4.2525,3.661],[4.3687,3.7703],[4.485,3.9033],[4.6012,4.0589],[4.7175,4.2354],[4.8337,4.4308],[4.95,4.6428],[5.0662,4.8687],[5.1825,5.1056],[5.2987,5.3504],[5.415,5.6],[5.5312,5.8509],[5.6475,6.0999],[5.7637,6.3437],[5.88,6.579],[5.9962,6.8028],[6.1125,7.0123],[6.2287,7.204
