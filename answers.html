<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AP 經濟練習題解答</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>/* Layout: exam-paper column — sticky selector bar (course, unit, language), then numbered question cards; tokens follow the econ boards */
:root{
  --bg:#e9eee9; --surface:#f6f8f5; --paper:#fdfefc; --ink:#1b2621; --muted:#5a6a61; --rule:#cdd7d0; --accent:#1d6b57; --accent-ink:#fff; --accent-soft:#d6e9e1;
  --cD:#2457b3; --cS:#c24a12; --cMC:#b0246f; --cATC:#1d7a5c; --cAVC:#8a7414; --cMR:#6a49c9;
  --shA:#3d7be0; --shB:#e3940e; --shC:#7a808c; --shD:#1c9a54; --shE:#d23b3b; --shop:.22;
  --good:#1c7a46; --bad:#b83232; --sel:#2457b3; --sel-soft:#e1eafb;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-hand:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111916; --surface:#17221e; --paper:#1a2823; --ink:#e6eee8; --muted:#97aa9f; --rule:#2d3d36; --accent:#7ccfb4; --accent-ink:#0f1915; --accent-soft:#1f3a31;
  --cD:#86aefc; --cS:#ff9b6a; --cMC:#f283c2; --cATC:#6fd5a9; --cAVC:#dcc66e; --cMR:#b9a4ff;
  --shA:#6c9cf5; --shB:#f2b23e; --shC:#a3acb9; --shD:#3fcf7d; --shE:#ff6b6b; --shop:.3;
  --good:#5fd394; --bad:#ff7b7b; --sel:#8fb4ff; --sel-soft:#1d2b45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111916; --surface:#17221e; --paper:#1a2823; --ink:#e6eee8; --muted:#97aa9f; --rule:#2d3d36; --accent:#7ccfb4; --accent-ink:#0f1915; --accent-soft:#1f3a31;
  --cD:#86aefc; --cS:#ff9b6a; --cMC:#f283c2; --cATC:#6fd5a9; --cAVC:#dcc66e; --cMR:#b9a4ff;
  --shA:#6c9cf5; --shB:#f2b23e; --shC:#a3acb9; --shD:#3fcf7d; --shE:#ff6b6b; --shop:.3;
  --good:#5fd394; --bad:#ff7b7b; --sel:#8fb4ff; --sel-soft:#1d2b45; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-zh);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
a{color:var(--accent)}
.homelink{align-self:flex-start;font-size:.82rem;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--rule);background:var(--surface);padding:3px 12px;border-radius:999px}
header h1{margin:0;font-family:var(--f-en);font-size:1.9rem;line-height:1.15;text-wrap:balance}
header h1 small{font-family:var(--f-hand);font-weight:400;font-size:.7em;color:var(--muted);margin-left:6px}
header p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.seg{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:2px}
.seg button{font:inherit;font-size:.86rem;border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--rule)}
.units{display:flex;flex-wrap:wrap;gap:4px}
.units button{font:inherit;font-size:.82rem;border:1px solid var(--rule);background:var(--paper);color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer;text-align:left}
.units button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chk{display:flex;align-items:center;gap:6px;font-size:.86rem;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.sp{flex:1}
.btn{font:inherit;font-size:.84rem;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:5px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:700px){.bar{position:static}.units{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.units button{flex:none;white-space:nowrap}}
.unit-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-top:6px}
.unit-h h2{margin:0;font-family:var(--f-en);font-size:1.45rem;line-height:1.25}
.unit-h h2 .zh{font-family:var(--f-hand);font-weight:400;color:var(--muted);font-size:.85em;margin-left:8px}
.meta{color:var(--muted);font-size:.85rem}
.sec-h{font-size:.78rem;letter-spacing:.14em;font-weight:700;color:var(--accent);margin:18px 0 0;border-bottom:2px solid var(--accent);padding-bottom:4px}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;break-inside:avoid}
.qh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qn{font-family:var(--f-en);font-weight:700;font-size:1.05rem;min-width:2ch}
.tag{font-size:.72rem;border-radius:999px;padding:1px 8px;border:1px solid var(--rule);color:var(--muted)}
.tag.calc{border-color:var(--cS);color:var(--cS)}
.tag.draw{border-color:var(--cD);color:var(--cD)}
.tz{margin-left:auto;font:inherit;font-size:.74rem;border:1px solid var(--rule);background:transparent;color:var(--muted);padding:1px 8px;border-radius:6px;cursor:pointer}
.bi{margin:0;display:flex;flex-direction:column;gap:3px}
.bi .en{font-family:var(--f-en);font-size:1.02rem;line-height:1.55}
.bi .zh{color:var(--muted);font-size:.9rem;line-height:1.55}
.hide-zh .bi .zh,.hide-zh .dtbl .zh{display:none}
.q.zh-on .bi .zh,.q.zh-on .dtbl .zh{display:flex}
.q.zh-on .dtbl .zh{display:inline}
.q.zh-off .bi .zh,.q.zh-off .dtbl .zh{display:none}
.opts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);border-radius:9px;padding:7px 10px;cursor:pointer;background:var(--paper);text-align:left;font:inherit;color:inherit;width:100%}
.opt:hover{border-color:var(--sel)}
.opt .L{font-family:var(--f-en);font-weight:700;min-width:1.4em;height:1.4em;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--muted);border-radius:50%;font-size:.85rem;flex:none;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--sel);background:var(--sel-soft)}
.opt[aria-pressed="true"] .L{background:var(--sel);border-color:var(--sel);color:var(--paper)}
.opt .bi .en{font-size:.98rem}
.opt.correct{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--paper))}
.opt.correct .L{background:var(--good);border-color:var(--good);color:var(--paper)}
.figbox{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.fig{width:100%;height:auto;display:block;background:var(--paper)}
.fig .axis{stroke:var(--ink);stroke-width:1.8;fill:none}.fig .axh{fill:var(--ink)}
.fig .axl{font-family:var(--f-en);font-size:13px;font-weight:600;fill:var(--ink)}
.fig .tk{font-family:var(--f-en);font-size:11.5px;fill:var(--muted)}.fig .tick{stroke:var(--muted)}
.fig .gl{fill:var(--ink)}
.fig .guide{stroke:var(--muted);stroke-dasharray:4 4;fill:none;stroke-width:1.2}
.fig .ln{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.fig .ln.dash{stroke-dasharray:7 6}
.fig .lnl{font-family:var(--f-en);font-size:13px;font-weight:700}
.fig .pt{fill:var(--ink);stroke:var(--paper);stroke-width:1.5}.fig .pt.hol{fill:var(--paper);stroke:var(--ink)}
.fig .ptl{font-family:var(--f-en);font-size:12.5px;fill:var(--ink)}
.fig .ftx{font-family:var(--f-en);font-size:12px}
.fig .shade{fill-opacity:var(--shop);stroke:none}.fig .sh-a{fill:var(--shA)}.fig .sh-b{fill:var(--shB)}.fig .sh-c{fill:var(--shC)}.fig .sh-d{fill:var(--shD)}.fig .sh-e{fill:var(--shE)}
.fig .shl{font-family:var(--f-en);font-size:14px;font-weight:700;fill:var(--ink)}
.fig .arw{stroke:var(--ink);stroke-width:1.6;fill:none}.fig .arwh{fill:var(--ink)}
.tblwrap{overflow-x:auto;max-width:100%}
.dtbl{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem;background:var(--paper)}
.dtbl th,.dtbl td{border:1px solid var(--rule);padding:4px 10px;text-align:center;vertical-align:middle}
.dtbl th{background:var(--surface);font-weight:600;font-family:var(--f-en)}
.dtbl th .zh,.dtbl td .zh{font-family:var(--f-zh);font-weight:400;font-size:.78rem;color:var(--muted)}
.dtbl td.blank{background:color-mix(in srgb,var(--cS) 8%,var(--paper));padding:2px 4px}
.dtbl td.blank input{width:64px;font:inherit;text-align:center;border:1px dashed var(--muted);border-radius:4px;background:var(--paper);color:var(--ink);padding:2px}
.dtbl td.filled{background:color-mix(in srgb,var(--good) 16%,var(--paper));font-weight:700;color:var(--good)}
.parts{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.part{display:flex;gap:10px}
.part .pl{font-family:var(--f-en);font-weight:700;min-width:1.8em}
.part .pb{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.part textarea{width:100%;min-height:52px;font:inherit;font-size:.92rem;border:1px solid var(--rule);border-radius:8px;padding:6px 8px;background:var(--paper);color:var(--ink);resize:vertical}
.drawhint{font-size:.82rem;color:var(--cD)}
.ans{border-left:3px solid var(--good);background:color-mix(in srgb,var(--good) 7%,var(--paper));border-radius:0 8px 8px 0;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.ans .lab{font-size:.74rem;letter-spacing:.12em;font-weight:700;color:var(--good)}
.key{font-family:var(--f-en);font-weight:700;color:var(--good);font-size:1.05rem}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;font-family:var(--f-en);font-variant-numeric:tabular-nums}
.sheet span{border:1px solid var(--rule);border-radius:6px;padding:2px 6px;background:var(--paper);font-size:.88rem}
.sheet b{color:var(--sel)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin-top:12px}
@media print{body{background:#fff;padding:0}.bar,.homelink,.tz,.noprint{display:none!important}.q{border-color:#bbb}}

.hide-q .qbody{display:none}
</style>
</head>
<body>
<div class="app">
  <a class="homelink" href="index.html">← Home (首頁)</a>
  <header>
    <h1>AP Econ Answer Key <small>AP 經濟練習題解答</small></h1>
    <p>Answers and explanations for the practice set. Try the questions first. (練習題的答案與解析，請先自己作答再來對答案。)</p>
  </header>
  <div class="bar">
    <div class="row">
      <div class="seg" role="group" aria-label="Course (課程)"><button data-course="micro">AP Micro (個經)</button><button data-course="macro">AP Macro (總經)</button></div>
      <label class="chk"><input type="checkbox" id="showZh" checked>Show Chinese translation (顯示中文翻譯)</label>
      <label class="chk"><input type="checkbox" id="showQ" checked>Show questions (顯示題目)</label>
      <span class="sp"></span>
      <a class="btn" id="practiceLink" href="practice.html">← Practice (回練習題)</a>
    </div>
    <div class="units" id="units" role="group" aria-label="Units (單元)"></div>
  </div>
  <main id="main"></main>
</div>
<script>
/* shared renderer for the practice page and the answer key */
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* light inline markup: _{x} subscript, ^{x} superscript, **b** bold, line breaks */
const md=t=>esc(t).replace(/_\{([^}]*)\}/g,'<sub>$1</sub>').replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const EN=x=>Array.isArray(x)?x[0]:x, ZH=x=>Array.isArray(x)?(x[1]==null?x[0]:x[1]):x;
const COL={d:'var(--cD)',s:'var(--cS)',k:'var(--ink)',m:'var(--cMC)',g:'var(--cATC)',y:'var(--cAVC)',p:'var(--cMR)',r:'var(--bad)',n:'var(--muted)'};
const LETTERS='ABCDE';
function bi(x,tag='p',cls=''){const e=EN(x),z=ZH(x);return `<${tag} class="bi ${cls}"><span class="en">${md(e)}</span>${z&&z!==e?`<span class="zh">${md(z)}</span>`:''}</${tag}>`;}
/* SVG text with subscripts: Q_m, P_{b}, W_m = $20 */
function st(t){return esc(t).replace(/_\{([^}]*)\}|_([A-Za-z0-9]+)/g,(m,a,b)=>`<tspan baseline-shift="sub" font-size="75%">${a||b}</tspan>`);}
const tlen=t=>String(t||'').replace(/_\{?([^} ]*)\}?/g,'$1').length;
function figSVG(f){
  const ylabs=[...(f.yt||[]).map(t=>t[1]==null?String(t[0]):t[1]),...(f.g||[]).map(g=>g[3]||'')];
  const W=f.w||400,H=f.h||280,L=f.L||Math.max(46,16+6.6*Math.max(0,...ylabs.map(tlen))),R=f.R||28,T=24,B=f.B||42,x0=f.x0||0,y0=f.y0||0,xm=f.xm||10,ym=f.ym||10;
  const X=x=>L+(x-x0)/(xm-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(ym-y0))*(H-T-B),r=v=>(+v).toFixed(1);
  const gx=(f.g||[]).filter(g=>g[2]).map(g=>g[0]),gy=(f.g||[]).filter(g=>g[3]).map(g=>g[1]);
  const near=(arr,v,span)=>arr.some(a=>Math.abs(a-v)<=span*0.015);
  let s=`<svg class="fig" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(f.alt||'graph')}" style="max-width:${W}px">`;
  for(const a of f.sh||[]){s+=`<polygon class="shade sh-${a.c||'a'}" points="${a.p.map(([x,y])=>r(X(x))+','+r(Y(y))).join(' ')}"/>`;}
  s+=`<path class="axis" d="M${r(L)} ${H-B}H${W-R+8}M${r(L)} ${H-B}V${T-10}"/><path class="axh" d="M${W-R+8} ${H-B}l-7 -4v8zM${r(L)} ${T-10}l-4 7h8z"/>`;
  s+=`<text class="axl" x="${r(L+8)}" y="${T-8}">${st(f.yl||'')}</text><text class="axl" x="${W-R+4}" y="${H-B+32}" text-anchor="end">${st(f.xl||'')}</text><text class="tk" x="${r(L-6)}" y="${H-B+14}" text-anchor="end">0</text>`;
  for(const [v,l] of f.xt||[]){if(near(gx,v,xm-x0))continue;s+=`<line class="tick" x1="${r(X(v))}" y1="${H-B}" x2="${r(X(v))}" y2="${H-B+4}"/><text class="tk" x="${r(X(v))}" y="${H-B+16}" text-anchor="middle">${st(l==null?v:l)}</text>`;}
  for(const [v,l] of f.yt||[]){if(near(gy,v,ym-y0))continue;s+=`<line class="tick" x1="${r(L-4)}" y1="${r(Y(v))}" x2="${r(L)}" y2="${r(Y(v))}"/><text class="tk" x="${r(L-7)}" y="${r(Y(v)+4)}" text-anchor="end">${st(l==null?v:l)}</text>`;}
  for(const g of f.g||[]){const [x,y,xl,yl]=g;s+=`<path class="guide" d="M${r(L)} ${r(Y(y))}H${r(X(x))}V${H-B}"/>`;
    if(xl)s+=`<text class="tk gl" x="${r(X(x))}" y="${H-B+16}" text-anchor="middle">${st(xl)}</text>`;if(yl)s+=`<text class="tk gl" x="${r(L-7)}" y="${r(Y(y)+4)}" text-anchor="end">${st(yl)}</text>`;}
  for(const l of f.ln||[]){const c=COL[l.c||'k'];const d=l.p.map(([x,y],i)=>(i?'L':'M')+r(X(x))+' '+r(Y(y))).join('');
    s+=`<path class="ln${l.d?' dash':''}" d="${d}" style="stroke:${c}${l.w?';stroke-width:'+l.w:''}"/>`;
    if(l.l){const e=l.lp||l.p[l.p.length-1];let lx=X(e[0])+(l.lp?0:6),ly=Y(e[1])-(l.lp?0:6),ax=l.la||'start';
      if(!l.la&&lx+7*tlen(l.l)>W-4){ax='end';lx=Math.min(lx,W-4)-(l.lp?0:10);}
      s+=`<text class="lnl" x="${r(lx)}" y="${r(ly)}" text-anchor="${ax}" style="fill:${c}">${st(l.l)}</text>`;}}
  for(const a of f.sh||[])if(a.l){const cx=a.p.reduce((t,p)=>t+p[0],0)/a.p.length,cy=a.p.reduce((t,p)=>t+p[1],0)/a.p.length;const lx=a.lx!=null?a.lx:cx,ly=a.ly!=null?a.ly:cy;s+=`<text class="shl" x="${r(X(lx))}" y="${r(Y(ly)+5)}" text-anchor="middle">${st(a.l)}</text>`;}
  for(const a of f.ar||[]){const [[x1,y1],[x2,y2]]=a;const ax1=X(x1),ay1=Y(y1),ax2=X(x2),ay2=Y(y2),ang=Math.atan2(ay2-ay1,ax2-ax1);
    s+=`<path class="arw" d="M${r(ax1)} ${r(ay1)}L${r(ax2)} ${r(ay2)}"/><path class="arwh" d="M${r(ax2)} ${r(ay2)}l${r(-9*Math.cos(ang-0.4))} ${r(-9*Math.sin(ang-0.4))}l${r(9*Math.cos(ang-0.4)-9*Math.cos(ang+0.4))} ${r(9*Math.sin(ang-0.4)-9*Math.sin(ang+0.4))}z"/>`;}
  for(const p of f.pt||[]){s+=`<circle class="pt${p.o?' hol':''}" cx="${r(X(p.x))}" cy="${r(Y(p.y))}" r="4.5"/>`;if(p.l)s+=`<text class="ptl" x="${r(X(p.x)+(p.dx!=null?p.dx:7))}" y="${r(Y(p.y)+(p.dy!=null?p.dy:-7))}" text-anchor="${p.a||'start'}">${st(p.l)}</text>`;}
  for(const t of f.tx||[])s+=`<text class="ftx" x="${r(X(t.x))}" y="${r(Y(t.y))}" text-anchor="${t.a||'middle'}" style="fill:${COL[t.c||'k']}">${st(t.t)}</text>`;
  return s+'</svg>';}
/* tables: cells may be numbers, strings or [en,zh]; blanks: practice gets inputs, the key gets highlighted values */
function tableHTML(t,mode,id){
  const blank=new Set((t.b||[]).map(([i,j])=>i+','+j));
  let h=`<div class="tblwrap"><table class="dtbl"><thead><tr>${t.h.map(c=>`<th>${md(EN(c))}${ZH(c)!==EN(c)?`<br><span class="zh">${md(ZH(c))}</span>`:''}</th>`).join('')}</tr></thead><tbody>`;
  t.r.forEach((row,i)=>{h+='<tr>'+row.map((c,j)=>{const k=i+','+j;
    if(blank.has(k)){if(mode==='q')return `<td class="blank"><input type="text" inputmode="decimal" aria-label="row ${i+1} column ${j+1}" id="${id}-r${i}c${j}" data-save="${id}-r${i}c${j}"></td>`;return `<td class="filled">${md(EN(c))}</td>`;}
    return `<td>${md(EN(c))}${Array.isArray(c)&&ZH(c)!==EN(c)?`<br><span class="zh">${md(ZH(c))}</span>`:''}</td>`;}).join('')+'</tr>';});
  return h+'</tbody></table></div>';}

const DATA=[{"id":"mi1","c":"micro","n":1,"t":["Basic Economic Concepts","基本經濟觀念"],"mcq":[{"k":"k","q":["Scarcity exists because","稀少性之所以存在，是因為"],"o":[["governments ration many goods","政府對許多商品實施配給"],["some goods are free","有些商品是免費的"],["resources are limited relative to people’s wants","相對於人們的慾望，資源是有限的"],["prices of most goods are too high","大多數商品的價格太高"],["firms restrict output to raise profits","廠商為了提高利潤而限制產量"]],"a":"C","e":["Scarcity means limited resources cannot satisfy unlimited wants, so every society must make choices.","稀少性是指有限的資源無法滿足無窮的慾望，因此每個社會都必須做選擇。"]},{"k":"c","q":["Mia quits a job that pays $30,000 a year to attend college for one year. Tuition and books cost $10,000. She spends $8,000 on food, which she would also spend if she kept working. What is her opportunity cost of attending college for the year?","Mia 辭去年薪 30,000 美元的工作去讀一年大學，學費和書費 10,000 美元。她的伙食費 8,000 美元，即使繼續工作也要花。她讀這一年大學的機會成本是多少？"],"o":["$10,000","$18,000","$30,000","$40,000","$48,000"],"a":"D","e":["Opportunity cost = forgone wages $30,000 + tuition and books $10,000 = $40,000. Food is not included because she pays it either way.","機會成本 = 放棄的薪水 30,000 + 學費書費 10,000 = 40,000 美元。伙食費不論是否讀書都要付，不算在內。"]},{"k":"k","q":["In a market economy, the basic economic questions of what, how and for whom to produce are answered mainly by","在市場經濟中，「生產什麼、如何生產、為誰生產」這些基本問題主要由什麼來決定？"],"o":[["prices and the choices of individual buyers and sellers","價格以及個別買方與賣方的選擇"],["custom and tradition","習俗與傳統"],["international organizations","國際組織"],["central government planners","中央政府的計畫者"],["a single large firm in each industry","各產業中的一家大型廠商"]],"a":"A","e":["Market economies rely on prices and voluntary exchange; command economies rely on central planners.","市場經濟靠價格與自願交易來分配資源；計畫經濟才是由中央計畫者決定。"]},{"k":"k","q":["A point inside a country’s production possibilities curve (PPC) represents","在一國生產可能曲線（PPC）內部的一點代表"],"o":[["unemployed or inefficiently used resources","有資源閒置或沒有被有效率地使用"],["an efficient use of all resources","所有資源都被有效率地使用"],["increasing opportunity costs","機會成本遞增"],["an unattainable combination of goods","無法達到的商品組合"],["economic growth","經濟成長"]],"a":"A","e":["Points inside the PPC are attainable but inefficient; points on the curve are efficient; points outside are unattainable.","PPC 內部的點可以達到但沒有效率；曲線上的點有效率；曲線外的點無法達到。"]},{"k":"k","q":["A PPC that is bowed outward (concave to the origin) shows that","向外凸出（凹向原點）的 PPC 表示"],"o":[["opportunity costs are constant","機會成本固定"],["technology is improving","技術正在進步"],["opportunity costs decrease as more of a good is produced","生產越多某商品，機會成本越低"],["the economy has unemployed resources","經濟中有閒置資源"],["opportunity costs increase because resources are not equally suited to producing both goods","因為資源不是同樣適合生產兩種商品，所以機會成本遞增"]],"a":"E","e":["As a country specializes more in one good, it must move less-suited resources into it, so each extra unit costs more of the other good.","當一國越專注生產某商品，就得投入越不適合的資源，因此每多生產一單位要放棄的另一種商品越多。"]},{"k":"k","q":["Which of the following would shift a country’s PPC outward?","下列何者會使一國的 PPC 向外移動？"],"o":[["An improvement in technology used to produce both goods","生產兩種商品的技術都進步"],["A decrease in the unemployment rate","失業率下降"],["Producing more consumer goods and fewer capital goods","多生產消費財、少生產資本財"],["An increase in the prices of both goods","兩種商品的價格都上漲"],["A movement from a point inside the PPC to a point on it","從 PPC 內部移到曲線上"]],"a":"A","e":["Better technology or more resources increase what can be produced, shifting the PPC out. Lower unemployment only moves the economy toward the curve.","技術進步或資源增加會讓 PPC 外移；失業下降只是讓經濟從曲線內部往曲線靠近。"]},{"k":"k","q":["A country’s PPC shows robots on the horizontal axis and wheat on the vertical axis. A new invention improves only the production of robots. The PPC will","某國 PPC 的橫軸是機器人、縱軸是小麥。一項新發明只提升機器人的生產技術，PPC 會"],"o":[["shift inward","向內移動"],["shift outward in a parallel way","平行向外移動"],["pivot outward along the robot axis, keeping the wheat intercept unchanged","以小麥截距為軸心，沿機器人軸向外轉動"],["pivot outward along the wheat axis, keeping the robot intercept unchanged","以機器人截距為軸心，沿小麥軸向外轉動"],["not change","不變"]],"a":"C","e":["Only the maximum number of robots rises, so the robot intercept moves out while the maximum amount of wheat stays the same.","只有機器人的最大產量增加，所以機器人那一端的截距外移，小麥的最大產量不變。"]},{"k":"c","q":["The table shows points on Atlantis’s PPC. What is the opportunity cost of moving from point C to point D?","下表是 Atlantis 的 PPC 上的各點。從 C 點移到 D 點的機會成本是多少？"],"o":[["4 units of butter","4 單位奶油"],["6 units of guns","6 單位槍砲"],["8 units of guns","8 單位槍砲"],["1 unit of guns","1 單位槍砲"],["14 units of guns","14 單位槍砲"]],"a":"B","e":["Moving from C to D gains 4 butter and gives up 14 − 8 = 6 guns, so the opportunity cost is 6 guns (1.5 guns per unit of butter).","從 C 到 D 多了 4 單位奶油，槍砲從 14 減到 8，放棄 6 單位槍砲（每單位奶油 1.5 單位槍砲）。"],"tbl":{"h":[["Point","點"],["Butter","奶油"],["Guns","槍砲"]],"r":[["A",0,20],["B",4,18],["C",8,14],["D",12,8],["E",16,0]]}},{"k":"k","q":["Using the same table, producing 12 units of butter and 6 units of guns is","根據同一張表，生產 12 單位奶油和 6 單位槍砲是"],"o":[["attainable and efficient","可以達到且有效率"],["unattainable with current resources","以目前資源無法達到"],["on the PPC at point D","位在 PPC 上的 D 點"],["evidence of economic growth","經濟成長的證據"],["attainable but inefficient","可以達到但沒有效率"]],"a":"E","e":["With 12 butter the economy could make 8 guns (point D). Making only 6 guns is inside the PPC: possible but wasteful.","生產 12 單位奶油時最多可以有 8 單位槍砲（D 點），只生產 6 單位表示在 PPC 內部，可以達到但沒有效率。"],"tbl":{"h":[["Point","點"],["Butter","奶油"],["Guns","槍砲"]],"r":[["A",0,20],["B",4,18],["C",8,14],["D",12,8],["E",16,0]]}},{"k":"k","q":["A person has a comparative advantage in producing a good when that person","一個人在生產某商品上具有比較利益，是指他"],"o":[["has more resources than others","擁有比別人更多的資源"],["has an absolute advantage in every good","在每種商品上都有絕對利益"],["has a lower opportunity cost of producing the good","生產該商品的機會成本比較低"],["can produce more of the good with the same resources","用同樣資源能生產更多該商品"],["can sell the good at a higher price","能用比較高的價格出售該商品"]],"a":"C","e":["Comparative advantage is about lower opportunity cost; producing more with the same resources is absolute advantage.","比較利益看的是機會成本比較低；用同樣資源生產較多是絕對利益。"]},{"k":"c","q":["In one day, Alpha can produce either 40 tons of wheat or 20 bolts of cloth. Beta can produce either 30 tons of wheat or 10 bolts of cloth. Which statement is correct?","Alpha 一天可以生產 40 噸小麥或 20 匹布；Beta 一天可以生產 30 噸小麥或 10 匹布。下列何者正確？"],"o":[["Alpha has a comparative advantage in both goods.","Alpha 在兩種商品上都有比較利益。"],["Neither can gain from trade because Alpha has an absolute advantage in both.","因為 Alpha 兩種都有絕對利益，雙方無法從貿易得利。"],["Alpha has a comparative advantage in wheat, and Beta in cloth.","Alpha 在小麥、Beta 在布料上有比較利益。"],["Beta has a comparative advantage in cloth.","Beta 在布料上有比較利益。"],["Alpha has a comparative advantage in cloth, and Beta in wheat.","Alpha 在布料、Beta 在小麥上有比較利益。"]],"a":"E","e":["Opportunity cost of 1 cloth: Alpha 40/20 = 2 wheat, Beta 30/10 = 3 wheat. Alpha has the lower cost of cloth; Beta has the lower cost of wheat (1/3 cloth vs. 1/2 cloth).","1 匹布的機會成本：Alpha = 40/20 = 2 噸小麥，Beta = 30/10 = 3 噸小麥，Alpha 較低；1 噸小麥的機會成本：Alpha 1/2 匹布、Beta 1/3 匹布，Beta 較低。"]},{"k":"c","q":["Using the information in the previous question, which terms of trade would benefit both Alpha and Beta?","承上題，下列哪一種交換條件能讓 Alpha 和 Beta 都得利？"],"o":[["1 bolt of cloth for 1 ton of wheat","1 匹布換 1 噸小麥"],["1 bolt of cloth for 3.5 tons of wheat","1 匹布換 3.5 噸小麥"],["1 bolt of cloth for 1.5 tons of wheat","1 匹布換 1.5 噸小麥"],["1 bolt of cloth for 2.5 tons of wheat","1 匹布換 2.5 噸小麥"],["1 bolt of cloth for 4 tons of wheat","1 匹布換 4 噸小麥"]],"a":"D","e":["Mutually beneficial terms lie between the two opportunity costs: more than 2 but fewer than 3 tons of wheat per bolt of cloth.","互利的交換條件要介於雙方的機會成本之間：1 匹布要換到多於 2 噸、少於 3 噸的小麥。"]},{"k":"c","q":["Lee needs 2 hours to make a shirt and 4 hours to bake a cake. Kim needs 3 hours to make a shirt and 9 hours to bake a cake. Who has the comparative advantage in cakes, and what is that person’s opportunity cost of one cake?","Lee 做一件襯衫要 2 小時、烤一個蛋糕要 4 小時；Kim 做一件襯衫要 3 小時、烤一個蛋糕要 9 小時。誰在蛋糕上有比較利益？他烤一個蛋糕的機會成本是多少？"],"o":[["Kim; 3 shirts","Kim；3 件襯衫"],["Lee; 0.5 shirt","Lee；0.5 件襯衫"],["Lee; 2 shirts","Lee；2 件襯衫"],["Kim; 1/3 shirt","Kim；1/3 件襯衫"],["Lee; 4 hours","Lee；4 小時"]],"a":"C","e":["These are input (hours per unit) numbers. One cake costs Lee 4/2 = 2 shirts and Kim 9/3 = 3 shirts, so Lee has the comparative advantage in cakes.","這是「每單位所需時間」的投入資料。一個蛋糕的機會成本：Lee = 4/2 = 2 件襯衫，Kim = 9/3 = 3 件襯衫，所以 Lee 在蛋糕有比較利益。"]},{"k":"k","q":["Specialization according to comparative advantage and trade allow countries to","依比較利益專業化並進行貿易，可以讓各國"],"o":[["produce outside their own PPCs","在自己的 PPC 外生產"],["avoid all opportunity costs","避免所有機會成本"],["eliminate scarcity","消除稀少性"],["gain an absolute advantage in every good","在每種商品都取得絕對利益"],["consume combinations of goods outside their own PPCs","消費到自己 PPC 以外的商品組合"]],"a":"E","e":["Trade does not change what a country can produce, but it lets the country consume beyond its own PPC.","貿易不會改變一國能生產的組合，但能讓它消費到自己 PPC 以外的組合。"]},{"k":"k","q":["A rational decision maker should keep doing an activity as long as","理性的決策者應該持續進行某項活動，只要"],"o":[["average benefit is greater than marginal cost","平均利益大於邊際成本"],["marginal benefit is greater than or equal to marginal cost","邊際利益大於或等於邊際成本"],["marginal cost is falling","邊際成本正在下降"],["total benefit is greater than zero","總利益大於零"],["total benefit is at its maximum","總利益達到最大"]],"a":"B","e":["Marginal analysis: each extra unit is worth doing if it adds at least as much benefit as cost.","邊際分析：只要多做一單位帶來的利益至少等於它的成本，就值得做。"]},{"k":"c","q":["Jay’s total benefit from studying is shown below. Each hour of studying costs him $10 of forgone work. How many hours should he study?","Jay 讀書的總利益如下表。每讀一小時，他放棄 10 美元的打工收入。他應該讀幾小時？"],"o":["1","2","3","4","5"],"a":"C","e":["Marginal benefits are 20, 16, 12, 8, 4. Study while MB ≥ MC = 10: the first three hours qualify, the fourth (MB = 8) does not.","邊際利益依序為 20、16、12、8、4。只要 MB ≥ MC = 10 就繼續讀：前三小時符合，第四小時 MB = 8 小於 10。"],"tbl":{"h":[["Hours","小時"],["Total benefit ($)","總利益（美元）"]],"r":[[0,0],[1,20],[2,36],[3,48],[4,56],[5,60]]}},{"k":"k","q":["The law of diminishing marginal utility states that","邊際效用遞減法則是指"],"o":[["consumers buy more when prices rise","價格上漲時消費者會買更多"],["each additional unit consumed adds less utility than the one before","每多消費一單位，增加的效用比前一單位少"],["prices fall as more units are sold","賣出越多，價格越低"],["marginal utility is always negative","邊際效用永遠是負的"],["total utility falls as more units are consumed","消費越多，總效用越低"]],"a":"B","e":["Marginal utility falls with each extra unit; total utility can still be rising as long as marginal utility is positive.","每多一單位的邊際效用逐漸下降；只要邊際效用仍為正，總效用仍在增加。"]},{"k":"c","q":["Pizza costs $2 a slice and soda costs $1 a can. For the last units Ana bought, the marginal utility of pizza is 20 and of soda is 15. To maximize utility with the same budget, Ana should","披薩一片 2 美元、汽水一罐 1 美元。Ana 最後買的那一片披薩邊際效用是 20，最後那罐汽水是 15。在預算不變下，為了使效用最大，Ana 應該"],"o":[["buy more pizza and less soda","多買披薩、少買汽水"],["spend less money in total","減少總支出"],["buy more soda and less pizza","多買汽水、少買披薩"],["keep her current purchases","維持目前的購買組合"],["buy more of both goods","兩種都多買"]],"a":"C","e":["MU per dollar: pizza 20/2 = 10, soda 15/1 = 15. Soda gives more utility per dollar, so shift spending toward soda until the ratios are equal.","每一元的邊際效用：披薩 20/2 = 10，汽水 15/1 = 15。汽水每一元帶來的效用較高，應把支出移向汽水，直到兩者相等。"]},{"k":"c","q":["A consumer is maximizing utility with goods X and Y. The price of X is $4 and the marginal utility of the last unit of X is 40. If the price of Y is $2, the marginal utility of the last unit of Y must be","某消費者在 X 與 Y 之間已達效用最大。X 的價格為 4 美元，最後一單位 X 的邊際效用為 40。若 Y 的價格為 2 美元，最後一單位 Y 的邊際效用必定是"],"o":["5","10","20","40","80"],"a":"C","e":["At the optimum MU_{X}/P_{X} = MU_{Y}/P_{Y}: 40/4 = 10, so MU_{Y} = 10 × 2 = 20.","效用最大時 MU_{X}/P_{X} = MU_{Y}/P_{Y}：40/4 = 10，所以 MU_{Y} = 10 × 2 = 20。"]},{"k":"c","q":["The marginal utility Ben gets from the 1st, 2nd, 3rd and 4th slices of cake is 30, 24, 15 and 5. What is his total utility from 3 slices?","Ben 吃第 1、2、3、4 塊蛋糕的邊際效用分別是 30、24、15、5。吃 3 塊的總效用是多少？"],"o":["15","23","54","69","74"],"a":"D","e":["Total utility is the sum of marginal utilities: 30 + 24 + 15 = 69.","總效用是邊際效用的加總：30 + 24 + 15 = 69。"]},{"k":"k","q":["Which of the following is a normative economic statement?","下列何者是規範經濟學的敘述？"],"o":[["When the price of coffee rises, people buy more tea.","咖啡漲價時，人們會買更多茶。"],["The government should raise the minimum wage.","政府應該提高最低工資。"],["Raising the minimum wage increases unemployment among teenagers.","提高最低工資會使青少年失業增加。"],["Last year the inflation rate was 3 percent.","去年的通膨率是 3%。"],["Tariffs raise the domestic price of imported goods.","關稅會提高進口商品的國內價格。"]],"a":"B","e":["A normative statement says what ought to be and involves a value judgment; the others can be tested with data.","規範敘述表達「應該怎樣」，牽涉價值判斷；其他選項都可以用資料檢驗。"]},{"k":"k","q":["Which of the following is an example of capital as a factor of production?","下列何者是作為生產要素的「資本」？"],"o":[["Money a bakery keeps in its bank account","麵包店存在銀行的錢"],["The land the bakery is built on","麵包店所在的土地"],["A delivery truck used by the bakery","麵包店用來送貨的貨車"],["The skill of the bakery’s head baker","麵包店主廚的手藝"],["The flour the bakery buys each week","麵包店每週買的麵粉"]],"a":"C","e":["In economics, capital means man-made tools used to produce goods. Money is a financial asset, skill is human capital, and land is a natural resource.","經濟學的資本是指用來生產的人造工具；錢是金融資產，手藝是人力資本，土地是自然資源。"]},{"k":"k","q":["Country X can produce more of every good than Country Y. Which statement is correct?","X 國每種商品都能生產得比 Y 國多。下列何者正確？"],"o":[["Both countries can still gain from trade if their opportunity costs differ.","只要機會成本不同，兩國仍可從貿易中得利。"],["Y has no comparative advantage.","Y 沒有任何比較利益。"],["X should produce every good itself.","X 應該自己生產所有商品。"],["Trade will lower both countries’ consumption.","貿易會減少兩國的消費。"],["X cannot gain from trading with Y.","X 無法從和 Y 的貿易中得利。"]],"a":"A","e":["Absolute advantage in everything does not rule out gains from trade; what matters is differences in opportunity cost.","在所有商品都有絕對利益，並不代表不能從貿易得利；關鍵在於機會成本不同。"]}],"frq":[{"t":["Comparative Advantage and the PPC","比較利益與 PPC"],"len":"Long","s":["In one month, using all of its resources, Artland can produce either 50 tons of corn or 25 cameras. Beria can produce either 60 tons of corn or 15 cameras. Assume constant opportunity costs.","Artland 一個月用盡全部資源，可以生產 50 噸玉米或 25 台相機；Beria 可以生產 60 噸玉米或 15 台相機。假設機會成本固定。"],"tbl":{"h":[["Country","國家"],["Corn (tons)","玉米（噸）"],["Cameras","相機（台）"]],"r":[["Artland",50,25],["Beria",60,15]]},"p":[{"q":["Draw a correctly labeled PPC for Artland with cameras on the horizontal axis. Label the intercepts with numbers.","以相機為橫軸，畫出 Artland 正確標示的 PPC，並標出兩端截距的數值。"],"a":["A straight-line PPC from 50 tons of corn on the vertical axis to 25 cameras on the horizontal axis (constant opportunity cost).","一條直線 PPC，從縱軸 50 噸玉米連到橫軸 25 台相機（機會成本固定）。"],"af":{"xm":30,"ym":60,"xl":"Cameras","yl":"Corn","xt":[[25,"25"]],"yt":[[50,"50"]],"ln":[{"p":[[0,50],[25,0]],"c":"g","l":"PPC (Artland)","lp":[13,30]}],"pt":[{"x":5,"y":20,"l":"U"},{"x":20,"y":40,"l":"X"}]}},{"q":["Calculate Artland’s opportunity cost of producing one camera.","計算 Artland 生產一台相機的機會成本。"],"a":["50 ÷ 25 = 2 tons of corn per camera.","50 ÷ 25 = 每台相機 2 噸玉米。"]},{"q":["Which country has the comparative advantage in producing corn? Explain using opportunity cost.","哪一國在生產玉米上有比較利益？請用機會成本說明。"],"a":["Beria. One ton of corn costs Beria 15/60 = 0.25 camera but costs Artland 25/50 = 0.5 camera; Beria’s opportunity cost is lower.","Beria。Beria 生產 1 噸玉米的機會成本是 15/60 = 0.25 台相機，Artland 是 25/50 = 0.5 台相機，Beria 較低。"]},{"q":["If the two countries trade 1 camera for 3 tons of corn, will both countries benefit? Explain.","如果兩國以 1 台相機換 3 噸玉米進行貿易，兩國都會得利嗎？請說明。"],"a":["Yes. Artland gives up 2 tons of corn to make a camera and gets 3 tons for it; Beria gives up 4 tons of corn (60/15) to make a camera itself but pays only 3 tons. The price lies between 2 and 4.","會。Artland 自己生產一台相機只放棄 2 噸玉米，交易卻能換到 3 噸；Beria 自己生產一台相機要放棄 4 噸玉米（60/15），交易只需付 3 噸。交換條件介於 2 與 4 之間。"]},{"q":["On your graph from part (a), plot a point U that shows Artland with unemployed resources and a point X that is unattainable for Artland without trade.","在 (a) 的圖上標出點 U，表示 Artland 有閒置資源；再標出點 X，表示 Artland 在沒有貿易時無法達到的組合。"],"a":["U is any point inside the PPC (for example 5 cameras, 20 tons). X is any point outside the PPC (for example 20 cameras, 40 tons).","U 可以是 PPC 內部任一點（例如 5 台相機、20 噸玉米）；X 可以是 PPC 外任一點（例如 20 台相機、40 噸玉米）。"]}]},{"t":["Utility Maximization","效用極大化"],"len":"Short","s":["Sam has $10 to spend on coffee and bagels. A coffee costs $2 and a bagel costs $1. The table shows Sam’s marginal utility from each unit.","Sam 有 10 美元可以買咖啡和貝果。咖啡一杯 2 美元，貝果一個 1 美元。下表是 Sam 每多消費一單位的邊際效用。"],"tbl":{"h":[["Unit","單位"],["MU of coffee","咖啡的 MU"],["MU per $ of coffee","咖啡每元 MU"],["MU of bagels","貝果的 MU"],["MU per $ of bagels","貝果每元 MU"]],"r":[[1,20,10,12,12],[2,16,8,10,10],[3,12,6,8,8],[4,8,4,6,6],[5,4,2,4,4]],"b":[[0,2],[1,2],[2,2],[3,2],[4,2],[2,4],[3,4]]},"p":[{"q":["Complete the table by calculating the marginal utility per dollar in each blank.","計算每個空格的「每一元邊際效用」，把表格填完。"],"a":["Coffee: 20/2 = 10, 16/2 = 8, 12/2 = 6, 8/2 = 4, 4/2 = 2. Bagels (price $1): MU per dollar equals MU, so 8 and 6.","咖啡：20/2 = 10、16/2 = 8、12/2 = 6、8/2 = 4、4/2 = 2。貝果價格 1 美元，每元 MU 就等於 MU，所以是 8 和 6。"]},{"q":["What combination of coffee and bagels maximizes Sam’s utility? Show that it satisfies the utility-maximizing rule.","哪一種咖啡與貝果的組合能使 Sam 的效用最大？請說明它符合效用極大化法則。"],"a":["3 coffees and 4 bagels. It spends 3 × $2 + 4 × $1 = $10, and MU per dollar is equal: 12/2 = 6 for coffee and 6/1 = 6 for bagels.","3 杯咖啡、4 個貝果。總支出 3 × 2 + 4 × 1 = 10 美元剛好用完，而且每一元邊際效用相等：咖啡 12/2 = 6，貝果 6/1 = 6。"]},{"q":["Draw Sam’s budget line with bagels on the horizontal axis. Label both intercepts and plot the utility-maximizing combination as point E.","以貝果為橫軸畫出 Sam 的預算線，標出兩端截距，並把效用最大的組合標為 E 點。"],"a":["The budget line runs from 5 coffees (vertical intercept) to 10 bagels (horizontal intercept). Point E is at 4 bagels and 3 coffees, on the line.","預算線從縱軸 5 杯咖啡連到橫軸 10 個貝果；E 點在線上的（4 個貝果、3 杯咖啡）。"],"af":{"xm":12,"ym":6,"xl":"Bagels","yl":"Coffee","xt":[[4,"4"],[10,"10"]],"yt":[[3,"3"],[5,"5"]],"ln":[{"p":[[0,5],[10,0]],"c":"d","l":"Budget line","lp":[7,2.2]}],"g":[[4,3]],"pt":[{"x":4,"y":3,"l":"E"}]}},{"q":["If the price of a bagel rises to $2, will Sam buy more or fewer bagels? Explain using marginal utility per dollar.","如果貝果漲到 2 美元，Sam 會買比較多還是比較少的貝果？請用每一元邊際效用說明。"],"a":["Fewer. Each bagel’s MU per dollar is cut in half (for example, the 4th bagel falls from 6 to 3), now below coffee’s, so Sam shifts spending toward coffee.","比較少。每個貝果的每一元邊際效用減半（例如第 4 個從 6 降到 3），低於咖啡，Sam 會把支出移向咖啡。"]}]}]},{"id":"mi2","c":"micro","n":2,"t":["Supply and Demand","供給與需求"],"mcq":[{"k":"k","q":["Other things equal, an increase in the price of a good causes","其他條件不變下，某商品價格上升會造成"],"o":[["a leftward shift of the supply curve","供給曲線左移"],["an increase in demand","需求增加"],["a decrease in demand","需求減少"],["an increase in supply","供給增加"],["a decrease in quantity demanded","需求量減少"]],"a":"E","e":["A change in the good’s own price moves buyers along the demand curve: quantity demanded changes, demand does not.","商品本身價格改變只會沿著需求曲線移動，改變的是需求量，不是需求。"]},{"k":"k","q":["Which of the following would shift the demand curve for coffee to the right?","下列何者會使咖啡的需求曲線右移？"],"o":[["A decrease in the number of coffee drinkers","喝咖啡的人數減少"],["An increase in the price of sugar, a complement","互補品糖的價格上漲"],["An increase in the price of tea, a substitute","替代品茶的價格上漲"],["A decrease in the price of coffee","咖啡價格下跌"],["A new tax on coffee producers","對咖啡生產者課徵新稅"]],"a":"C","e":["When a substitute becomes more expensive, buyers switch to coffee, so demand for coffee increases.","替代品變貴時，消費者轉買咖啡，咖啡需求增加。"]},{"k":"k","q":["When consumers’ incomes rise, the demand for bus rides falls. Bus rides are","當消費者所得上升時，搭公車的需求下降。搭公車是"],"o":[["a good with perfectly inelastic demand","需求完全無彈性的商品"],["an inferior good","劣等財"],["a luxury good","奢侈品"],["a complement to cars","汽車的互補品"],["a normal good","正常財"]],"a":"B","e":["If demand falls when income rises, the good is inferior.","所得上升時需求反而下降，就是劣等財。"]},{"k":"k","q":["Which of the following would shift the supply curve of corn to the right?","下列何者會使玉米的供給曲線右移？"],"o":[["An increase in the price of corn","玉米價格上漲"],["An increase in the wages of farm workers","農工工資上漲"],["A new fertilizer that raises crop yields","新肥料提高了產量"],["An increase in consumers’ incomes","消費者所得增加"],["A drought in corn-growing regions","玉米產區發生乾旱"]],"a":"C","e":["Better technology lowers production costs and increases supply. A change in corn’s own price is a movement along the curve.","技術進步降低生產成本，使供給增加；玉米本身價格改變只是沿著曲線移動。"]},{"k":"k","q":["Which of the following causes a movement along a good’s supply curve rather than a shift of the curve?","下列何者會造成沿著供給曲線移動，而不是整條曲線移動？"],"o":[["A per-unit tax on producers","對生產者課徵從量稅"],["A change in input prices","投入價格改變"],["A change in technology","技術改變"],["A change in the number of sellers","賣方數目改變"],["A change in the price of the good itself","商品本身價格改變"]],"a":"E","e":["Only the good’s own price moves sellers along the supply curve; the other factors shift the whole curve.","只有商品本身價格會沿著供給曲線移動，其他因素都會使整條曲線移動。"]},{"k":"k","q":["If demand for a good increases while supply decreases, the equilibrium price will","如果某商品需求增加、同時供給減少，均衡價格會"],"o":[["decrease, and the equilibrium quantity will increase","下降，均衡數量增加"],["increase, and the equilibrium quantity will be indeterminate","上升，均衡數量無法確定"],["be indeterminate, and the equilibrium quantity will increase","無法確定，均衡數量增加"],["increase, and the equilibrium quantity will increase","上升，均衡數量增加"],["be indeterminate, and the equilibrium quantity will decrease","無法確定，均衡數量減少"]],"a":"B","e":["Both shifts push price up. Higher demand raises quantity but lower supply reduces it, so the change in quantity depends 量為 40（1 + 0.05Q = 3），短缺 30 單位。"],"fig":{"xm":100,"ym":12,"xl":"Quantity","yl":"Price ($)","xt":[[40,"40"],[60,"60"],[70,"70"]],"yt":[[1,"1"],[3,"3"],[4,"4"],[10,"10"]],"ln":[{"p":[[0,10],[100,0]],"c":"d","l":"D"},{"p":[[0,1],[100,6]],"c":"s","l":"S"}],"g":[[60,4]],"pt":[{"x":60,"y":4,"l":"E"}],"alt":"supply and demand"}},{"k":"k","q":["A binding price floor in a competitive market will result in","在競爭市場中，有效的價格下限會造成"],"o":[["a surplus and a deadweight loss","過剩與無謂損失"],["a shortage and a deadweight loss","短缺與無謂損失"],["a surplus and an increase in total surplus","過剩，且總剩餘增加"],["no change in the market","市場沒有任何改變"],["a higher quantity traded","交易量增加"]],"a":"A","e":["A floor above equilibrium makes quantity supplied exceed quantity demanded; fewer units are traded, creating deadweight loss.","高於均衡價格的下限使供給量大於需求量；成交量減少，產生無謂損失。"]},{"k":"c","q":["In a market where Q_{d} = 100 − 2P and Q_{s} = −20 + 4P, the government places a $3 per-unit tax on sellers. How much tax revenue does the government collect?","某市場 Q_{d} = 100 − 2P，Q_{s} = −20 + 4P。政府對賣方課徵每單位 3 美元的稅，政府的稅收是多少？"],"o":["$56","$66","$120","$168","$180"],"a":"D","e":["New supply: Q_{s} = −20 + 4(P − 3). Setting 100 − 2P = −32 + 4P gives P = $22 (buyers pay) and Q = 56. Revenue = $3 × 56 = $168.","課稅後供給：Q_{s} = −20 + 4(P − 3)。令 100 − 2P = −32 + 4P，得買方價格 P = 22、Q = 56。稅收 = 3 × 56 = 168 美元。"]},{"k":"k","q":["A per-unit tax falls more heavily on buyers than on sellers when","在下列哪種情況，從量稅的負擔會比較多落在買方？"],"o":[["demand is more elastic than supply","需求比供給有彈性"],["the tax is collected from buyers","稅是向買方徵收"],["supply is perfectly elastic and demand is perfectly elastic","供給與需求都完全有彈性"],["demand is less elastic than supply","需求比供給缺乏彈性"],["the tax is collected from sellers","稅是向賣方徵收"]],"a":"D","e":["The side that is less responsive to price bears more of the tax, no matter who sends the money to the government.","對價格反應比較小（彈性小）的一方負擔較多，與由誰繳稅無關。"]},{"k":"k","q":["A per-unit subsidy paid to producers in a competitive market will","在競爭市場中，對生產者發放每單位補貼會"],"o":[["increase quantity beyond the efficient level and create a deadweight loss","使數量超過有效率水準，產生無謂損失"],["decrease quantity and raise the price buyers pay","使數量減少，買方價格上升"],["raise the price buyers pay and lower the price sellers receive","提高買方價格、降低賣方實收價格"],["eliminate deadweight loss","消除無謂損失"],["shift the demand curve to the right","使需求曲線右移"]],"a":"A","e":["The subsidy shifts supply right: buyers pay less, sellers receive more, and the extra units cost more than they are worth to buyers.","補貼使供給右移：買方付較少、賣方收較多，多出來的數量成本高於買方的評價，產生無謂損失。"]},{"k":"c","q":["Domestic demand is Q_{d} = 120 − 10P and domestic supply is Q_{s} = 10P. The world price is $4. If the government imposes a $1 tariff per unit, what is the tariff revenue?","國內需求 Q_{d} = 120 − 10P，國內供給 Q_{s} = 10P，世界價格 4 美元。若政府對每單位進口課 1 美元關稅，關稅收入是多少？"],"o":["$10","$20","$30","$40","$60"],"a":"B","e":["With the tariff the domestic price is $5: Q_{d} = 70, Q_{s} = 50, so imports = 20. Revenue = $1 × 20 = $20.","課關稅後國內價格為 5 美元：Q_{d} = 70、Q_{s} = 50，進口 20 單位。關稅收入 = 1 × 20 = 20 美元。"]},{"k":"k","q":["In a competitive market without externalities, the equilibrium quantity is efficient because","在沒有外部性的競爭市場中，均衡數量有效率，是因為"],"o":[["total surplus (consumer plus producer surplus) is maximized","總剩餘（消費者加生產者剩餘）達到最大"],["producer surplus is maximized","生產者剩餘達到最大"],["consumer surplus is maximized","消費者剩餘達到最大"],["every buyer pays the same price as every seller’s cost","每位買方付的價格等於每位賣方的成本"],["price equals average total cost","價格等於平均總成本"]],"a":"A","e":["At equilibrium every unit worth more to buyers than it costs sellers is traded, so total surplus is as large as possible.","均衡時，所有買方評價高於賣方成本的單位都被交易，總剩餘最大。"]},{"k":"k","q":["Compared with free trade, a tariff on an imported good","和自由貿易相比，對進口商品課徵關稅會"],"o":[["eliminates deadweight loss","消除無謂損失"],["increases consumer surplus","增加消費者剩餘"],["lowers the domestic price and increases imports","降低國內價格並增加進口"],["reduces producer surplus for domestic firms","減少國內廠商的生產者剩餘"],["raises the domestic price, increases domestic production and reduces imports","提高國內價格、增加國內生產並減少進口"]],"a":"E","e":["A tariff raises the domestic price: domestic producers sell more, consumers buy less, imports fall, and deadweight loss appears.","關稅提高國內價格：國內生產增加、消費減少、進口下降，並產生無謂損失。"]}],"frq":[{"t":["A Per-Unit Tax","從量稅"],"len":"Long","s":["In the competitive market for avocados, demand is Q_{d} = 120 − 10P and supply is Q_{s} = 20P − 60, where P is in dollars.","在競爭的酪梨市場中，需求為 Q_{d} = 120 − 10P，供給為 Q_{s} = 20P − 60，P 的單位是美元。"],"p":[{"q":["Draw a correctly labeled graph of the avocado market. Show the equilibrium price and quantity, with numbers.","畫出正確標示的酪梨市場圖，標出均衡價格與數量的數值。"],"a":["Setting 120 − 10P = 20P − 60 gives P = $6 and Q = 60. Demand reaches the price axis at $12; supply starts at $3.","令 120 − 10P = 20P − 60，得 P = 6 美元、Q = 60。需求線在價格軸的截距是 12 美元，供給線從 3 美元開始。"],"af":{"xm":130,"ym":14,"xl":"Quantity","yl":"Price ($)","xt":[[60,"60"]],"yt":[[3,"3"],[6,"6"],[12,"12"]],"ln":[{"p":[[0,12],[120,0]],"c":"d","l":"D"},{"p":[[0,3],[80,7]],"c":"s","l":"S"}],"g":[[60,6,"Q*","P*"]],"pt":[{"x":60,"y":6,"l":"E"}]}},{"q":["Calculate consumer surplus and producer surplus at equilibrium.","計算均衡時的消費者剩餘與生產者剩餘。"],"a":["CS = ½ × 60 × (12 − 6) = $180. PS = ½ × 60 × (6 − 3) = $90.","CS = ½ × 60 × (12 − 6) = 180 美元；PS = ½ × 60 × (6 − 3) = 90 美元。"]},{"q":["The government imposes a $1.50 per-unit tax on sellers. On your graph, show the new supply curve and label the price buyers pay (P_{b}), the price sellers receive (P_{s}) and the new quantity (Q_{t}). Find their values.","政府對賣方課徵每單位 1.50 美元的稅。在圖上畫出新的供給曲線，標出買方價格 P_{b}、賣方實收價格 P_{s} 與新數量 Q_{t}，並求出數值。"],"a":["New supply: Q_{s} = 20(P − 1.5) − 60. Setting 120 − 10P = 20P − 90 gives P_{b} = $7, Q_{t} = 50, and P_{s} = 7 − 1.5 = $5.50.","新的供給：Q_{s} = 20(P − 1.5) − 60。令 120 − 10P = 20P − 90，得 P_{b} = 7 美元、Q_{t} = 50，P_{s} = 7 − 1.5 = 5.50 美元。"],"af":{"xm":130,"ym":14,"xl":"Quantity","yl":"Price ($)","xt":[[50,"50"],[60,"60"]],"yt":[[5.5,"5.5"],[7,"7"]],"sh":[ um, the price floor, the surplus and the deadweight loss (shade it).","畫出正確標示的牛奶市場圖，標出均衡、價格下限、過剩量，並把無謂損失塗色。"],"a":["Equilibrium at $4 and 60. The floor is a horizontal line at $5; quantity traded falls to 40. The deadweight loss is the triangle between demand and supply from Q = 40 to Q = 60.","均衡在 4 美元、60 單位。價格下限是 5 美元的水平線，成交量降為 40。無謂損失是 Q = 40 到 60 之間、需求線與供給線之間的三角形。"],"af":{"xm":110,"ym":8,"xl":"Quantity","yl":"Price ($)","xt":[[40,"40"],[60,"60"],[80,"80"]],"yt":[[3,"3"],[4,"4"],[5,"5"]],"sh":[{"p":[[40,5],[60,4],[40,3]],"c":"c","l":"DWL","lx":46,"ly":4}],"ln":[{"p":[[0,7],[120,1]],"c":"d","l":"D"},{"p":[[0,1],[120,7]],"c":"s","l":"S"},{"p":[[0,5],[105,5]],"c":"k","d":1,"l":"Price floor","lp":[104,5.3],"la":"end"}],"g":[[60,4],[40,5],[80,5]],"pt":[{"x":60,"y":4,"l":"E"}],"tx":[{"x":60,"y":5.45,"t":"surplus = 40"}]}},{"q":["Assume the government does not buy the surplus. Does milk producers’ total revenue rise or fall because of the floor? Show your calculation.","假設政府不收購過剩的牛奶。價格下限使牛奶生產者的總收益增加還是減少？請列出計算。"],"a":["It falls: revenue goes from $4 × 60 = $240 to $5 × 40 = $200, consistent with elastic demand in this range.","減少：總收益從 4 × 60 = 240 美元變成 5 × 40 = 200 美元，與這段需求有彈性一致。"]}]}]},{"id":"mi3","c":"micro","n":3,"t":["Production, Cost, and the Perfect Competition Model","生產、成本與完全競爭模型"],"mcq":[{"k":"k","q":["The law of diminishing marginal returns states that, in the short run,","邊際報酬遞減法則是指，在短期內"],"o":[["all inputs become less productive in the long run","長期下所有投入都會變得比較沒有生產力"],["as a firm grows larger, its average total cost falls","廠商規模越大，平均總成本越低"],["total product falls as soon as a second worker is hired","僱用第二位勞工後總產量就開始下降"],["as more of a variable input is added to a fixed input, marginal product eventually falls","在固定投入上持續增加變動投入，邊際產量最終會下降"],["marginal cost falls as output rises","邊際成本隨產量增加而下降"]],"a":"D","e":["Diminishing returns is a short-run idea: with some inputs fixed, adding more of a variable input eventually adds less and less output.","邊際報酬遞減是短期觀念：在部分投入固定下，增加變動投入，新增的產量最終會越來越少。"]},{"k":"c","q":["Refer to the table. What is the marginal product of the third worker?","參考下表。第三位勞工的邊際產量是多少？"],"o":["8","11","12","25","36"],"a":"B","e":["MP of the 3rd worker = TP(3) − TP(2) = 36 − 25 = 11.","第三位勞工的 MP = TP(3) − TP(2) = 36 − 25 = 11。"],"tbl":{"h":[["Workers","勞工人數"],["Total product","總產量"]],"r":[[0,0],[1,10],[2,25],[3,36],[4,44],[5,48]]}},{"k":"c","q":["Using the same table, diminishing marginal returns begin with which worker?","根據同一張表，邊際報酬遞減從第幾位勞工開始？"],"o":[["The first worker","第一位勞工"],["The second worker","第二位勞工"],["The third worker","第三位勞工"],["The fourth worker","第四位勞工"],["The fifth worker","第五位勞工"]],"a":"C","e":["Marginal products are 10, 15, 11, 8, 4. MP first falls with the third worker (15 → 11).","邊際產量依序為 10、15、11、8、4，從第三位勞工開始下降（15 → 11）。"],"tbl":{"h":[["Workers","勞工人數"],["Total product","總產量"]],"r":[[0,0],[1,10],[2,25],[3,36],[4,44],[5,48]]}},{"k":"k","q":["When marginal cost is below average total cost,","當邊際成本低於平均總成本時，"],"o":[["average fixed cost is rising","平均固定成本正在上升"],["average total cost is at its minimum","平均總成本在最低點"],["average total cost is rising","平均總成本正在上升"],["average total cost is falling","平均總成本正在下降"],["the firm must be earning a profit","廠商一定有利潤"]],"a":"D","e":["If the extra unit costs less than the average, it pulls the average down.","多生產的那一單位成本低於平均，就會把平均拉低。"]},{"k":"k","q":["The marginal cost curve intersects the average total cost curve and the average variable cost curve","邊際成本曲線與平均總成本曲線、平均變動成本曲線的交點位於"],"o":[["never","永遠不會相交"],["where they are rising fastest","它們上升最快的地方"],["at their minimum points","它們的最低點"],["at their maximum points","它們的最高點"],["at zero output","產量為零的地方"]],"a":"C","e":["Because MC pulls averages down when below and up when above, it crosses each average curve at its lowest point.","MC 低於平均時把平均拉低、高於時把平均拉高，所以會穿過各平均成本曲線的最低點。"]},{"k":"k","q":["Which short-run cost curve always declines as output increases?","哪一條短期成本曲線會隨產量增加而一直下降？"],"o":[["Average variable cost","平均變動成本"],["Average total cost","平均總成本"],["Marginal cost","邊際成本"],["Average fixed cost","平均固定成本"],["Total variable cost","總變動成本"]],"a":"D","e":["AFC = TFC ÷ Q, and the same fixed cost is spread over more units as Q rises.","AFC = TFC ÷ Q，同樣的固定成本分攤到越多單位，就越低。"]},{"k":"c","q":["A firm has total fixed cost of $100. When it produces 10 units, its total variable cost is $200. What is its average total cost at 10 units?","某廠商總固定成本為 100 美元。生產 10 單位時，總變動成本為 200 美元。生產 10 單位時的平均總成本是多少？"],"o":["$10","$20","$30","$100","$300"],"a":"C","e":["ATC = (TFC + TVC) ÷ Q = (100 + 200) ÷ 10 = $30.","ATC = (TFC + TVC) ÷ Q = (100 + 200) ÷ 10 = 30 美元。"]},{"k":"c","q":["A firm’s total cost is $120 when it makes 4 units and $145 when it makes 5 units. What is the marginal cost of the fifth unit?","某廠商生產 4 單位時總成本 120 美元，生產 5 單位時 145 美元。第 5 單位的邊際成本是多少？"],"o":["$24","$25","$29","$120","$145"],"a":"B","e":["MC = ΔTC ÷ ΔQ = (145 − 120) ÷ 1 = $25.","MC = ΔTC ÷ ΔQ = (145 − 120) ÷ 1 = 25 美元。"]},{"k":"c","q":["A firm’s total cost is TC = 50 + 5Q. At Q = 10, what are its average fixed cost and marginal cost?","某廠商的總成本 TC = 50 + 5Q。在 Q = 10 時，平均固定成本與邊際成本各是多少？"],"o":[["AFC = $50, MC = $5","AFC = 50 美元，MC = 5 美元"],["AFC = $5, MC = $55","AFC = 5 美元，MC = 55 美元"],["AFC = $5, MC = $10","AFC = 5 美元，MC = 10 美元"],["AFC = $10, MC = $5","AFC = 10 美元，MC = 5 美元"],["AFC = $5, MC = $5","AFC = 5 美元，MC = 5 美元"]],"a":"E","e":["TFC = 50, so AFC = 50 ÷ 10 = $5. Each extra unit adds $5 to TC, so MC = $5.","TFC = 50，AFC = 50 ÷ 10 = 5 美元；每多一單位 TC 增加 5 美元，MC = 5 美元。"]},{"k":"k","q":["A firm experiences economies of scale when","廠商具有規模經濟，是指"],"o":[["long-run average total cost falls as output increases","長期平均總成本隨產量增加而下降"],["marginal product falls as more workers are hired","僱用更多勞工時邊際產量下降"],["long-run average total cost rises as output increases","長期平均總成本隨產量增加而上升"],["total cost falls as output increases","總成本隨產量增加而下降"],["short-run average fixed cost falls","短期平均固定成本下降"]],"a":"A","e":["Economies of scale are a long-run idea: growing larger lowers cost per unit, for example through specialization.","規模經濟是長期觀念：擴大規模使每單位成本下降，例如分工更細。"]},{"k":"k","q":["Which of the following is most likely to cause diseconomies of scale?","下列何者最可能造成規模不經濟？"],"o":[["Spreading fixed costs over more output","固定成本分攤到更多產量"],["Using larger, more efficient machines","使用更大、更有效率的機器"],["Greater specialization of workers","勞工分工更專業"],["Buying inputs in bulk at a discount","大量採購投入取得折扣"],["Problems coordinating and managing a very large organization","超大型組織的協調與管理問題"]],"a":"E","e":["When a firm becomes very large, communication and management costs can raise long-run average cost.","廠商變得非常大時，溝通與管理成本可能使長期平均成本上升。"]},{"k":"c","q":["A bakery earns revenue of $200,000. Its explicit costs are $150,000. The owner could earn a salary of $60,000 working elsewhere. What are the bakery’s accounting profit and economic profit?","某麵包店收入 200,000 美元，外顯成本 150,000 美元。店主若到別處工作可領 60,000 美元薪水。麵包店的會計利潤與經濟利潤各是多少？"],"o":[["Accounting profit $50,000; economic profit $10,000","會計利潤 50,000；經濟利潤 10,000"],["Accounting profit $50,000; economic profit −$10,000","會計利潤 50,000；經濟利潤 −10,000"],["Accounting profit $50,000; economic profit $50,000","會計利潤 50,000；經濟利潤 50,000"],["Accounting profit $110,000; economic profit $50,000","會計利潤 110,000；經濟利潤 50,000"],["Accounting profit −$10,000; economic profit $50,000","會計利潤 −10,000；經濟利潤 50,000"]],"a":"B","e":["Accounting profit = 200,000 − 150,000 = $50,000. Economic profit also subtracts the $60,000 implicit cost: −$10,000.","會計利潤 = 200,000 − 150,000 = 50,000；經濟利潤再扣掉 60,000 的隱含成本，得 −10,000 美元。"]},{"k":"k","q":["A firm earning a normal profit","賺取正常利潤的廠商"],"o":[["is earning more than firms in other industries","賺得比其他產業的廠商多"],["should shut down in the short run","短期內應該停業"],["earns zero accounting profit","會計利潤為零"],["has total revenue below total explicit cost","總收益低於外顯成本總額"],["earns zero economic profit and covers all its opportunity costs","經濟利潤為零，而且涵蓋了所有機會成本"]],"a":"E","e":["Normal profit means total revenue just covers explicit and implicit costs, so economic profit is zero.","正常利潤表示總收益剛好涵蓋外顯與隱含成本，經濟利潤為零。"]},{"k":"k","q":["Every profit-maximizing firm, in any market structure, produces the quantity at which","任何市場結構中，追求利潤極大的廠商都會生產在"],"o":[["marginal revenue equals marginal cost","邊際收益等於邊際成本"],["average total cost is minimized","平均總成本最低"],["price equals average total cost","價格等於平均總成本"],["marginal cost is minimized","邊際成本最低"],["total revenue is maximized","總收益最大"]],"a":"A","e":["Producing up to MR = MC captures every unit that adds more to revenue than to cost.","生產到 MR = MC，所有收益大於成本的單位都會被生產，利潤最大。"]},{"k":"c","q":["A perfectly competitive firm faces a market price of $12. Its total cost schedule is shown. What is the firm’s maximum economic profit?","某完全競爭廠商面對市場價格 12 美元，其總成本表如下。廠商的最大經濟利潤是多少？"],"o":["$2","$10","$12","$50","$60"],"a":"B","e":["MC = 4, 6, 8, 10, 12, 14. Produce where P = MC = 12, at 5 units: profit = 12 × 5 − 50 = $10.","MC 依序為 4、6、8、10、12、14。在 P = MC = 12 的 5 單位生產：利潤 = 12 × 5 − 50 = 10 美元。"],"tbl":{"h":[["Output","產量"],["Total cost ($)","總成本（美元）"]],"r":[[0,10],[1,14],[2,20],[3,28],[4,38],[5,50],[6,64]]}},{"k":"k","q":["The demand curve facing an individual perfectly competitive firm is","完全競爭個別廠商面對的需求曲線是"],"o":[["downward sloping and more elastic than market demand","負斜率，但比市場需求有彈性"],["horizontal at the market price","在市場價格處的水平線"],["vertical at the profit-maximizing quantity","在利潤最大產量處的垂直線"],["downward sloping and the same as the market demand curve","負斜率，且與市場需求曲線相同"],["upward sloping","正斜率"]],"a":"B","e":["A price taker can sell any amount at the market price, so its demand curve is perfectly elastic: P = MR = AR.","價格接受者在市場價格下想賣多少都可以，需求曲線完全有彈性：P = MR = AR。"]},{"k":"k","q":["In the short run, a perfectly competitive firm should shut down when the market price falls below","在短期內，當市場價格低於下列何者時，完全競爭廠商應該停業？"],"o":[["minimum average variable cost","最低平均變動成本"],["marginal cost at every output","所有產量的邊際成本"],["minimum average total cost","最低平均總成本"],["marginal revenue","邊際收益"],["average fixed cost","平均固定成本"]],"a":"A","e":["If price is below minimum AVC, the firm cannot even cover variable costs, so producing loses more than its fixed cost.","價格低於最低 AVC 時連變動成本都付不起，生產的虧損會大於固定成本。"]},{"k":"c","q":["At its profit-maximizing output of 100 units, a perfectly competitive firm faces a price of $8, average total cost of $10 and average variable cost of $7. In the short run the firm should","某完全競爭廠商在利潤最大產量 100 單位時，價格 8 美元、平均總成本 10 美元、平均變動成本 7 美元。短期內這家廠商應該"],"o":[["shut down, with a loss of $200","停業，虧損 200 美元"],["keep producing, with a loss of $200","繼續生產，虧損 200 美元"],["shut down, with a loss of $300","停業，虧損 300 美元"],["keep producing, with a loss of $300","繼續生產，虧損 300 美元"],["keep producing, with a profit of $100","繼續生產，利潤 100 美元"]],"a":"B","e":["Producing: loss = (10 − 8) × 100 = $200. Shutting down: loss = TFC = (10 − 7) × 100 = $300. Since P > AVC, keep producing.","生產的虧損 = (10 − 8) × 100 = 200；停業的虧損 = TFC = (10 − 7) × 100 = 300。P > AVC，應繼續生產。"]},{"k":"k","q":["A perfectly competitive firm’s short-run supply curve is its","完全競爭廠商的短期供給曲線是"],"o":[["marginal cost curve above minimum average total cost only","只有位於最低平均總成本以上的邊際成本曲線"],["average total cost curve","平均總成本曲線"],["marginal cost curve above minimum average variable cost","位於最低平均變動成本以上的邊際成本曲線"],["average variable cost curve","平均變動成本曲線"],["marginal revenue curve","邊際收益曲線"]],"a":"C","e":["At any price above the shutdown point, the firm produces where P = MC, so the MC curve above minimum AVC is its supply curve.","價格高於停業點時，廠商生產在 P = MC，所以最低 AVC 以上的 MC 曲線就是供給曲線。"]},{"k":"c","q":["A perfectly competitive firm has minimum average variable cost of $9 and minimum average total cost of $15. In which price range will the firm keep producing in the short run while making a loss?","某完全競爭廠商最低平均變動成本為 9 美元，最低平均總成本為 15 美元。價格在哪個範圍時，廠商短期內會虧損但繼續生產？"],"o":[["Between $9 and $15","介於 9 美元與 15 美元之間"],["Exactly $15","剛好 15 美元"],["Between $0 and $15","介於 0 與 15 美元之間"],["Below $9","低於 9 美元"],["Above $15","高於 15 美元"]],"a":"A","e":["Between the shutdown price ($9) and the break-even price ($15), the firm covers variable cost but not total cost.","價格在停業點 9 美元與損益兩平點 15 美元之間時，能付變動成本但付不起全部成本。"]},{"k":"k","q":["If firms in a perfectly competitive industry are earning economic profits, in the long run","如果完全競爭產業中的廠商有經濟利潤，長期下"],"o":[["each firm’s demand curve becomes downward sloping","每家廠商的需求曲線變成負斜率"],["new firms enter, market supply increases and price falls until economic profit is zero","新廠商進入，市場供給增加，價格下降直到經濟利潤為零"],["economic profits continue indefinitely","經濟利潤會一直持續"],["the government must regulate the price","政府必須管制價格"],["firms exit and price rises","廠商退出，價格上升"]],"a":"B","e":["Free entry pulls in new firms while profits exist, shifting market supply right and lowering price to minimum ATC.","有利潤時自由進入吸引新廠商，市場供給右移，價格降到最低 ATC。"]},{"k":"k","q":["In long-run equilibrium, a perfectly competitive firm produces where","長期均衡時，完全競爭廠商的生產點滿足"],"o":[["P = MC but above minimum ATC","P = MC，但高於最低 ATC"],["P = MC = minimum ATC, so it is both allocatively and productively efficient","P = MC = 最低 ATC，同時具有配置效率與生產效率"],["P > MC, so it is allocatively inefficient","P > MC，沒有配置效率"],["MR > MC","MR > MC"],["P = minimum AVC","P = 最低 AVC"]],"a":"B","e":["P = MC means allocative efficiency; producing at minimum ATC means productive efficiency.","P = MC 代表配置效率；在最低 ATC 生產代表生產效率。"]},{"k":"k","q":["A city raises the annual license fee that every taxi company must pay, regardless of how many rides it gives. In the short run, a taxi company’s profit-maximizing output will","某城市調高每家計程車公司的年度牌照費，與載客次數無關。短期內，計程車公司的利潤最大產量會"],"o":[["stay the same, because marginal cost does not change","不變，因為邊際成本沒有改變"],["decrease, because marginal cost rises","減少，因為邊際成本上升"],["fall to zero","降為零"],["increase, because fixed cost rises","增加，因為固定成本上升"],["decrease, because average total cost rises","減少，因為平均總成本上升"]],"a":"A","e":["A license fee is a fixed cost: it raises AFC and ATC but not MC, so the MR = MC quantity is unchanged.","牌照費是固定成本：提高 AFC 與 ATC，但不影響 MC，所以 MR = MC 的產量不變。"]},{"k":"k","q":["In a constant-cost perfectly competitive industry, the long-run industry supply curve is","在固定成本的完全競爭產業中，長期產業供給曲線是"],"o":[["the same as the short-run market supply curve","與短期市場供給曲線相同"],["downward sloping","負斜率"],["horizontal","水平線"],["upward sloping","正斜率"],["vertical","垂直線"]],"a":"C","e":["When entry does not change input prices, every new firm has the same minimum ATC, so price returns to the same level.","進入不影響投入價格時，新廠商的最低 ATC 都相同，價格會回到同一水準。"]}],"frq":[{"t":["Short-Run Costs of a Competitive Firm","完全競爭廠商的短期成本"],"len":"Long","s":["The table shows the short-run costs of a perfectly competitive firm. Fill in the blanks first.","下表是某完全競爭廠商的短期成本。請先把空格填完。"],"tbl":{"h":[["Q","產量"],["TFC","總固定成本"],["TVC","總變動成本"],["TC","總成本"],["AFC","平均固定成本"],["AVC","平均變動成本"],["ATC","平均總成本"],["MC","邊際成本"]],"r":[[0,60,0,60,"—","—","—","—"],[1,60,40,100,60,40,100,40],[2,60,70,130,30,35,65,30],[3,60,90,150,20,30,50,20],[4,60,120,180,15,30,45,30],[5,60,160,220,12,32,44,40],[6,60,210,270,10,35,45,50]],"b":[[1,3],[2,2],[2,4],[2,7],[3,3],[3,5],[3,6],[4,4],[4,6],[4,7],[5,2],[5,5],[5,7],[6,3],[6,6]]},"p":[{"q":["Complete the table.","把表格填完。"],"a":["TC = TFC + TVC; AFC = TFC/Q; AVC = TVC/Q; ATC = TC/Q; MC = change in TC. The filled values are highlighted in the table.","TC = TFC + TVC；AFC = TFC/Q；AVC = TVC/Q；ATC = TC/Q；MC = TC 的變動量。填好的數值在表中以底色標示。"]},{"q":["The market price is $40. What quantity maximizes the firm’s profit (or minimizes its loss)? Calculate the firm’s profit or loss at that quantity.","市場價格為 40 美元。哪一個產量能使廠商利潤最大（或虧損最小）？計算該產量的利潤或虧損。"],"a":["P = MR = MC = $40 at Q = 5. TR = 40 × 5 = $200, TC = $220, so the firm loses $20.","在 Q = 5 時 P = MR = MC = 40 美元。TR = 40 × 5 = 200，TC = 220，虧損 20 美元。"]},{"q":["Should the firm keep producing in the short run at a price of $40? Explain using numbers.","價格 40 美元時，廠商短期內應該繼續生產嗎？請用數字說明。"],"a":["Yes. P = $40 is above AVC = $32 at Q = 5. Producing loses $20, but shutting down would lose all fixed cost, $60.","應該。Q = 5 時 P = 40 高於 AVC = 32。生產虧損 20 美元，停業則會虧掉全部固定成本 60 美元。"]},{"q":["Identify the shutdown price and the break-even price.","找出停業價格與損益兩平價格。"],"a":["Shutdown price = minimum AVC = $30. Break-even price = minimum ATC = $44.","停業價格 = 最低 AVC = 30 美元；損益兩平價格 = 最低 ATC = 44 美元。"]},{"q":["Draw a correctly labeled graph of the firm’s MC, ATC and AVC curves with the $40 price line. Label the profit-maximizing quantity and shade the area that shows the loss.","畫出正確標示的廠商 MC、ATC、AVC 曲線與 40 美元的價格線，標出利潤最大產量，並把代表虧損的面積塗色。"],"a":["MR = P = $40 is horizontal. Q = 5 where MR = MC. The loss is the rectangle between ATC ($44) and P ($40) from 0 to Q = 5, area $20.","MR = P = 40 為水平線。MR = MC 在 Q = 5。虧損是從 0 到 Q = 5、介於 ATC（44）與 P（40）之間的長方形，面積 20 美元。"],"af":{"h":360,"xm":7,"ym":70,"xl":"Quantity","yl":"Price, cost ($)","xt":[[5,"5"]],"yt":[[30,"AVC min = 30"],[40,"P = 40"],[44,"ATC = 44"]],"sh":[{"p":[[0,44],[5,44],[5,40],[0,40]],"c":"e","l":"Loss","lx":2.5,"ly":42}],"ln":[{"p":[[2,65],[3,50],[4,45],[5,44],[6,45],[6.6,47]],"c":"g","l":"ATC"},{"p":[[1,40],[2,35],[3,30],[4,30],[5,32],[6,35],[6.6,38]],"c":"y","l":"AVC"},{"p":[[1,40],[2,30],[3,20],[4,30],[5,40],[6,50],[6.6,58]],"c":"m","l":"MC"},{"p":[[0,40],[6.8,40]],"c":"k","l":"P = MR","lp":[0.2,36],"la":"start"}],"g":[[5,44]],"pt":[{"x":5,"y":40}]}},{"q":["If the price stays at $40, what will happen in the long run to the number of firms in the industry and to the market price?","如果價格維持在 40 美元，長期下產業中的廠商數目與市場價格會如何變化？"],"a":["Firms exit because of losses. Market supply decreases and price rises until it reaches minimum ATC ($44), where economic profit is zero.","因為虧損，廠商會退出。市場供給減少，價格上升到最低 ATC（44 美元），經濟利潤為零。"]}]},{"t":["An Increase in Market Demand","市場需求增加"],"len":"Short","s":["A constant-cost, perfectly competitive industry is in long-run equilibrium at a price of $10.","某固定成本的完全競爭產業處於長期均衡，價格為 10 美元。"],"p":[{"q":["Draw correctly labeled side-by-side graphs for the market and for a typical firm in long-run equilibrium. Show the market price P_{1} and the firm’s quantity q_{1}.","並排畫出市場與代表性廠商在長期均衡時正確標示的圖，標出市場價格 P_{1} 與廠商產量 q_{1}。"],"a":["Market: D and S cross at P_{1} = $10. Firm: P = MR = $10 is tangent to the bottom of ATC, where MC crosses it at q_{1}.","市場：D 與 S 交於 P_{1} = 10 美元。廠商：P = MR = 10 與 ATC 最低點相切，MC 也在 q_{1} 穿過該點。"],"af":[{"w":300,"xm":10,"ym":10,"xl":"Q (market)","yl":"P","yt":[[5,"P₁ = $10"]],"ln":[{"p":[[1,9],[9,1]],"c":"d","l":"D"},{"p":[[1,1],[9,9]],"c":"s","l":"S"}],"g":[[5,5,"Q₁"]],"pt":[{"x":5,"y":5}]},{"w":300,"xm":10,"ym":10,"xl":"q (firm)","yl":"P, cost","yt":[[5,"$10"]],"ln":[{"a":1.5,"b":9.2,"c":"g","l":"ATC","p":[[1.5,9.2875],[1.5962,9.0549],[1.6925,8.8288],[1.7887,8.6092],[1.885,8.3961],[1.9812,8.1895],[2.0775,7.9894],[2.1738,7.7957],[2.27,7.6085],[2.3662,7.4278],[2.4625,7.2536],[2.5587,7.0859],[2.655,6.9247],[2.7512,6.7699],[2.8475,6.6216],[2.9437,6.4799],[3.04,6.3446],[3.1362,6.2157],[3.2325,6.0934],[3.3287,5.9776],[3.425,5.8682],[3.5212,5.7653],[3.6175,5.669],[3.7138,5.5791],[3.81,5.4956],[3.9062,5.4187],[4.0025,5.3483],[4.0987,5.2843],[4.195,5.2268],[4.2912,5.1758],[4.3875,5.1313],[4.4837,5.0933],[4.58,5.0617],[4.6762,5.0367],[4.7725,5.0181],[4.8688,5.006],[4.965,5.0004],[5.0612,5.0013],[5.1575,5.0087],[5.2537,5.0225],[5.35,5.0429],[5.4463,5.0697],[5.5425,5.103],[5.6387,5.1428],[5.735,5.1891],[5.8312,5.2418],[5.9275,5.3011],[6.0237,5.3668],[6.12,5.439],[6.2162,5.5177],[6.3125,5.6029],[6.4087,5.6946],[6.505,5.7928],[6.6012,5.8974],[6.6975,6.0085],[6.7937,6.1261],[6.89,6.2502],[6.9863,6.3808],[7.0825,6.5179],[7.1787,6.6614],[7.275,6.8115],[7.3712,6.968],[7.4675,7.131],[7.5637,7.3005],[7.66,7.4765],[7.7562,7.6589],[7.8525,7.8479],[7.9487,8.0433],[8.045,8.2452],[8.1412,8.4536],[8.2375,8.6685],[8.3337,8.8899],[8.43,9.1177],[8.5262,9.3521],[8.6225,9.5929],[8.7188,9.8402],[8.815,10.094]]},{"a":2.6,"b":6.3,"c":"m","l":"MC","p":[[2.6,2.648],[2.6463,2.579],[2.6925,2.5145],[2.7388,2.4545],[2.785,2.399],[2.8313,2.348],[2.8775,2.3015],[2.9238,2.2595],[2.97,2.2219],[3.0162,2.1889],[3.0625,2.1604],[3.108
