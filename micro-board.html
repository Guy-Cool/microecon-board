<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>個經互動畫板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a teacher's board — grouped template tabs on top, a large graph-paper board on the left, a control rail on the right; stacks on narrow screens */
:root{
  --bg:#e9eee9; --surface:#f6f8f5; --board:#fdfefc; --ink:#1b2621; --muted:#5a6a61;
  --rule:#cdd7d0; --grid:#e4eae5; --accent:#1d6b57; --accent-ink:#ffffff;
  --cD:#2457b3; --cS:#c24a12; --cMC:#b0246f; --cATC:#1d7a5c; --cAVC:#8a7414; --cMR:#6a49c9; --cP:#27322d;
  --aCS:#3d7be0; --aPS:#e3940e; --aDWL:#7a808c; --aPro:#1c9a54; --aLoss:#d23b3b; --aop:.22;
  --good:#1c7a46; --warn:#9a6400; --bad:#b83232;
  --inkR:#d23b3b; --inkB:#2457b3; --inkG:#1c8a4a; --inkO:#e07a10; --inkP:#7b3fc4; --inkM:#c2287a; --inkY:#b8960b; --inkC:#0e8fa3;
  --f-hand:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","KaiTi",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111916; --surface:#17221e; --board:#1a2823; --ink:#e6eee8; --muted:#97aa9f;
    --rule:#2d3d36; --grid:#22332c; --accent:#7ccfb4; --accent-ink:#0f1915;
    --cD:#86aefc; --cS:#ff9b6a; --cMC:#f283c2; --cATC:#6fd5a9; --cAVC:#dcc66e; --cMR:#b9a4ff; --cP:#e6eee8;
    --aCS:#6c9cf5; --aPS:#f2b23e; --aDWL:#a3acb9; --aPro:#3fcf7d; --aLoss:#ff6b6b; --aop:.3;
    --good:#5fd394; --warn:#f0b54a; --bad:#ff7b7b; --inkR:#ff8a80; --inkB:#8fb4ff; --inkG:#5fd394; --inkO:#ffad5c; --inkP:#c3a3ff; --inkM:#ff86c2; --inkY:#f2d24b; --inkC:#5fd6e8;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111916; --surface:#17221e; --board:#1a2823; --ink:#e6eee8; --muted:#97aa9f;
  --rule:#2d3d36; --grid:#22332c; --accent:#7ccfb4; --accent-ink:#0f1915;
  --cD:#86aefc; --cS:#ff9b6a; --cMC:#f283c2; --cATC:#6fd5a9; --cAVC:#dcc66e; --cMR:#b9a4ff; --cP:#e6eee8;
  --aCS:#6c9cf5; --aPS:#f2b23e; --aDWL:#a3acb9; --aPro:#3fcf7d; --aLoss:#ff6b6b; --aop:.3;
  --good:#5fd394; --warn:#f0b54a; --bad:#ff7b7b; --inkR:#ff8a80; --inkB:#8fb4ff; --inkG:#5fd394; --inkO:#ffad5c; --inkP:#c3a3ff; --inkM:#ff86c2; --inkY:#f2d24b; --inkC:#5fd6e8;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px}
.app{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;flex-direction:column;gap:10px}
.brand h1{font-family:var(--f-hand);font-weight:700;font-size:1.7rem;margin:0;letter-spacing:.02em;line-height:1.15;text-wrap:balance}
.brand h1 small{font-size:.65em;font-weight:400;color:var(--muted)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:4px}
.tg{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.tg>span{font-size:.72rem;color:var(--muted);letter-spacing:.06em;margin:0 6px 0 8px}
.tabs .tg+.tg{border-left:1px solid var(--rule);padding-left:4px}
@media (max-width:760px){.tabs{flex-direction:column}.tabs .tg+.tg{border-left:0;padding-left:0;border-top:1px solid var(--rule);padding-top:4px}}
.tabs button{font:inherit;font-size:.88rem;border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:7px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tabs button:focus-visible,.tool button:focus-visible,.side button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;align-items:start}
@media (max-width:960px){.work{grid-template-columns:minmax(0,1fr)}}
.board-wrap{background:var(--board);border:1px solid var(--rule);border-radius:12px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.board-wrap:fullscreen{border-radius:0;justify-content:center}
.board-wrap:fullscreen svg{height:calc(100vh - 60px);width:auto;max-width:100%;margin:0 auto}
.tool{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--surface)}
.tool .grp{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:2px}
.tool button{font:inherit;font-size:.82rem;border:0;background:transparent;color:var(--ink);padding:5px 9px;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.tool button[aria-pressed="true"]{background:var(--board);box-shadow:0 0 0 1px var(--rule);font-weight:600}
.tool .plain{border:1px solid var(--rule);background:var(--board)}
.tool .plain[aria-pressed="true"]{border-color:var(--accent)}
.tool .sp{flex:1}
.sw{width:18px;height:18px;border-radius:50%;border:2px solid var(--board);box-shadow:0 0 0 1px var(--rule);padding:0!important}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.tool .sw.k,.tool .sw.k[aria-pressed="true"]{background:var(--ink)}.tool .sw.r,.tool .sw.r[aria-pressed="true"]{background:var(--inkR)}.tool .sw.b,.tool .sw.b[aria-pressed="true"]{background:var(--inkB)}.tool .sw.g,.tool .sw.g[aria-pressed="true"]{background:var(--inkG)}.tool .sw.o,.tool .sw.o[aria-pressed="true"]{background:var(--inkO)}.tool .sw.p,.tool .sw.p[aria-pressed="true"]{background:var(--inkP)}.tool .sw.m,.tool .sw.m[aria-pressed="true"]{background:var(--inkM)}.tool .sw.y,.tool .sw.y[aria-pressed="true"]{background:var(--inkY)}.tool .sw.c,.tool .sw.c[aria-pressed="true"]{background:var(--inkC)}
svg#board{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
svg#board.pen{cursor:crosshair}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
.card h2{font-size:.75rem;letter-spacing:.1em;color:var(--muted);margin:0 0 8px;font-weight:600}
.sec+.sec{margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule)}
.layers{display:flex;flex-direction:column;gap:5px}
.layers label{display:flex;align-items:center;gap:8px;cursor:pointer;line-height:1.35}
.layers input{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.chipc{width:12px;height:12px;border-radius:3px;flex:none}
.chipl{width:16px;height:0;border-top:3px solid;flex:none}
.chipd{width:9px;height:9px;border-radius:50%;flex:none;margin:0 3.5px}
.sh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 8px;margin-bottom:8px}
.sh h2{margin:0}
.mini{display:flex;gap:4px}
.mini button{font:inherit;font-size:.75rem;border:1px solid var(--rule);background:var(--board);color:var(--ink);padding:2px 8px;border-radius:6px;cursor:pointer}
.mini button:hover{border-color:var(--accent)}
.cv.sel .stroke{stroke-width:5}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chips button{font:inherit;font-size:.82rem;border:1px solid var(--rule);background:var(--board);color:var(--ink);padding:3px 9px;border-radius:6px;cursor:pointer}
.chips button:hover{border-color:var(--accent)}
.chips .swc{width:22px;height:22px;padding:0;border-radius:50%;background:var(--c);border:2px solid var(--board);box-shadow:0 0 0 1px var(--rule)}
.chips .swc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.fl{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.side input[type="text"]{font:inherit;font-size:.9rem;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--board);color:var(--ink);width:100%;min-width:0}
.side input[type="text"]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.axin{display:flex;gap:8px}
.axin label{display:flex;align-items:center;gap:6px;flex:1;min-width:0;font-size:.85rem;color:var(--muted)}
.empty{font-family:var(--f-ui);font-size:15px;fill:var(--muted)}
#board .gd,#board .pt,#board .ptl,#board .cl,#board .ax,#board .axt,#board .tick,#board .br,#board .brt,#board .tag,#board .empty,#board .msg,#board .gridl,#board .axis{pointer-events:none}
.seg{display:flex;flex-wrap:wrap;gap:2px;background:var(--bg);border-radius:8px;padding:2px}
.seg button{flex:1 1 auto;font:inherit;font-size:.85rem;border:0;background:transparent;color:var(--muted);padding:6px 8px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--board);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--rule)}
.ro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;margin:0}
.ro dt{color:var(--muted);font-size:.85rem;line-height:1.35}
.ro dd{margin:0;font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ro .sep{grid-column:1/-1;border-top:1px dashed var(--rule);margin:3px 0}
.ro .em{font-weight:600;color:var(--ink)}
.status{display:inline-block;font-size:.85rem;padding:3px 10px;border-radius:12px;margin-bottom:10px;border:1px solid currentColor;line-height:1.35}
.status.good{color:var(--good)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}.status.neutral{color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.acts button{font:inherit;font-size:.82rem;border:1px solid var(--rule);background:var(--board);color:var(--ink);padding:5px 10px;border-radius:7px;cursor:pointer}
.acts button:hover,.tool .plain:hover{border-color:var(--accent)}
.hint{color:var(--muted);font-size:.85rem;margin:0}
.hint b{color:var(--ink);font-weight:600}
.hint .zh{display:block;margin-top:6px}
/* SVG */
.gridl{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--ink);stroke-width:2;fill:none}
.ax{font-family:var(--f-hand);font-size:16px;fill:var(--ink)}
.ax .num,.tick{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
.axt{font-family:var(--f-hand);font-size:17px;fill:var(--ink);font-weight:700}
.cv .stroke{fill:none;stroke:var(--c);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cv.thin .stroke{stroke-width:2.2}
.cv.dash .stroke{stroke-dasharray:8 6}
.cv .hit{fill:none;stroke:transparent;stroke-width:22;pointer-events:stroke}
.cv[data-drag]{cursor:grab}
.cv[data-drag]:hover .stroke{stroke-width:4.5}
.cv.marker .stroke{stroke-width:1.8;stroke-dasharray:3 5}
.cv.marker:hover .stroke{stroke-width:2.6}
.knob{fill:var(--c);stroke:var(--board);stroke-width:2}
.ghost .stroke{stroke-width:2;stroke-dasharray:6 6;opacity:.55}
.cD{--c:var(--cD)}.cS{--c:var(--cS)}.cMC{--c:var(--cMC)}.cATC{--c:var(--cATC)}.cAVC{--c:var(--cAVC)}.cMR{--c:var(--cMR)}.cP{--c:var(--cP)}
.cl{font-family:var(--f-hand);font-size:19px;font-weight:700;fill:var(--c)}
.cl.sm{font-size:15px;font-weight:400}
.cl.ghost{opacity:.6;font-weight:400}
.ar{stroke:none;fill-opacity:var(--aop);pointer-events:none}
.aCS{fill:var(--aCS)}.aPS{fill:var(--aPS)}.aDWL{fill:var(--aDWL)}.aPro{fill:var(--aPro)}.aLoss{fill:var(--aLoss)}
.tag{font-family:var(--f-hand);font-size:16px;font-weight:700;pointer-events:none;text-anchor:middle}
.tCS{fill:var(--aCS)}.tPS{fill:var(--aPS)}.tDWL{fill:var(--aDWL)}.tPro{fill:var(--aPro)}.tLoss{fill:var(--aLoss)}
.gd{stroke:var(--muted);stroke-width:1.3;stroke-dasharray:4 4;fill:none}
.faint .gd{opacity:.5}
.pt{fill:var(--ink);stroke:var(--board);stroke-width:2}
.pt.hollow{fill:var(--board);stroke:var(--muted);stroke-width:2}
.ptl{font-family:var(--f-hand);font-size:15px;fill:var(--ink)}
.ptl.small{font-size:13px;fill:var(--muted)}
.hd{cursor:grab}
.hd .hhit{fill:transparent}
.hd .hdot{fill:var(--board);stroke:var(--c);stroke-width:2.5}
.hd:hover .hdot{fill:var(--c)}
.br{stroke:var(--ink);stroke-width:1.6}
.brt{font-family:var(--f-hand);font-size:15px;fill:var(--ink);text-anchor:middle}
.mk path{fill:var(--ink)}
.ink{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.ink.k{stroke:var(--ink)}.ink.r{stroke:var(--inkR)}.ink.b{stroke:var(--inkB)}.ink.g{stroke:var(--inkG)}.ink.o{stroke:var(--inkO)}.ink.p{stroke:var(--inkP)}.ink.m{stroke:var(--inkM)}.ink.y{stroke:var(--inkY)}.ink.c{stroke:var(--inkC)}
.sws{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
.tool .sws .sw{width:17px;height:17px;border-radius:50%;flex:none}
.msg{font-family:var(--f-ui);font-size:14px;fill:var(--bad)}
svg.pen .cv[data-drag],svg.pen .hd{cursor:crosshair}
@media (prefers-reduced-motion:no-preference){.tabs button,.tool button{transition:background .15s}}

/* game theory */
.gtitle{font-family:var(--f-hand);font-size:24px;font-weight:700;fill:var(--ink)}
.gplayer{font-family:var(--f-hand);font-size:20px;font-weight:700;fill:var(--c)}
.gstrat{font-family:var(--f-hand);font-size:18px;fill:var(--ink)}
.gstrat.zh{font-size:16px;fill:var(--muted)}
.ggrid{fill:none;stroke:var(--ink);stroke-width:2}
.gnum{font-family:var(--f-num);font-size:40px;fill:var(--c);font-variant-numeric:tabular-nums}
.gcomma{font-family:var(--f-num);font-size:34px;fill:var(--muted)}
.gpay{cursor:pointer}
.gpay:hover .gnum{text-decoration:underline dotted}
.gbr{stroke:var(--c);stroke-width:3.5;stroke-linecap:round}
.gmark{fill:none;stroke:var(--inkR);stroke-width:3}
.gdom{fill:var(--aPro);fill-opacity:.13}
.gdomt{font-family:var(--f-ui);font-size:12px;font-weight:600;fill:var(--good)}
.gne{fill:var(--accent);fill-opacity:.1;stroke:var(--accent);stroke-width:4}
.gnet{font-family:var(--f-ui);font-size:12px;font-weight:600;fill:var(--accent)}
.gnote{font-family:var(--f-ui);font-size:13px;fill:var(--muted)}
.gnote.sm{font-size:12px}
#board .gtitle,#board .gplayer,#board .gstrat,#board .ggrid,#board .gcomma,#board .gbr,#board .gmark,#board .gdom,#board .gdomt,#board .gne,#board .gnet,#board .gnote{pointer-events:none}
.story{margin:0 0 10px;font-size:.88rem;line-height:1.5}
.story .zh,.qa .zh,.ans .zh{display:block;color:var(--muted)}
.qa{border-top:1px dashed var(--rule);padding:8px 0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.qa .q{margin:0;font-size:.88rem;line-height:1.45}
.mini-btn{font:inherit;font-size:.78rem;border:1px solid var(--rule);background:var(--board);color:var(--accent);padding:3px 9px;border-radius:6px;cursor:pointer}
.mini-btn:hover{border-color:var(--accent)}
.ans{background:var(--board);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:6px;padding:6px 10px;font-size:.84rem;display:flex;flex-direction:column;gap:6px;align-self:stretch}
.ans p{margin:0;line-height:1.45}
.payed{border-collapse:collapse;width:100%;font-size:.82rem}
.payed th{font-weight:600;color:var(--muted);padding:3px;text-align:center}
.payed td{padding:3px;text-align:center;white-space:nowrap}
.payed input{width:44px;font:inherit;font-family:var(--f-num);padding:3px 4px;border:1px solid var(--rule);border-radius:5px;background:var(--board);color:var(--ink);text-align:center}
.payed input.pa{color:var(--cD)}.payed input.pb{color:var(--cS);margin-left:3px}
.homelink{align-self:flex-start;font-size:.82rem;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--rule);background:var(--surface);padding:3px 12px;border-radius:999px}
.homelink:hover{border-color:var(--accent)}
</style>
</head>
<body>


<div class="app">
  <a class="homelink" href="index.html">← Home (首頁)</a>
  <header class="top">
    <div class="brand">
      <h1>Micro Econ Board <small>(個經互動畫板)</small></h1>
      <p>Drag the curves; surplus, profit and DWL update live (拖曲線，剩餘、利潤、無謂損失即時重算)</p>
    </div>
    <nav class="tabs" role="tablist" aria-label="Graph templates (圖形模板)">
      <div class="tg"><span>Blank (空白)</span>
        <button role="tab" data-tpl="free">Free Draw (自由作圖)</button>
      </div>
      <div class="tg"><span>Markets &amp; Government (市場與政府)</span>
        <button role="tab" data-tpl="sd">Supply &amp; Demand (供需與剩餘)</button>
        <button role="tab" data-tpl="ctl">Price Ceiling / Floor (價格上限／下限)</button>
        <button role="tab" data-tpl="tax">Tax (國內課稅)</button>
        <button role="tab" data-tpl="ext">Externalities (外部性)</button>
      </div>
      <div class="tg"><span>International Trade (國際貿易)</span>
        <button role="tab" data-tpl="world">World Price (世界價格)</button>
        <button role="tab" data-tpl="tariff">Tariff (關稅)</button>
      </div>
      <div class="tg"><span>Production &amp; Costs (生產與成本)</span>
        <button role="tab" data-tpl="prod">Production (生產函數)</button>
        <button role="tab" data-tpl="tc">Total Cost (總成本)</button>
        <button role="tab" data-tpl="uc">Unit Cost (平均與邊際成本)</button>
      </div>
      <div class="tg"><span>Market Structure (市場結構)</span>
        <button role="tab" data-tpl="comp">Perfect Competition (完全競爭)</button>
        <button role="tab" data-tpl="mono">Monopoly (獨占)</button>
        <button role="tab" data-tpl="natmono">Natural Monopoly (自然獨占)</button>
        <button role="tab" data-tpl="disc">Price Discrimination (差別取價)</button>
        <button role="tab" data-tpl="game">Game Theory (賽局理論)</button>
      </div>
    </nav>
  </header>

  <main class="work">
    <section class="board-wrap" id="boardWrap">
      <div class="tool">
        <div class="grp" role="group" aria-label="Tool (工具)">
          <button id="tDrag" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12M7 1 5 3M7 1l2 2M7 13l-2-2M7 13l2-2M1 7l2-2M1 7l2 2M13 7l-2-2M13 7l-2 2" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>Drag (拖曲線)</button>
          <button id="tPen" aria-pressed="false"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 12l1-3 7-7 2 2-7 7-3 1z" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>Pen (畫筆)</button>
        </div>
        <span class="sws" role="group" aria-label="Pen colors (畫筆顏色)">
        <button class="sw k" data-pc="k" aria-pressed="true" aria-label="Black pen (黑筆)"></button>
        <button class="sw r" data-pc="r" aria-pressed="false" aria-label="Red pen (紅筆)"></button>
        <button class="sw b" data-pc="b" aria-pressed="false" aria-label="Blue pen (藍筆)"></button>
        <button class="sw g" data-pc="g" aria-pressed="false" aria-label="Green pen (綠筆)"></button>
        <button class="sw o" data-pc="o" aria-pressed="false" aria-label="Orange pen (橘筆)"></button>

<script>
(function(){
/* ---------- frames: each panel maps economic units to SVG pixels ---------- */
const VW=640,VH=500;
const FRAMES={

};
const FRM={tc:'tc',prod:'ptop'};
let FR=FRAMES.main;
const X=q=>FR.x+q/FR.qmax*FR.w, Y=p=>FR.y+(1-p/FR.pmax)*FR.h;
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const cp=p=>cl(p,-0.8*FR.pmax,1.8*FR.pmax);
const ok=v=>Number.isFinite(v);
const f1=v=>ok(v)?(Math.round(v*10)/10).toFixed(1):'—';
const fA=v=>ok(v)?Math.round(v).toLocaleString('en-US'):'—';
const fmt=v=>!ok(v)?'—':Math.abs(v)>=1000?fA(v):f1(v);
const copy=o=>JSON.parse(JSON.stringify(o));
const r1=v=>v.toFixed(1);

/* ---------- economics ---------- */
function lf(Ln){const s=(Ln.y2-Ln.y1)/(Ln.x2-Ln.x1),b=Ln.y1-s*Ln.x1;return{s,b,P:q=>b+s*q,Q:p=>(p-b)/s};}
const lin=(s,b)=>({s,b,P:q=>b+s*q,Q:p=>(p-b)/s});
function inter(a,b){if(Math.abs(a.s-b.s)<1e-9)return null;const q=(b.b-a.b)/(a.s-b.s);return{q,p:a.P(q)};}
const same=(a,b)=>{const A=lf(a),B=lf(b);return Math.abs(A.s-B.s)<0.005&&Math.abs(A.b-B.b)<0.3;};
/* keep a dragged line's handles inside the 0–100 box: clip the infinite line to the box, then inset the ends */
function fitLine(L){const dx=L.x2-L.x1,dy=L.y2-L.y1;let t0=-1e4,t1=1e4;
  for(const[p,q]of[[-dx,L.x1],[dx,100-L.x1],[-dy,L.y1],[dy,100-L.y1]]){if(Math.abs(p)<1e-12){if(q<0)return null;continue;}const r=q/p;if(p<0)t0=Math.max(t0,r);else t1=Math.min(t1,r);}
  if(t1-t0<1e-9)return null;const a=[L.x1+t0*dx,L.y1+t0*dy],b=[L.x1+t1*dx,L.y1+t1*dy];if(Math.hypot(b[0]-a[0],b[1]-a[1])<12)return null;
  const k=0.05,A=[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k],B=[b[0]-(b[0]-a[0])*k,b[1]-(b[1]-a[1])*k];
  return A[0]<=B[0]?{x1:A[0],y1:A[1],x2:B[0],y2:B[1]}:{x1:B[0],y1:B[1],x2:A[0],y2:A[1]};}
const AVC=(q,a)=>a-1.2*q+0.012*q*q, MC=(q,a)=>a-2.4*q+0.036*q*q, ATC=(q,a,F)=>AVC(q,a)+F/q;
const TVCf=(q,a)=>a*q-1.2*q*q+0.012*q*q*q;
const TPb=L=>0.6*L*L-0.004*L*L*L, MPb=L=>1.2*L-0.012*L*L, APb=L=>0.6*L-0.004*L*L;
function root(A,Bc,C){const d=Bc*Bc-4*A*C;if(d<0)return NaN;return(-Bc+Math.sqrt(d))/(2*A);}
function minATC(a,F){let best={q:1,p:Infinity};for(let q=1;q<=100;q+=0.25){const v=ATC(q,a,F);if(v<best.p)best={q,p:v};}return best;}
function region(f,g,q0,q1,n=48){if(!(ok(q0)&&ok(q1))||q1-q0<0.05)return null;const up=[],lo=[];
  for(let i=0;i<=n;i++){const q=q0+(q1-q0)*i/n;const a=f(q);let b=g(q);if(b>a)b=a;up.push([q,a]);lo.push([q,b]);}
  return up.concat(lo.reverse());}
function polyArea(P){let s=0;for(let i=0;i<P.length;i++){const[a,b]=P[i],[c,d]=P[(i+1)%P.length];s+=a*d-c*b;}return Math.abs(s)/2;}
function centroid(P){let A=0,cx=0,cy=0;for(let i=0;i<P.length;i++){const[a,b]=P[i],[c,d]=P[(i+1)%P.length];const k=a*d-c*b;A+=k;cx+=(a+c)*k;cy+=(b+d)*k;}
  if(Math.abs(A)<1e-6){const n=P.length;return[P.reduce((s,p)=>s+p[0],0)/n,P.reduce((s,p)=>s+p[1],0)/n];}return[cx/(3*A),cy/(3*A)];}
const tri=(a,b,c)=>[a,b,c];

/* ---------- curve lists, options, scenarios ---------- */
const lD=['D','Demand D (需求)','--cD'],lS=['S','Supply S (供給)','--cS'],lG=['guide','Guide lines (輔助虛線)','--muted'];
const lMC=['MC','Marginal cost MC (邊際成本)','--cMC'],lATC=['ATC','Average total cost ATC (平均總成本)','--cATC'],lAVC=['AVC','Average variable cost AVC (平均變動成本)','--cAVC'],lMR=['MR','Marginal revenue MR (邊際收益)','--cMR'];
const LINES={

  ext:[['D','D = MPB (私人邊際利益)','--cD'],['S','S = MPC (私人邊際成本)','--cS'],['social','MSC / MSB (社會邊際成本／利益)','--cMC'],lG],
  world:[lD,lS,['pw','World price Pw (世界價格)','--cP'],lG],
  tariff:[lD,lS,['pw','World price Pw (世界價格)','--cP'],['pt','Pw + tariff (含關稅價格)','--cP'],lG],
  prod:[['TP','Total product TP (總產量)','--cATC'],['MP','Marginal product MP (邊際產量)','--cMC'],['AP','Average product AP (平均產量)','--cAVC'],['L','Labor marker L (勞動標記線)','--cP'],['tan','Tangent, slope = MP (切線)','--cMC'],['ray','Ray from origin, slope = AP (原點射線)','--cAVC'],['stages','Stages I–III (生產三階段)','--muted'],lG],
  tc:[['TC','Total cost TC (總成本)','--cATC'],['TVC','Total variable cost TVC (總變動成本)','--cAVC'],['TFC','Total fixed cost TFC (總固定成本)','--cMR'],['q','Output marker q (產量標記線)','--cP'],['tan','Tangent, slope = MC (切線)','--cMC'],['ray','Ray from origin, slope = ATC (原點射線)','--cP'],lG],
  uc:[lMC,lATC,lAVC,['AFC','Average fixed cost AFC (平均固定成本)','--cMR'],['q','Output marker q (產量標記線)','--cP'],lG],
  comp:[lMC,lATC,lAVC,['P','Price P = MR = d (價格線)','--cP'],lG],
  mono:[lD,lMR,lMC,lATC,lG],
  natmono:[lD,lMR,['MC','Marginal cost MC (邊際成本)','--cMC'],lATC,lG],
  disc:[lD,lMR,['MC','MC = AC (邊際成本)','--cMC'],lG]
};
LINES.free=[lG];
for(const k in LINES)LINES[k].push(['dots','Points & arrows (標記點與箭頭)','--ink']);
LINES.game=[];
const oCS=['cs','Consumer surplus CS (消費者剩餘)','--aCS'],oPS=['ps','Producer surplus PS (生產者剩餘)','--aPS'],oDWL=['dwl','Deadweight loss DWL (無謂損失)','--aDWL'],oTag=['tag','Area labels (區塊標字)','--ink'];
const OPTS={
  sd:[oCS,oPS,['ghost','Keep original curves (保留原曲線虛線)','--muted'],oTag],
  ctl:[oCS,oPS,oDWL,oTag],
  tax:[oCS,oPS,['rev','Tax revenue (稅收)','--aPro'],oDWL,oTag],
  ext:[oDWL,oTag],
  world:[oCS,oPS,['gain','Gains from trade (貿易利得)','--aPro'],oTag],
  tariff:[oCS,oPS,['rev','Tariff revenue (關稅收入)','--aPro'],oDWL,oTag],
  prod:[],
  tc:[['gap','TFC gap between TC and TVC (TC 與 TVC 差距)','--cMR'],['pts','Key points (關鍵點)','--muted']],
  uc:[['gap','AFC gap between ATC and AVC (ATC 與 AVC 差距)','--cMR'],['pts','Key points (關鍵點)','--muted']],
  comp:[['area','Profit / loss area (利潤／虧損)','--aPro'],['pts','Shutdown & break-even points (停業點、損益兩平點)','--muted'],oTag],
  mono:[['profit','Monopoly profit (獨占利潤)','--aPro'],oCS,oDWL,['qc','Competitive outcome (完全競爭對照點)','--muted'],oTag],
  natmono:[['area','Profit / loss & DWL (利潤／虧損與 DWL)','--aPro'],oCS,oTag],
  disc:[oCS,['profit','Firm profit (廠商利潤)','--aPro'],oDWL,oTag],

  game:[['br','Underline best responses (最佳反應畫底線)','--ink'],['dom','Dominant strategies (優勢策略)','--aPro'],['ne','Nash equilibrium (納許均衡)','--accent'],['marks','My circles (我的圈選)','--inkR']]
};

};

const GAMES=[
 {title:['Pricing Game','手搖飲定價賽局'],A:['Shop A','A 店'],B:['Shop B','B 店'],sa:[['High price','維持高價'],['Low price','降價']],sb:[['High price','維持高價'],['Low price','降價']],
  unit:['NT$10,000 per month','萬元／月'],extra:'pd',pay:[[[12,12],[4,15]],[[15,4],[6,6]]],
  story:['Two bubble tea shops on the same street each decide whether to keep a high price or cut prices. They choose at the same time and cannot see each other’s choice. The numbers are monthly profits.','同一條街上的兩家手搖飲店，各自決定要維持高價還是降價。兩家同時決定，看不到對方的選擇。表中數字是每月利潤。']},
 {title:['Advertising Game','手機廣告賽局'],A:['Brand A','A 品牌'],B:['Brand B','B 品牌'],sa:[['Advertise','打廣告'],['Don’t advertise','不打廣告']],sb:[['Advertise','打廣告'],['Don’t advertise','不打廣告']],

];

const LINE_D={x1:5,y1:90,x2:95,y2:10}, LINE_S={x1:5,y1:10,x2:95,y2:90}, MD={x1:3,y1:93,x2:97,y2:17};

const DEF={};for(const k in BASE)DEF[k]=()=>{const o=Object.assign(BASE[k](),{show:showOf(k),lines:linesOf(k),strokes:[]});if(k==='free')o.show.mins=false;if(k==='game'){o.show.br=false;o.show.dom=false;o.show.ne=false;}return o;};
let G={tpl:'sd',tool:'drag',pen:'k',nums:false,st:{}};
for(const k in DEF)G.st[k]=DEF[k]();
const KEY='econ-board-v2';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.st){for(const k in DEF){const o=s.st[k]||{};G.st[k]=Object.assign(DEF[k](),o);G.st[k].show=Object.assign(showOf(k),o.show||{});G.st[k].lines=Object.assign(linesOf(k),o.lines||{});}
  G.tpl=DEF[s.tpl]?s.tpl:'sd';G.nums=!!s.nums;G.pen=s.pen||'k';}}catch(e){}

const cur=()=>G.st[G.tpl];

/* ---------- drawing helpers ---------- */
const svg=document.getElementById('board');
const ptsStr=P=>P.map(([q,p])=>r1(X(q))+','+r1(Y(cp(p)))).join(' ');
function fpath(f,q0=0,q1=FR.qmax,n=160){let d='';for(let i=0;i<=n;i++){const q=q0+(q1-q0)*i/n;const p=f(q);if(!ok(p))continue;d+=(d?'L':'M')+r1(X(q))+' '+r1(Y(cp(p)));}return d;}
function lineD(f){let qa=0,qb=FR.qmax;const lo=-0.8*FR.pmax,hi=1.8*FR.pmax;if(Math.abs(f.s)>1e-9){const A=(lo-f.b)/f.s,Bq=(hi-f.b)/f.s;qa=Math.max(qa,Math.min(A,Bq));qb=Math.min(qb,Math.max(A,Bq));}
  if(qb<=qa)return'';return`M${r1(X(qa))} ${r1(Y(f.P(qa)))}L${r1(X(qb))} ${r1(Y(f.P(qb)))}`;}
const frA=fr=>fr?` data-fr="${fr}"`:'';
function curve(d,cls,drag,key,fr){return`<g class="cv ${cls}"${drag?` data-drag="${drag}" data-key="${key}"`:''}${frA(fr)}><path class="hit" d="${d}"/><path class="stroke" d="${d}"/></g>`;}

  if(!last)return'';const[q,p]=last;let x=X(q)+8,a='start';if(x>FR.x+FR.w-30){x=X(q)-10;a='end';}

  if(showTag&&tag){const pxA=polyArea(P)*(FR.w/FR.qmax)*(FR.h/FR.pmax);if(pxA>900){let[cq,cpp]=centroid(P);cq=cl(cq,3,FR.qmax-3);cpp=cl(cpp,0.03*FR.pmax,0.97*FR.pmax);lay.tags+=`<text class="tag ${tagCls}" x="${r1(X(cq))}" y="${r1(Y(cpp)+6)}">${tag}</text>`;}}}
function bracket(q1,q2,p,text,below){const y=Y(p)+(below?20:-20);const a=cl(Math.min(q1,q2),0,FR.qmax),b=cl(Math.max(q1,q2),0,FR.qmax);if(!(b-a>1))return'';

  return`<line class="br" x1="${r1(x)}" y1="${r1(y1+3)}" x2="${r1(x)}" y2="${r1(y2-3)}" marker-start="url(#ar)" marker-end="url(#ar)"/><text class="brt" x="${r1(x+6)}" y="${r1((y1+y2)/2+5)}" style="text-anchor:start">${text}</text>`;}
const lnOf=cls=>cls.split(' ').filter(c=>c.startsWith('ln-')).join(' ');
function hl(p,kind,key,cls,label,below,axLabel,fr){return{c:`<g class="cv ${cls}" data-drag="${kind}" data-key="${key}"${frA(fr)}><path class="hit" d="M${FR.x} ${r1(Y(p))}H${FR.x+FR.w}"/><path class="stroke" d="M${FR.x} ${r1(Y(p))}H${FR.x+FR.w}" style="stroke-width:2.6"/></g>`,
  t:`<text class="cl ${cls}" x="${FR.x+FR.w-6}" y="${r1(Y(p)+(below?20:-8))}" text-anchor="end" style="font-size:16px">${label}</text>`+(axLabel?`<g class="${lnOf(cls)}">${axY(p,axLabel)}</g>`:'')};}
function vl(q,key,cls,fr){const x=r1(X(q));return`<g class="cv marker ${cls}" data-drag="vline" data-key="${key}"${frA(fr)}><path class="hit" d="M${x} ${FR.y}V${FR.y+FR.h}"/><path class="stroke" d="M${x} ${FR.y}V${FR.y+FR.h}"/><circle class="knob" cx="${x}" cy="${FR.y+7}" r="6"/></g>`;}
function axes(yt,xt){let s='';
  for(let v=10;v<=FR.qmax;v+=10){const x=r1(X(v));s+=`<line class="gridl" x1="${x}" y1="${FR.y}" x2="${x}" y2="${FR.y+FR.h}"/>`;}

  if(G.nums){for(let v=FR.tq;v<=FR.qmax;v+=FR.tq)s+=`<text class="tick" x="${r1(X(v))}" y="${FR.y+FR.h+46}" text-anchor="middle">${v}</text>`;
    for(let v=FR.tp;v<=FR.pmax;v+=FR.tp)s+=`<text class="tick" x="${FR.x-46}" y="${r1(Y(v)+4)}" text-anchor="end">${v>=1000?v.toLocaleString('en-US'):v}</text>`;}
  s+=`<path class="axis" d="M${FR.x} ${FR.y+FR.h}H${FR.x+FR.w+12}" marker-end="url(#ar)"/><path class="axis" d="M${FR.x} ${FR.y+FR.h}V${FR.y-10}" marker-end="url(#ar)"/>`;

  lay.tags+=labelAt(D.P,ld,'cD ln-D')+labelAt(S.P,ls,'cS ln-S');
  lay.handles+=handle(st.D.x1,st.D.y1,'D:1','cD ln-D')+handle(st.D.x2,st.D.y2,'D:2','cD ln-D')+handle(st.S.x1,st.S.y1,'S:1','cS ln-S')+handle(st.S.x2,st.S.y2,'S:2','cS ln-S');

function fEval(o){if(o.type==='line'){if(Math.abs(o.x2-o.x1)<1e-6)return{vert:true,q:o.x1,p0:Math.min(o.y1,o.y2),p1:Math.max(o.y1,o.y2)};

/* ---------- game theory ---------- */
function gAnalyze(pay){

  const bestB=[0,1].map(r=>{const m=Math.max(pay[r][0][1],pay[r][1][1]);return[0,1].filter(c=>pay[r][c][1]===m);});
  const domA=[0,1].find(r=>[0,1].every(c=>pay[r][c][0]>pay[1-r][c][0]));

  const cmpB=[0,1].map(r=>[`If ${A[0]} chooses “${sa[r][0]}”: ${sb[0][0]} → ${gn(pay[r][0][1])}, ${sb[1][0]} → ${gn(pay[r][1][1])}`,`若${A[1]}選「${sa[r][1]}」：${sb[0][1]} ${gn(pay[r][0][1])}、${sb[1][1]} ${gn(pay[r][1][1])}`]);
  out.push({q:[`Does ${A[0]} have a dominant strategy? If so, which one?`,`${A[1]}有沒有優勢策略？如果有，是哪一個？`],
    a:[a.domA!==undefined?[`Yes: “${sa[a.domA][0]}” is better for ${A[0]} whatever ${B[0]} does.`,`有：不論${B[1]}怎麼選，${A[1]}選「${sa[a.domA][1]}」都比較好。`]:[`No: ${A[0]}'s best choice depends on what ${B[0]} does.`,`沒有：${A[1]}的最佳選擇要看${B[1]}怎麼選。`]].concat(cmpA)});
  out.push({q:[`Does ${B[0]} have a dominant strategy? If so, which one?`,`${B[1]}有沒有優勢策略？如果有，是哪一個？`],
    a:[a.domB!==undefined?[`Yes: “${sb[a.domB][0]}” is better for ${B[0]} whatever ${A[0]} does.`,`有：不論${A[1]}怎麼選，${B[1]}選「${sb[a.domB][1]}」都比較好。`]:[`No: ${B[0]}'s best choice depends on what ${A[0]} does.`,`沒有：${B[1]}的最佳選擇要看${A[1]}怎麼選。`]].concat(cmpB)});
  let neA;

  else{neA=a.ne.map(([r,c])=>[`(${sa[r][0]}, ${sb[c][0]}) with payoffs (${gn(pay[r][c][0])}, ${gn(pay[r][c][1])}).`,`（${sa[r][1]}，${sb[c][1]}），報酬為（${gn(pay[r][c][0])}，${gn(pay[r][c][1])}）。`]);

    if(!ans)ans=[[`With these payoffs the Nash equilibrium already gives the best result for both, so this is not a prisoners' dilemma.`,`在目前的數字下，納許均衡已經是對雙方都好的結果，不構成囚犯困境。`]];
    out.push({q:[`Both would earn more at (${sa[0][0]}, ${sb[0][0]}). Why don’t they end up there?`,`雙方都「${sa[0][1]}」時利潤比較高，為什麼結果不會停在那裡？`],a:ans});}

  const nm=(i,arr)=>i===undefined?'None (沒有)':`${arr[i][0]} (${arr[i][1]})`;
  rows.push(['Shown answers follow the checkboxes (數值依勾選顯示)','']);
  rows.push(['-']);
  rows.push([`${g.A[0]}: dominant strategy (優勢策略)`,st.show.dom?nm(an.domA,g.sa):'hidden (隱藏)']);
  rows.push([`${g.B[0]}: dominant strategy (優勢策略)`,st.show.dom?nm(an.domB,g.sb):'hidden (隱藏)']);
  rows.push(['Nash equilibrium (納許均衡)',st.show.ne?(an.ne.length?an.ne.map(([r,c])=>`(${g.sa[r][1]}, ${g.sb[c][1]})`).join(' / '):'None (沒有)'):'hidden (隱藏)','em']);
  if(st.show.ne&&an.ne.length)rows.push(['Payoffs at equilibrium (均衡報酬)',an.ne.map(([r,c])=>`(${gn(pay[r][c][0])}, ${gn(pay[r][c][1])})`).join(' / ')]);
  return{rows:rows.filter(r=>r[0]!=='-'||true).map(r=>r[0]==='-'?'-':r),status:null,noAxes:true};
};
function renderQA(){const el=document.getElementById('qa');if(!el||G.tpl!=='game')return;const st=cur(),g=GAMES[st.prob],res=gAnswers(g,st.pay[st.prob]);
  const esc2=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  el.innerHTML=`<p class="story">${esc2(g.story[0])}<span class="zh">${esc2(g.story[1])}</span></p>`+res.list.map((it,i)=>{const open=!!st.open[st.prob+'-'+i];
    return`<div class="qa"><p class="q"><b>Q${i+1}.</b> ${esc2(it.q[0])}<span class="zh">${esc2(it.q[1])}</span></p><button class="mini-btn" data-reveal="${i}">${open?'Hide answer (隱藏答案)':'Show answer (顯示答案)'}</button>`+
      (open?`<div class="ans">${it.a.map(l=>`<p>${esc2(l[0])}<span class="zh">${esc2(l[1])}</span></p>`).join('')}</div>`:'')+'</div>';}).join('');}

  free:['Pick a tool, then drag on the board. <b>Line:</b> drag from start to end; nearly flat or upright lines snap straight. <b>U / MC curve:</b> press at the lowest point and drag up to one side. Lines made with these tools get intersections and dashed lines by themselves. <b>Point:</b> click anywhere to add a lettered point with dashed lines to both axes; near a spot where pen strokes or lines cross, it snaps onto the crossing. Click a point again to remove it.','選好工具後在畫布上拖曳。<b>直線：</b>從起點拖到終點，接近水平或垂直時會自動拉直。<b>U 形、勾形：</b>在最低點按下，往一側斜上方拖。用這些工具畫的線會自動標出交點和虛線。<b>標點：</b>在任何位置點一下，就會依序產生 A、B、C… 的點，並畫虛線到兩軸；點在畫筆線條或直線交叉處附近時，會自動對準交叉點。再點同一個點一次就會刪除。'],

  ctl:['<b>Drag the black horizontal line</b> to set the controlled price. A ceiling binds only below P*, a floor only above P*.','<b>上下拖黑色水平線</b>調整管制價格。上限低於均衡價、下限高於均衡價才有效，圖上標出短缺或過剩與 DWL。'],

  world:['<b>Drag the world price line.</b> Below P* the country imports; above P* it exports. The green triangle is the gains from trade.','<b>上下拖世界價格線</b>：低於國內均衡價是進口國，高於是出口國。綠色三角形是貿易利得。'],

  prod:['<b>Drag the dotted marker</b> to change labor L. <b>Drag TP, MP or AP</b> to scale the technology. Turn on the tangent (slope = MP) and the ray (slope = AP) to connect the two panels.','<b>左右拖點狀標記線</b>改變勞動量 L；<b>拖 TP、MP 或 AP</b> 可調整技術水準。切線斜率就是 MP，原點射線斜率就是 AP，可以用來說明上下兩圖的關係。'],
  tc:['<b>Drag the marker</b> to change q. <b>Drag TFC</b> to change fixed cost; <b>drag TC or TVC</b> to change variable cost. The tangent slope is MC and the ray slope is ATC.','<b>左右拖標記線</b>改變產量 q。<b>拖 TFC</b> 改固定成本，<b>拖 TC 或 TVC</b> 改變動成本。切線斜率就是 MC，原點射線斜率就是 ATC；這張圖和 Unit Cost 圖的參數會同步。'],

  disc:['Compare a <b>single price</b> with <b>perfect price discrimination</b>. The staircase shows each buyer paying their own maximum price.','切換<b>單一價格</b>與<b>完全差別取價</b>比較。階梯線表示每位消費者都付自己的最高願付價格，原本的 CS 與 DWL 全部變成廠商利潤。']

const ctrl=document.getElementById('ctrl'),ro=document.getElementById('ro'),hint=document.getElementById('hint');
function buildCtrl(){const st=cur();let h='';
  if(KINDS[G.tpl])h+=`<div class="sec"><h2>SCENARIO (情境)</h2><div class="seg" role="group" aria-label="Scenario (情境)">`+KINDS[G.tpl].map(([k,t])=>`<button data-kind="${k}" aria-pressed="${st.kind===k}">${t}</button>`).join('')+'</div></div>';
  if(G.tpl==='free'){const o=st.objs.find(x=>x.id===st.sel);
    h+=`<div class="sec"><h2>DRAW TOOLS (作圖工具)</h2><div class="seg" role="group" aria-label="Draw tool (作圖工具)">${FT.map(([k,t])=>`<button data-ftool="${k}" aria-pressed="${st.tool===k}">${t}</button>`).join('')}</div></div>`;
    h+='<div class="sec"><h2>SELECTED LINE (選取的線)</h2>'+(o?`<label class="fl">Name (名稱)<input type="text" id="flabel" data-fl="1" value="${escA(o.label)}" maxlength="16"></label><div class="chips">${QL.map(l=>`<button data-ql="${escA(l)}">${escH(l)}</button>`).join('')}</div><div class="chips">${PAL.map(c=>`<button class="swc ${c}" data-fc="${c}" aria-pressed="${o.color===c}" aria-label="Color (顏色)"></button>`).join('')}</div><div class="acts"><button data-fdel="1">Delete line (刪除這條線)</button></div>`
      :'<p class="hint">Choose “Select / move”, then click a line to rename, recolor or delete it.<span class="zh">用「選取移動」點一條線，就能改名稱、顏色或刪除。</span></p>')+'</div>';
    h+=`<div class="sec"><h2>AXIS NAMES (座標軸名稱)</h2><div class="axin"><label>Y <input type="text" id="fy" data-ax="yl" value="${escA(st.yl)}" maxlength="14"></label><label>X <input type="text" id="fx" data-ax="xl" value="${escA(st.xl)}" maxlength="14"></label></div></div>`;}
  const allBtns=g=>`<div class="mini"><button data-all="${g}" data-val="1">Select all (全選)</button><button data-all="${g}" data-val="0">Clear all (取消全選)</button></div>`;
  if(G.tpl==='game'){const gp=st.pay[st.prob],g=GAMES[st.prob];
    h+=`<div class="sec"><h2>PROBLEM (題目)</h2><div class="seg" role="group" aria-label="Problem (題目)">${GAMES.map((x,i)=>`<button data-prob="${i}" aria-pressed="${st.prob===i}">${i+1}. ${x.title[0]} (${x.title[1]})</button>`).join('')}</div></div><div class="sec"><h2>QUESTIONS (問題)</h2><div id="qa"></div></div>`;
    h+=`<div class="sec"><h2>EDIT PAYOFFS (修改報酬)</h2><table class="payed"><tr><th></th>${g.sb.map(x=>`<th>${x[1]}</th>`).join('')}</tr>${[0,1].map(r=>`<tr><th>${g.sa[r][1]}</th>${[0,1].map(c=>`<td>${[0,1].map(p=>`<input type="number" step="1" id="pay-${st.prob}-${r}-${c}-${p}" data-payin="${r},${c},${p}" class="${p?'pb':'pa'}" value="${gp[r][c][p]}" aria-label="${p?g.B[0]:g.A[0]} payoff">`).join('')}</td>`).join('')}</tr>`).join('')}</table><p class="hint">Blue = ${g.A[0]}, orange = ${g.B[0]}<span class="zh">藍色是${g.A[1]}、橘色是${g.B[1]}的報酬</span></p></div>`;}
  if(LINES[G.tpl].length)h+='<div class="sec"><div class="sh"><h2>CURVES (曲線)</h2>'+allBtns('lines')+'</div><div class="layers">'+LINES[G.tpl].map(([k,t,c])=>`<label><input type="checkbox" id="ln-${G.tpl}-${k}" data-line="${k}"${st.lines[k]!==false?' checked':''}><span class="${k==='dots'?'chipd':'chipl'}" style="${k==='dots'?'background':'border-color'}:var(${c})"></span>${t}</label>`).join('')+'</div></div>';
  if(OPTS[G.tpl].length)h+='<div class="sec"><div class="sh"><h2>SHADING &amp; MARKS (區塊與標記)</h2>'+allBtns('show')+'</div><div class="layers">'+OPTS[G.tpl].map(([k,t,c])=>`<label><input type="checkbox" id="op-${G.tpl}-${k}" data-show="${k}"${st.show[k]?' checked':''}><span class="chipc" style="background:var(${c})"></span>${t}</label>`).join('')+'</div></div>';
  if(G.tpl==='free')h+='<div class="acts"><button data-act="fclear">Clear canvas (清空畫布)</button>'+((st.pts||[]).length?'<button data-act="fpclear">Clear points (清除標點)</button>':'')+(st.trash?'<button data-act="fundo">Undo clear (復原清空)</button>':'')+'</div>';
  else h+='<div class="acts">'+(G.tpl==='sd'?'<button data-act="base">Set as new baseline (以目前為新基準)</button>':'')+'<button data-act="reset">Reset this graph (重設此圖)</button></div>';
  ctrl.innerHTML=h;hint.innerHTML=HINTS[G.tpl][0]+'<span class="zh">'+HINTS[G.tpl][1]+'</span>';
  document.querySelectorAll('.tabs button[data-tpl]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tpl===G.tpl));
}
ctrl.addEventListener('change',e=>{const st=cur(),d=e.target.dataset;if(d.show)st.show[d.show]=e.target.checked;else if(d.line)st.lines[d.line]=e.target.checked;else return;render();save();});
ctrl.addEventListener('input',e=>{const st=cur(),d=e.target.dataset;
  if(d.payin){const v=parseFloat(e.target.value);if(Number.isFinite(v)){const[r,c,p]=d.payin.split(',').map(Number);st.pay[st.prob][r][c][p]=v;render();save();}return;}
  if(d.fl){const o=st.objs.find(x=>x.id===st.sel);if(o){o.label=e.target.value;render();save();}}
  else if(d.ax){st[d.ax]=e.target.value;render();save();}});
document.addEventListener('keydown',e=>{if(G.tpl!=='free'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const st=cur();
  if((e.key==='Delete'||e.key==='Backspace')&&st.sel!=null){st.objs=st.objs.filter(x=>x.id!==st.sel);st.sel=null;e.preventDefault();buildCtrl();render();save();}});
ctrl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const st=cur();
  if(b.dataset.kind){st.kind=b.dataset.kind;if(G.tpl==='ctl')st.price=st.kind==='ceiling'?35:65;buildCtrl();}
  if(b.dataset.act==='reset'){G.st[G.tpl]=DEF[G.tpl]();buildCtrl();}
  if(b.dataset.act==='base')st.base={D:copy(st.D),S:copy(st.S)};
  if(b.dataset.ftool){st.tool=b.dataset.ftool;if(G.tool==='pen')setTool('drag');buildCtrl();}
  if(b.dataset.prob){st.prob=+b.dataset.prob;buildCtrl();}
  if(b.dataset.reveal){const k=st.prob+'-'+b.dataset.reveal;st.open[k]=!st.open[k];}
  if(b.dataset.ql||b.dataset.fc||b.dataset.fdel){const o=st.objs.find(x=>x.id===st.sel);if(o){
    if(b.dataset.ql){o.label=b.dataset.ql;if(FCOL[o.label])o.color=FCOL[o.label];}
    if(b.dataset.fc)o.color=b.dataset.fc;
    if(b.dataset.fdel){st.objs=st.objs.filter(x=>x!==o);st.sel=null;}}buildCtrl();}
  if(b.dataset.act==='fpclear'){st.pts=[];buildCtrl();}
  if(b.dataset.act==='fclear'){if(st.objs.length||st.strokes.length||(st.pts||[]).length)st.trash={objs:st.objs,strokes:st.strokes,pts:st.pts||[]};st.objs=[];st.strokes=[];st.pts=[];st.sel=null;buildCtrl();}
  if(b.dataset.act==='fundo'&&st.trash){st.objs=st.trash.objs.concat(st.objs);st.strokes=st.trash.strokes.concat(st.strokes);st.pts=(st.trash.pts||[]).concat(st.pts||[]);st.trash=null;buildCtrl();}
  if(b.dataset.all){const v=b.dataset.val==='1',obj=b.dataset.all==='lines'?st.lines:st.show,list=b.dataset.all==='lines'?LINES[G.tpl]:OPTS[G.tpl];for(const o of list)obj[o[0]]=v;buildCtrl();}
  render();save();});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tpl]');if(!b)return;
  const prev=G.tpl,next=b.dataset.tpl,pair=['tc','uc'];
  if(pair.includes(prev)&&pair.includes(next)&&prev!==next){for(const k of['a','F','q'])G.st[next][k]=G.st[prev][k];}
  G.tpl=next;buildCtrl();render();save();});

/* ---------- render ---------- */
function render(){const st=cur();const lay={areas:'',ghost:'',curves:'',guides:'',points:'',tags:'',handles:'',extra:''};
  const fr0=FRM[G.tpl]||'main';FR=FRAMES[fr0];
  const out=TPL[G.tpl](st,lay);
  svg.classList.toggle('pen',G.tool==='pen'||(G.tpl==='free'&&st.tool!=='select'));
  const axList=out.axes||[{fr:fr0,yt:out.yt,xt:out.xt}];
  let ax='';if(!out.noAxes)for(const a of axList){FR=FRAMES[a.fr];ax+=axes(a.yt,a.xt);}
  const A=FRAMES[axList[0].fr],Bf=out.clipB?FRAMES[out.clipB]:null;
  const hid=LINES[G.tpl].map(x=>x[0]).filter(id=>st.lines[id]===false).map(id=>'#board .ln-'+id).join(',');
  const ink=(st.strokes||[]).map(s=>`<path class="ink ${s.c}" d="${s.p.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join('')}"/>`).join('');
  svg.innerHTML=`<defs><clipPath id="cpA"><rect x="${A.x}" y="${A.y}" width="${A.w}" height="${A.h}"/></clipPath>`+(Bf?`<clipPath id="cpB"><rect x="${Bf.x}" y="${Bf.y}" width="${Bf.w}" height="${Bf.h}"/></clipPath>`:'')+
  `<marker id="ar" class="mk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>`+
  `<style>${hid?hid+'{display:none}':''}</style><rect x="0" y="0" width="${VW}" height="${VH}" fill="var(--board)"/>`+ax+
  `<g clip-path="url(#cpA)">${lay.areas}${lay.ghost}${lay.curves}</g>`+(Bf?`<g clip-path="url(#cpB)">${lay.extra}</g>`:'')+`${lay.guides}${lay.tags}${lay.handles}${ink}<g class="ln-dots">${lay.points}</g>`;
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let h='';if(out.status)h+=`<span class="status ${out.status.c}">${esc(out.status.t)}</span>`;
  h+='<dl class="ro">'+out.rows.map(r=>r==='-'?'<div class="sep"></div>':`<dt>${esc(r[0])}</dt><dd class="${r[2]||''}">${esc(r[1])}</dd>`).join('')+'</dl>';
  ro.innerHTML=h;
  renderQA();
}

/* ---------- pointer ---------- */
let drag=null,stroke=null;
function toSvg(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?p.matrixTransform(m.inverse()):{x:0,y:0};}
const toEcon=(s,f)=>({q:(s.x-f.x)/f.w*f.qmax,p:(1-(s.y-f.y)/f.h)*f.pmax});
svg.addEventListener('pointerdown',e=>{const s=toSvg(e),st=cur();
  if(G.tool==='pen'){stroke={c:G.pen,p:[[Math.round(s.x),Math.round(s.y)]]};st.strokes.push(stroke);svg.setPointerCapture(e.pointerId);e.preventDefault();render();return;}
  if(G.tpl==='free'){freeDown(e,s);return;}
  if(G.tpl==='game'){const t=e.target.closest('[data-pay]');if(t){const k=st.prob+':'+t.dataset.pay;st.marks[k]=!st.marks[k];if(st.marks[k])st.show.marks=true;render();save();}return;}
  const t=e.target.closest('[data-drag]');if(!t)return;const kind=t.dataset.drag,key=t.dataset.key;
  const fr=FRAMES[t.dataset.fr]||FRAMES[FRM[G.tpl]||'main'];
  let orig=null;if(kind==='line')orig=copy(st[key]);else if(kind==='end')orig=copy(st[key.split(':')[0]]);else if(kind==='shift')orig=st.a;else if(kind==='off')orig=st[key.split(':')[0]];
  drag={kind,key,orig,fr,start:toEcon(s,fr)};svg.setPointerCapture(e.pointerId);e.preventDefault();
});
function freeDown(e,s){const st=cur(),fr=FRAMES.main,raw=toEcon(s,fr),pt={q:cl(raw.q,0,100),p:cl(raw.p,0,100)};
  if(st.tool==='point'){e.preventDefault();if(raw.q<-3||raw.q>103||raw.p<-3||raw.p>103)return;placePoint(st,pt);buildCtrl();render();save();return;}
  if(st.tool==='select'){const t=e.target.closest('[data-fo]');
    if(!t){if(st.sel!=null){st.sel=null;buildCtrl();render();}return;}
    const id=+t.dataset.fo,o=st.objs.find(x=>x.id===id);if(!o)return;
    if(st.sel!==id){st.sel=id;buildCtrl();}
    drag={kind:'free',part:t.dataset.part,id,orig:copy(o),fr,start:pt};svg.setPointerCapture(e.pointerId);e.preventDefault();render();return;}
  const type=st.tool,label=autoLabel(st,type),o={id:st.nid++,type,label,color:FCOL[label]||PAL[st.objs.length%PAL.length]};
  if(type==='line')Object.assign(o,{x1:pt.q,y1:pt.p,x2:pt.q,y2:pt.p});else Object.assign(o,{h:pt.q,k:pt.p,a:type==='check'?0.03:0.02});
  st.draft=o;drag={kind:'fdraw',fr,start:pt};svg.setPointerCapture(e.pointerId);e.preventDefault();render();}
svg.addEventListener('pointermove',e=>{
  if(stroke){const s=toSvg(e);const last=stroke.p[stroke.p.length-1];if(Math.hypot(s.x-last[0],s.y-last[1])>1.5){stroke.p.push([Math.round(s.x),Math.round(s.y)]);render();}return;}
  if(!drag)return;const d=drag,pt=toEcon(toSvg(e),d.fr),st=cur(),dq=pt.q-d.start.q,dp=pt.p-d.start.p;
  if(d.kind==='line'){const o=d.orig;const tq=cl(dq,-80,80),tp=cl(dp,-80,80);
    st[d.key]=fitLine({x1:o.x1+tq,y1:o.y1+tp,x2:o.x2+tq,y2:o.y2+tp})||st[d.key];}
  else if(d.kind==='end'){const[k,i]=d.key.split(':'),o=i==='1'?'2':'1',n=copy(d.orig);n['x'+i]=cl(pt.q,0,100);n['y'+i]=cl(pt.p,0,100);
    if(Math.abs(n['x'+i]-n['x'+o])>=4){const s=(n.y2-n.y1)/(n.x2-n.x1);if((k==='D'&&s<-0.05)||(k==='S'&&s>0.05))st[k]=n;}}
  else if(d.kind==='hline')st[d.key]=cl(pt.p,1,99);
  else if(d.kind==='shift')st.a=cl(d.orig+dp,30,95);
  else if(d.kind==='atc'){const q=cl(pt.q,5,100);st.F=cl((pt.p-AVC(q,st.a))*q,0,4000);}
  else if(d.kind==='afc'){const q=cl(pt.q,3,100);st.F=cl(pt.p*q,0,4000);}
  else if(d.kind==='tline')st.t=cl(pt.p-st.pw,0,90);
  else if(d.kind==='off'){const[f,s]=d.key.split(':');st[f]=cl(d.orig+Number(s)*dp,0,80);}
  else if(d.kind==='nmatc'){const q=cl(pt.q,3,100);st.F=cl((pt.p-st.c)*q,0,5000);}
  else if(d.kind==='vline')st[d.key]=cl(pt.q,2,d.fr.qmax-2);
  else if(d.kind==='scale'){const L=cl(pt.q,5,108),base=d.key==='TP'?TPb(L):d.key==='MP'?MPb(L):APb(L);if(base>(d.key==='TP'?150:3))st.s=cl(pt.p/base,0.4,1.15);}
  else if(d.kind==='tfc')st.F=cl(pt.p,0,4000);
  else if(d.kind==='fdraw'){const o=st.draft,q=cl(pt.q,0,100),p=cl(pt.p,0,100);if(o){if(o.type==='line')snapEnd(o,'2',q,p);else{const dx=q-o.h;if(Math.abs(dx)>2&&p>o.k+1)o.a=cl((p-o.k)/(dx*dx)/(dx<0&&o.type==='check'?0.3:1),0.002,2);}}}
  else if(d.kind==='free'){const o=st.objs.find(x=>x.id===d.id),O=d.orig,q=cl(pt.q,0,100),p=cl(pt.p,0,100);if(o){
    if(d.part==='body'){if(o.type==='line'){const tq=cl(dq,-Math.min(O.x1,O.x2),100-Math.max(O.x1,O.x2)),tp=cl(dp,-Math.min(O.y1,O.y2),100-Math.max(O.y1,O.y2));Object.assign(o,{x1:O.x1+tq,x2:O.x2+tq,y1:O.y1+tp,y2:O.y2+tp});}else{o.h=cl(O.h+dq,0,100);o.k=cl(O.k+dp,0,100);}}
    else if(d.part==='p1'||d.part==='p2')snapEnd(o,d.part[1],q,p);
    else if(d.part==='v'){o.h=q;o.k=p;}
    else if(d.part==='arm'){const dx=q-o.h;if(Math.abs(dx)>2&&p>o.k+1)o.a=cl((p-o.k)/(dx*dx)/(dx<0&&o.type==='check'?0.3:1),0.002,2);}}}
  else if(d.kind==='tvc'||d.kind==='tcd'){const q=cl(pt.q,8,100);st.a=cl((pt.p-(d.kind==='tcd'?st.F:0)-(-1.2*q*q+0.012*q*q*q))/q,30,95);}
  render();
});
function end(){if(drag&&drag.kind==='fdraw'){const st=cur(),o=st.draft;st.draft=null;
    if(o&&(o.type!=='line'||Math.hypot(o.x2-o.x1,o.y2-o.y1)>2)){st.objs.push(o);st.sel=o.id;}buildCtrl();render();}
  if(drag||stroke)save();drag=null;stroke=null;}
svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);

/* ---------- toolbar ---------- */
const tDrag=document.getElementById('tDrag'),tPen=document.getElementById('tPen'),tNums=document.getElementById('tNums');
function setTool(t){G.tool=t;tDrag.setAttribute('aria-pressed',t==='drag');tPen.setAttribute('aria-pressed',t==='pen');svg.classList.toggle('pen',t==='pen');}
tDrag.onclick=()=>setTool('drag');tPen.onclick=()=>setTool('pen');
document.querySelectorAll('[data-pc]').forEach(b=>b.onclick=()=>{G.pen=b.dataset.pc;document.querySelectorAll('[data-pc]').forEach(x=>x.setAttribute('aria-pressed',x===b));setTool('pen');save();});
document.getElementById('tUndo').onclick=()=>{cur().strokes.pop();render();save();};
document.getElementById('tClear').onclick=()=>{cur().strokes=[];render();save();};
tNums.onclick=()=>{G.nums=!G.nums;tNums.setAttribute('aria-pressed',G.nums);render();save();};
document.getElementById('tFull').onclick=()=>{const w=document.getElementById('boardWrap');try{if(document.fullscreenElement)document.exitFullscreen();else{const r=w.requestFullscreen&&w.requestFullscreen();if(r&&r.catch)r.catch(()=>{});}}catch(e){}};

document.querySelectorAll('[data-pc]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.pc===G.pen));
tNums.setAttribute('aria-pressed',G.nums);
buildCtrl();render();
})();
</script>
