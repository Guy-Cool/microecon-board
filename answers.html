lso apply.","財富（實質餘額）效果：物價下降提高財富的購買力，消費增加。另外還有利率效果與匯率效果。"]},{"k":"k","q":["Which of the following would shift the aggregate demand curve to the right?","下列何者會使總合需求曲線右移？"],"o":[["A decrease in the price level","物價水準下降"],["An increase in government spending","政府支出增加"],["A decrease in business confidence","企業信心下降"],["An appreciation of the domestic currency","本國貨幣升值"],["An increase in personal income taxes","個人所得稅增加"]],"a":"B","e":["G is a component of AD. A change in the price level is a movement along AD, and the other choices reduce AD.","G 是 AD 的組成項目。物價變動是沿著 AD 移動，其他選項都會使 AD 減少。"]},{"k":"c","q":["If the marginal propensity to consume is 0.8, the spending multiplier is","如果邊際消費傾向為 0.8，支出乘數是"],"o":[["0.2","0.2"],["1.25","1.25"],["4","4"],["5","5"],["8","8"]],"a":"D","e":["Spending multiplier = 1 ÷ (1 − MPC) = 1 ÷ 0.2 = 5.","支出乘數 = 1 ÷（1 − MPC）= 1 ÷ 0.2 = 5。"]},{"k":"c","q":["The MPS is 0.25. If government spending increases by $40 billion, the maximum increase in real GDP is","MPS 為 0.25。若政府支出增加 400 億美元，實質 GDP 最多增加"],"o":[["$10 billion","100 億美元"],["$40 billion","400 億美元"],["$120 billion","1,200 億美元"],["$30 billion","300 億美元"],["$160 billion","1,600 億美元"]],"a":"E","e":["Multiplier = 1 ÷ MPS = 4, so ΔGDP = 4 × $40 billion = $160 billion.","乘數 = 1 ÷ MPS = 4，ΔGDP = 4 × 400 億 = 1,600 億美元。"]},{"k":"c","q":["The MPC is 0.75. If taxes are cut by $20 billion, the maximum increase in real GDP is","MPC 為 0.75。若減稅 200 億美元，實質 GDP 最多增加"],"o":[["$80 billion","800 億美元"],["$20 billion","200 億美元"],["$26.7 billion","267 億美元"],["$15 billion","150 億美元"],["$60 billion","600 億美元"]],"a":"E","e":["Tax multiplier = −MPC ÷ MPS = −0.75 ÷ 0.25 = −3. A $20 billion tax cut raises GDP by 3 × 20 = $60 billion.","租稅乘數 = −MPC ÷ MPS = −0.75 ÷ 0.25 = −3。減稅 200 億使 GDP 增加 3 × 200 億 = 600 億美元。"]},{"k":"c","q":["Government spending and taxes both increase by $50 billion. According to the balanced-budget multiplier, real GDP will","政府支出與稅收同時增加 500 億美元。根據平衡預算乘數，實質 GDP 會"],"o":[["increase by $50 billion","增加 500 億美元"],["increase by $100 billion","增加 1,000 億美元"],["not change","不變"],["decrease by $50 billion","減少 500 億美元"],["increase by $250 billion","增加 2,500 億美元"]],"a":"A","e":["The balanced-budget multiplier is 1, so GDP rises by the amount of the spending increase, $50 billion.","平衡預算乘數為 1，GDP 增加的金額等於支出增加的金額，500 億美元。"]},{"k":"c","q":["Disposable income rises from $400 to $500 and consumption rises from $380 to $460. The MPC is","可支配所得從 400 美元增加到 500 美元，消費從 380 美元增加到 460 美元。MPC 是"],"o":[["0.2","0.2"],["0.8","0.8"],["0.92","0.92"],["0.95","0.95"],["1.25","1.25"]],"a":"B","e":["MPC = ΔC ÷ ΔDI = 80 ÷ 100 = 0.8.","MPC = ΔC ÷ ΔDI = 80 ÷ 100 = 0.8。"]},{"k":"k","q":["The short-run aggregate supply curve slopes upward because","短期總合供給曲線為正斜率，是因為"],"o":[["interest rates fall as the price level rises","物價上升時利率下降"],["imports rise as the price level rises","物價上升時進口增加"],["the economy always produces at full employment","經濟永遠在充分就業下生產"],["consumers buy more when prices fall","價格下跌時消費者會買更多"],["some input prices, such as nominal wages, are slow to adjust","某些投入價格（例如名目工資）調整緩慢"]],"a":"E","e":["With sticky wages and input prices, a higher output price raises profit per unit, so firms produce more.","工資與投入價格具僵固性，產品價格上升使每單位利潤增加，廠商就多生產。"]},{"k":"k","q":["Which of the following would shift the short-run aggregate supply curve to the left?","下列何者會使短期總合供給曲線左移？"],"o":[["A decrease in business taxes","營業稅降低"],["An increase in the price of oil","油價上漲"],["A decrease in nominal wages","名目工資下降"],["An increase in consumer spending","消費支出增加"],["An increase in labor productivity","勞動生產力提高"]],"a":"B","e":["Higher input costs reduce what firms will produce at each price level, a negative supply shock.","投入成本上升，使廠商在每個物價水準下願意生產的數量減少，是負面供給衝擊。"]},{"k":"k","q":["The long-run aggregate supply curve is vertical because in the long run","長期總合供給曲線是垂直的，因為在長期"],"o":[["the government sets real GDP","由政府決定實質 GDP"],["the price level is fixed","物價水準固定"],["all prices and wages are flexible, so output returns to full-employment output","所有價格與工資都能調整，產出回到充分就業產出"],["aggregate demand does not change","總合需求不變"],["unemployment is zero","失業率為零"]],"a":"C","e":["Full-employment output depends on resources and technology, not on the price level, once wages and prices fully adjust.","工資與物價完全調整後，充分就業產出取決於資源與技術，與物價水準無關。"]},{"k":"k","q":["A decrease in AD in the short run causes","短期內 AD 減少會造成"],"o":[["real GDP to rise and unemployment to fall","實質 GDP 上升、失業下降"],["stagflation","停滯性通膨"],["no change in real GDP","實質 GDP 不變"],["the price level and real GDP to fall, and unemployment to rise","物價與實質 GDP 下降，失業增加"],["the price level to rise and real GDP to fall","物價上升、實質 GDP 下降"]],"a":"D","e":["AD shifts left along an upward-sloping SRAS: lower price level, lower output and higher unemployment.","AD 沿著正斜率的 SRAS 左移：物價下降、產出減少、失業上升。"]},{"k":"k","q":["A negative supply shock, such as a sharp rise in energy prices, causes in the short run","負面供給衝擊（例如能源價格大漲）在短期會造成"],"o":[["no change in the price level","物價不變"],["higher price level and higher real GDP","物價上升、實質 GDP 上升"],["higher price level and lower real GDP","物價上升、實質 GDP 下降"],["lower price level and lower real GDP","物價下降、實質 GDP 下降"],["lower price level and higher real GDP","物價下降、實質 GDP 上升"]],"a":"C","e":["SRAS shifts left, causing stagflation: rising prices together with falling output.","SRAS 左移，造成停滯性通膨：物價上漲同時產出下降。"]},{"k":"k","q":["An economy is in a recessionary gap. Without government policy, in the long run","某經濟體處於衰退缺口。若政府不採取政策，長期下"],"o":[["LRAS shifts left to the current output","LRAS 左移到目前產出"],["the price level rises","物價水準上升"],["nominal wages fall, SRAS shifts right and output returns to full employment","名目工資下降，SRAS 右移，產出回到充分就業"],["nominal wages rise, SRAS shifts left","名目工資上升，SRAS 左移"],["AD shifts right on its own","AD 自行右移"]],"a":"C","e":["High unemployment puts downward pressure on wages; lower costs shift SRAS right until output reaches potential.","高失業使工資下降；成本降低使 SRAS 右移，直到產出回到潛在水準。"]},{"k":"k","q":["To close a recessionary gap, appropriate discretionary fiscal policy is to","要消除衰退缺口，適當的權衡性財政政策是"],"o":[["increase the reserve requirement","提高法定準備率"],["decrease government spending or increase taxes","減少政府支出或加稅"],["increase government spending or decrease taxes","增加政府支出或減稅"],["sell government bonds on the open market","在公開市場賣出公債"],["increase both spending and the discount rate","增加支出並提高重貼現率"]],"a":"C","e":["Expansionary fiscal policy raises AD. Reserve requirements and open-market sales are monetary policy tools.","擴張性財政政策提高 AD。法定準備率與公開市場操作是貨幣政策工具。"]},{"k":"c","q":["Real GDP is $800 billion and full-employment GDP is $900 billion. The MPC is 0.9. What change in government spending would close the gap?","實質 GDP 為 8,000 億美元，充分就業 GDP 為 9,000 億。MPC 為 0.9。政府支出要怎麼變動才能消除缺口？"],"o":[["Increase by $100 billion","增加 1,000 億美元"],["Increase by $90 billion","增加 900 億美元"],["Increase by $11.1 billion","增加 111 億美元"],["Decrease by $10 billion","減少 100 億美元"],["Increase by $10 billion","增加 100 億美元"]],"a":"E","e":["The gap is $100 billion and the multiplier is 1 ÷ 0.1 = 10, so G must rise by 100 ÷ 10 = $10 billion.","缺口為 1,000 億，乘數為 1 ÷ 0.1 = 10，G 需增加 1,000 億 ÷ 10 = 100 億美元。"]},{"k":"c","q":["Real GDP is $1,050 billion and full-employment GDP is $1,000 billion. The MPC is 0.8. What change in taxes would close the gap?","實質 GDP 為 1 兆 500 億美元，充分就業 GDP 為 1 兆。MPC 為 0.8。稅收要怎麼變動才能消除缺口？"],"o":[["Increase by $12.5 billion","增加 125 億美元"],["Decrease by $12.5 billion","減少 125 億美元"],["Decrease by $10 billion","減少 100 億美元"],["Increase by $50 billion","增加 500 億美元"],["Increase by $10 billion","增加 100 億美元"]],"a":"A","e":["This is a $50 billion inflationary gap. The tax multiplier is −0.8 ÷ 0.2 = −4, so taxes must rise by 50 ÷ 4 = $12.5 billion.","這是 500 億的膨脹缺口。租稅乘數 = −0.8 ÷ 0.2 = −4，稅收需增加 500 億 ÷ 4 = 125 億美元。"]},{"k":"k","q":["Which of the following is an automatic stabilizer?","下列何者是自動穩定機制？"],"o":[["A new highway bill passed by Congress","國會通過的新公路法案"],["Unemployment benefits that rise during a recession","衰退時增加的失業給付"],["A one-time tax rebate approved during a recession","衰退時通過的一次性退稅"],["An open-market purchase of bonds","公開市場買進債券"],["A cut in the discount rate","調降重貼現率"]],"a":"B","e":["Automatic stabilizers change without new legislation; transfers rise and tax revenue falls automatically in a downturn.","自動穩定機制不需新立法就會變動；景氣下滑時，移轉支付自動增加、稅收自動減少。"]},{"k":"k","q":["A major reason fiscal policy may be less effective than predicted is","財政政策效果可能不如預期的一個主要原因是"],"o":[["the spending multiplier is always less than 1","支出乘數總是小於 1"],["taxes have no effect on consumption","稅收對消費沒有影響"],["time lags in recognizing problems and passing laws","認知問題與通過立法的時間落後"],["the LRAS curve is horizontal","LRAS 是水平線"],["government spending does not affect AD","政府支出不影響 AD"]],"a":"C","e":["Recognition, decision and implementation lags can delay policy until conditions have changed.","認知、決策與執行的時間落後，可能使政策生效時經濟狀況已經改變。"]},{"k":"k","q":["If both AD and SRAS shift to the right, then in the short run","如果 AD 與 SRAS 同時右移，短期內"],"o":[["real GDP and the price level both fall","實質 GDP 與物價都下降"],["real GDP rises, and the change in the price level is indeterminate","實質 GDP 上升，物價變化無法確定"],["nothing changes","沒有任何改變"],["real GDP falls and the price level rises","實質 GDP 下降、物價上升"],["the price level rises, and the change in real GDP is indeterminate","物價上升，實質 GDP 變化無法確定"]],"a":"B","e":["Both shifts raise output. AD raises the price level and SRAS lowers it, so the net effect on prices depends on the sizes of the shifts.","兩者都使產出增加；AD 使物價上升、SRAS 使物價下降，淨效果取決於幅度。"]},{"k":"c","q":["The MPC is 0.6. Government spending rises by $30 billion and taxes rise by $30 billion. The maximum change in real GDP is","MPC 為 0.6。政府支出增加 300 億美元，稅收也增加 300 億美元。實質 GDP 最多變動"],"o":[["$0","0"],["+$75 billion","+750 億美元"],["+$120 billion","+1,200 億美元"],["+$30 billion","+300 億美元"],["−$45 billion","−450 億美元"]],"a":"D","e":["Spending effect: 2.5 × 30 = +75. Tax effect: −1.5 × 30 = −45. Net: +$30 billion (balanced-budget multiplier of 1).","支出效果：2.5 × 300 億 = +750 億；租稅效果：−1.5 × 300 億 = −450 億；淨效果 +300 億美元（平衡預算乘數 1）。"]},{"k":"k","q":["An economy is at the intersection of AD and SRAS to the right of LRAS. This economy has","某經濟體的 AD 與 SRAS 交點在 LRAS 右側。這個經濟體"],"o":[["a recessionary gap with unemployment above the natural rate","有衰退缺口，失業率高於自然失業率"],["full employment","處於充分就業"],["an inflationary gap with unemployment below the natural rate","有膨脹缺口，失業率低於自然失業率"],["zero inflation","通膨為零"],["a vertical SRAS curve","SRAS 為垂直線"]],"a":"C","e":["Output above potential means the economy is overheating: an inflationary gap with unusually low unemployment.","產出高於潛在水準代表經濟過熱：膨脹缺口，失業率異常低。"]}],"frq":[{"t":["A Recessionary Gap","衰退缺口"],"len":"Long","s":["Country Z is in a short-run equilibrium with real GDP of $600 billion. Its full-employment output is $700 billion. The marginal propensity to consume is 0.75.","Z 國處於短期均衡，實質 GDP 為 6,000 億美元，充分就業產出為 7,000 億美元。邊際消費傾向為 0.75。"],"p":[{"q":["Draw a correctly labeled AD–AS graph showing Country Z’s current equilibrium. Label the current output Y_{1}, the price level PL_{1} and full-employment output Y_{f}.","畫出正確標示的 AD–AS 圖，表示 Z 國目前的均衡。標出目前產出 Y_{1}、物價 PL_{1} 與充分就業產出 Y_{f}。"],"a":["AD₁ crosses SRAS at Y₁ = $600 billion, to the left of the vertical LRAS at Y_{f} = $700 billion.","AD₁ 與 SRAS 交於 Y₁ = 6,000 億，在垂直的 LRAS（Y_{f} = 7,000 億）左側。"],"af":{"xm":10,"ym":10,"xl":"Real GDP","yl":"Price level","ln":[{"p":[[6,0.6],[6,9.4]],"c":"k","l":"LRAS","lp":[6.1,9.4]},{"p":[[1.2,2.19],[9.4,7.93]],"c":"s","l":"SRAS"},{"p":[[1,7.65],[8.6,0.81]],"c":"d","l":"AD₁"},{"p":[[2.4,8.79],[9.6,2.31]],"c":"d","d":1,"l":"AD₂"}],"g":[[4.5,4.5,"Y₁","PL₁"],[6,5.55,"","PL₂"]],"xt":[[6,"Y_f"]],"pt":[{"x":4.5,"y":4.5},{"x":6,"y":5.55}],"ar":[[[2.6,6.6],[3.9,7.2]]]}},{"q":["Calculate the change in government spending needed to close the gap.","計算消除缺口所需的政府支出變動。"],"a":["Gap = $100 billion; multiplier = 1 ÷ 0.25 = 4; ΔG = +$25 billion.","缺口 = 1,000 億；乘數 = 1 ÷ 0.25 = 4；ΔG = +250 億美元。"]},{"q":["Instead, calculate the change in taxes needed to close the gap.","若改用租稅，計算所需的稅收變動。"],"a":["Tax multiplier = −0.75 ÷ 0.25 = −3; ΔT = −100 ÷ 3 ≈ −$33.3 billion (a tax cut).","租稅乘數 = −0.75 ÷ 0.25 = −3；ΔT = −1,000 億 ÷ 3 ≈ −333 億美元（減稅）。"]},{"q":["Explain why the tax change in (c) is larger in absolute value than the spending change in (b).","說明為什麼 (c) 的稅收變動的絕對值比 (b) 的支出變動大。"],"a":["Part of a tax cut is saved (MPS = 0.25), so only 75% enters spending in the first round; government spending enters AD in full.","減稅有一部分會被儲蓄（MPS = 0.25），第一輪只有 75% 變成支出；政府支出則全額進入 AD。"]},{"q":["On your graph, show the effect of the policy in (b) and state what happens to the price level and the unemployment rate.","在圖上表示 (b) 的政策效果，並說明物價與失業率的變化。"],"a":["AD shifts right to AD₂ through Y_{f}; the price level rises to PL₂ and unemployment falls to the natural rate.","AD 右移到經過 Y_{f} 的 AD₂；物價上升到 PL₂，失業率降到自然失業率。"]},{"q":["If the government does nothing, explain how the economy adjusts in the long run, and show it on a new graph.","如果政府什麼都不做，說明經濟在長期如何調整，並另畫一張圖表示。"],"a":["Unemployment pushes nominal wages down, SRAS shifts right to SRAS₂, and the economy returns to Y_{f} at a lower price level.","失業使名目工資下降，SRAS 右移到 SRAS₂，經濟以較低的物價回到 Y_{f}。"],"af":{"xm":10,"ym":10,"xl":"Real GDP","yl":"Price level","ln":[{"p":[[6,0.6],[6,9.4]],"c":"k","l":"LRAS","lp":[6.1,9.4]},{"p":[[1.2,2.19],[9.4,7.93]],"c":"s","l":"SRAS₁"},{"p":[[2.6,0.77],[9.6,5.67]],"c":"s","d":1,"l":"SRAS₂"},{"p":[[1,7.65],[8.6,0.81]],"c":"d","l":"AD"}],"g":[[4.5,4.5,"Y₁","PL₁"],[6,3.15,"","PL₂"]],"xt":[[6,"Y_f"]],"pt":[{"x":4.5,"y":4.5},{"x":6,"y":3.15}],"ar":[[[7.6,6.8],[8.4,5.9]]]}}]},{"t":["An Oil Supply Shock","石油供給衝擊"],"len":"Short","s":["An economy is at full employment when the world price of oil rises sharply.","某經濟體處於充分就業時，國際油價大幅上漲。"],"p":[{"q":["Draw a correctly labeled AD–AS graph showing the short-run effect of the oil price increase on the price level and real GDP.","畫出正確標示的 AD–AS 圖，表示油價上漲對物價與實質 GDP 的短期影響。"],"a":["SRAS shifts left: the price level rises from PL₁ to PL₂ and real GDP falls from Y_{f} to Y₂ (stagflation).","SRAS 左移：物價從 PL₁ 上升到 PL₂，實質 GDP 從 Y_{f} 減少到 Y₂（停滯性通膨）。"],"af":{"xm":10,"ym":10,"xl":"Real GDP","yl":"Price level","ln":[{"p":[[6,0.6],[6,9.4]],"c":"k","l":"LRAS","lp":[6.1,9.4]},{"p":[[2.2,2.34],[9.6,7.52]],"c":"s","l":"SRAS₁"},{"p":[[0.6,2.9],[7.6,7.8]],"c":"s","d":1,"l":"SRAS₂","lp":[0.7,3.6]},{"p":[[1,9.5],[9.4,1.94]],"c":"d","l":"AD"}],"g":[[6,5,"","PL₁"],[4.95,5.945,"Y₂","PL₂"]],"xt":[[6,"Y_f"]],"pt":[{"x":6,"y":5},{"x":4.95,"y":5.945}],"ar":[[[7.6,6.3],[5.8,6.3]]]}},{"q":["What happens to the unemployment rate in the short run?","短期內失業率如何變化？"],"a":["It rises above the natural rate because output falls below full employment.","上升到自然失業率以上，因為產出低於充分就業水準。"]},{"q":["If the government increases spending to restore output, what happens to the price level compared with the level in (a)? Explain.","如果政府增加支出以恢復產出，物價和 (a) 相比會如何？請說明。"],"a":["It rises further, because AD shifts right along the new SRAS₂; restoring output worsens inflation.","物價會再上升，因為 AD 沿著新的 SRAS₂ 右移；恢復產出會使通膨更嚴重。"]}]}]},{"id":"ma4","c":"macro","n":4,"t":["Financial Sector","金融部門"],"mcq":[{"k":"k","q":["When you compare the prices of two laptops in dollars, money is serving as a","當你用美元比較兩台筆電的價格時，貨幣發揮的功能是"],"o":[["store of value","價值儲藏"],["unit of account","計價單位"],["form of barter","以物易物的形式"],["medium of exchange","交易媒介"],["standard of deferred payment","延期支付標準"]],"a":"B","e":["A unit of account is a common measure used to state and compare prices.","計價單位是用來表示與比較價格的共同衡量標準。"]},{"k":"k","q":["Which of the following is included in M1?","下列何者包含在 M1 中？"],"o":[["Currency in circulation and checkable deposits","流通中的通貨與支票存款"],["Large time deposits only","只有大額定期存款"],["Stocks held by households","家庭持有的股票"],["Gold held by the central bank","央行持有的黃金"],["Government bonds held by the public","大眾持有的公債"]],"a":"A","e":["M1 consists of the most liquid forms of money: currency, checkable (demand) deposits and other liquid deposits.","M1 是流動性最高的貨幣：通貨、支票（活期）存款與其他流動性存款。"]},{"k":"k","q":["Money that has value because the government declares it legal tender, not because of the material it is made of, is","貨幣的價值來自政府宣告其為法償貨幣，而不是來自製作材料，這種貨幣稱為"],"o":[["commodity money","商品貨幣"],["a bond","債券"],["barter","以物易物"],["a reserve requirement","法定準備"],["fiat money","法定貨幣（強制貨幣）"]],"a":"E","e":["Fiat money has no intrinsic value; its value rests on government decree and public acceptance.","法定貨幣本身沒有內在價值，價值來自政府規定與大眾接受。"]},{"k":"k","q":["If market interest rates rise, the prices of existing bonds","如果市場利率上升，現有債券的價格"],"o":[["do not change","不變"],["become equal to their face value","變成等於面額"],["fall","下跌"],["rise, then fall","先漲後跌"],["rise","上漲"]],"a":"C","e":["Existing bonds pay a fixed coupon; when new bonds pay more, buyers will pay less for the old ones. Bond prices and interest rates move inversely.","現有債券的票面利息固定；新債券利息較高時，舊債券的價格就會下跌。債券價格與利率反向變動。"]},{"k":"c","q":["A bank loan has a nominal interest rate of 8%, and expected inflation is 3%. The expected real interest rate is","某筆銀行貸款的名目利率為 8%，預期通膨率為 3%。預期實質利率是"],"o":[["2.67%","2.67%"],["3%","3%"],["5%","5%"],["8%","8%"],["11%","11%"]],"a":"C","e":["Real interest rate = nominal rate − expected inflation = 8% − 3% = 5%.","實質利率 = 名目利率 − 預期通膨率 = 8% − 3% = 5%。"]},{"k":"c","q":["A lender charges a nominal rate of 6% expecting inflation of 2%, but actual inflation turns out to be 4%. The lender’s actual real return is","貸款人預期通膨為 2%，收取 6% 的名目利率，但實際通膨為 4%。貸款人實際的實質報酬率是"],"o":[["2%","2%"],["4%","4%"],["6%","6%"],["8%","8%"],["10%","10%"]],"a":"A","e":["Actual real rate = 6% − 4% = 2%, lower than the expected 4%, so the unexpected inflation hurts the lender.","實際實質利率 = 6% − 4% = 2%，低於預期的 4%，未預期的通膨使貸款人受損。"]},{"k":"c","q":["A bank has $500 in demand deposits and $150 in reserves. The reserve requirement is 20%. Its excess reserves are","某銀行有 500 美元活期存款、150 美元準備金。法定準備率為 20%。它的超額準備是"],"o":[["$30","30 美元"],["$50","50 美元"],["$100","100 美元"],["$150","150 美元"],["$350","350 美元"]],"a":"B","e":["Required reserves = 20% × 500 = $100, so excess reserves = 150 − 100 = $50.","法定準備 = 20% × 500 = 100 美元，超額準備 = 150 − 100 = 50 美元。"]},{"k":"c","q":["If the required reserve ratio is 25%, the money multiplier is","如果法定準備率為 25%，貨幣乘數是"],"o":[["0.25","0.25"],["2.5","2.5"],["4","4"],["5","5"],["25","25"]],"a":"C","e":["Money multiplier = 1 ÷ reserve requirement = 1 ÷ 0.25 = 4.","貨幣乘數 = 1 ÷ 法定準備率 = 1 ÷ 0.25 = 4。"]},{"k":"c","q":["Someone deposits $1,000 of cash into a checking account. The reserve requirement is 10%. What is the maximum change in the money supply that can result from new loans?","有人把 1,000 美元現金存入支票帳戶。法定準備率為 10%。新貸款最多能使貨幣供給增加多少？"],"o":[["$100","100 美元"],["$900","900 美元"],["$1,000","1,000 美元"],["$9,000","9,000 美元"],["$10,000","10,000 美元"]],"a":"D","e":["The deposit only changes the form of money (cash to deposits). Excess reserves = $900, and the banking system can lend 900 × 10 = $9,000.","存款只改變貨幣的形式（現金變存款）。超額準備 = 900 美元，整個銀行體系可貸出 900 × 10 = 9,000 美元。"]},{"k":"c","q":["The Fed buys $100 million of bonds from commercial banks. The reserve requirement is 20%. The maximum increase in the money supply is","聯準會向商業銀行買進 1 億美元的債券。法定準備率為 20%。貨幣供給最多增加"],"o":[["$20 million","2,000 萬美元"],["$100 million","1 億美元"],["$500 million","5 億美元"],["$400 million","4 億美元"],["$80 million","8,000 萬美元"]],"a":"C","e":["The banks’ excess reserves rise by the full $100 million (no new deposits are created), so ΔMS = 100 × 1/0.2 = $500 million.","銀行的超額準備增加整整 1 億（沒有新增存款），ΔMS = 1 億 × 1/0.2 = 5 億美元。"]},{"k":"c","q":["The Fed buys $100 million of bonds from the public, who deposit the payment in banks. The reserve requirement is 10%. What is the maximum amount of new loans the banking system can make?","聯準會向大眾買進 1 億美元的債券，大眾把款項存入銀行。法定準備率為 10%。銀行體系最多能新增多少貸款？"],"o":[["$90 million","9,000 萬美元"],["$1,000 million","10 億美元"],["$10 million","1,000 萬美元"],["$900 million","9 億美元"],["$100 million","1 億美元"]],"a":"D","e":["The $100 million deposit creates $90 million of excess reserves; loans can grow by 90 × 10 = $900 million. (The money supply can grow by $1,000 million, including the deposit.)","1 億美元存款產生 9,000 萬超額準備，貸款最多增加 9,000 萬 × 10 = 9 億美元。（貨幣供給連同存款最多增加 10 億。）"]},{"k":"c","q":["A single bank has $2,000 of deposits and $600 of reserves. The reserve requirement is 20%. How much can this bank lend right now?","某家銀行有 2,000 美元存款、600 美元準備金。法定準備率為 20%。這家銀行目前最多能放款多少？"],"o":[["$200","200 美元"],["$400","400 美元"],["$600","600 美元"],["$1,000","1,000 美元"],["$1,600","1,600 美元"]],"a":"A","e":["Required reserves = 0.2 × 2,000 = $400; a single bank can lend only its excess reserves, 600 − 400 = $200.","法定準備 = 0.2 × 2,000 = 400 美元；單一銀行只能貸出超額準備 600 − 400 = 200 美元。"]},{"k":"k","q":["An open-market purchase of government bonds by the central bank will most likely","央行在公開市場買進公債，最可能"],"o":[["decrease the money supply","減少貨幣供給"],["increase bank reserves and decrease interest rates","增加銀行準備、降低利率"],["increase the price of foreign currency only","只提高外幣價格"],["decrease bank reserves and increase interest rates","減少銀行準備、提高利率"],["increase the reserve requirement","提高法定準備率"]],"a":"B","e":["Paying for the bonds adds reserves to the banking system; the money supply rises and interest rates fall.","央行付款買債券，使銀行體系的準備增加；貨幣供給增加、利率下降。"]},{"k":"k","q":["In an ample-reserves framework, the Federal Reserve’s main tool for changing the federal funds rate is","在充足準備的架構下，聯準會調整聯邦資金利率的主要工具是"],"o":[["changing the interest rate it pays on reserve balances","調整準備金餘額的利率"],["changing the reserve requirement","調整法定準備率"],["changing income tax rates","調整所得稅率"],["buying stocks","買進股票"],["printing more currency","印更多鈔票"]],"a":"A","e":["With ample reserves, the Fed moves the policy rate mainly through administered rates such as interest on reserve balances.","在充足準備下，聯準會主要透過準備金利率等管理利率來調整政策利率。"]},{"k":"k","q":["To fight high inflation, the central bank would most likely","為了對抗高通膨，央行最可能"],"o":[["lower the reserve requirement","調降法定準備率"],["lower the interest rate on reserves","調降準備金利率"],["sell government bonds","賣出公債"],["buy government bonds","買進公債"],["lower the discount rate","調降重貼現率"]],"a":"C","e":["Selling bonds drains reserves and raises interest rates, reducing investment and AD. The other choices are expansionary.","賣出債券使準備減少、利率上升，投資與 AD 減少。其他選項都是擴張性政策。"]},{"k":"k","q":["The discount rate is the interest rate","重貼現率是"],"o":[["banks charge their best customers","銀行向最佳客戶收取的利率"],["banks charge each other for overnight loans","銀行之間隔夜拆借的利率"],["the government pays on bonds","政府發行債券支付的利率"],["paid on savings accounts","儲蓄存款的利率"],["the Fed charges commercial banks for loans","聯準會借錢給商業銀行時收取的利率"]],"a":"E","e":["The discount rate is charged on loans from the Fed’s discount window. The rate banks charge each other is the federal funds rate.","重貼現率是聯準會貼現窗口放款的利率；銀行之間拆借的是聯邦資金利率。"]},{"k":"k","q":["In the money market, an increase in the price level will","在貨幣市場中，物價水準上升會"],"o":[["decrease money demand and lower the nominal interest rate","減少貨幣需求，使名目利率下降"],["have no effect on the money market","對貨幣市場沒有影響"],["decrease the money supply","減少貨幣供給"],["increase the money supply","增加貨幣供給"],["increase money demand and raise the nominal interest rate","增加貨幣需求，使名目利率上升"]],"a":"E","e":["People need more money to buy the same goods at higher prices, so money demand shifts right and the interest rate rises.","物價較高時，購買同樣商品需要更多貨幣，貨幣需求右移，利率上升。"]},{"k":"k","q":["An increase in the money supply affects real GDP in the short run mainly through","短期內貨幣供給增加影響實質 GDP，主要透過"],"o":[["lower interest rates that increase investment spending","利率下降使投資支出增加"],["a decrease in government spending","政府支出減少"],["higher taxes","加稅"],["a leftward shift of LRAS","LRAS 左移"],["higher interest rates that increase saving","利率上升使儲蓄增加"]],"a":"A","e":["Money supply ↑ → interest rate ↓ → investment and interest-sensitive consumption ↑ → AD ↑ → real GDP ↑.","貨幣供給增加 → 利率下降 → 投資與對利率敏感的消費增加 → AD 增加 → 實質 GDP 增加。"]},{"k":"k","q":["In the loanable funds market, an increase in private saving will","在可貸資金市場中，私人儲蓄增加會"],"o":[["increase demand and raise the real interest rate","使需求增加、實質利率上升"],["increase supply and lower the real interest rate","使供給增加、實質利率下降"],["decrease supply and raise the real interest rate","使供給減少、實質利率上升"],["not change the real interest rate","不影響實質利率"],["decrease demand and lower the real interest rate","使需求減少、實質利率下降"]],"a":"B","e":["Saving is the source of the supply of loanable funds; more saving shifts supply right, lowering the real interest rate.","儲蓄是可貸資金的供給來源；儲蓄增加使供給右移，實質利率下降。"]},{"k":"k","q":["If the government borrows to finance a larger budget deficit, in the loanable funds market","如果政府借錢支應更大的預算赤字，在可貸資金市場中"],"o":[["demand decreases and private investment rises","需求減少，私人投資增加"],["private saving falls to zero","私人儲蓄降為零"],["demand increases, the real interest rate rises and private investment falls","需求增加，實質利率上升，私人投資減少"],["supply increases and the real interest rate falls","供給增加，實質利率下降"],["the real interest rate does not change","實質利率不變"]],"a":"C","e":["Government borrowing adds to demand for loanable funds; the higher real interest rate crowds out private investment.","政府借款增加可貸資金需求；實質利率上升，排擠私人投資。"]},{"k":"k","q":["Which asset is the most liquid?","下列哪一種資產流動性最高？"],"o":[["Currency","通貨（現金）"],["A 10-year government bond","10 年期公債"],["Shares of stock","股票"],["A house","房子"],["A savings bond that cannot be redeemed for a year","一年內不能贖回的儲蓄債券"]],"a":"A","e":["Currency is already money and can be spent immediately without any loss of value.","現金本身就是貨幣，可以立即使用，不會損失價值。"]}],"frq":[{"t":["Banks and Monetary Policy","銀行與貨幣政策"],"len":"Long","s":["First Bank’s balance sheet is shown below. The reserve requirement is 10%, and the bank holds no other assets or liabilities. Fill in the blank cells.","下表是 First Bank 的資產負債表。法定準備率為 10%，銀行沒有其他資產或負債。請填寫空格。"],"tbl":{"h":[["Item","項目"],["Amount ($)","金額（美元）"]],"r":[[["Demand deposits (liability)","活期存款（負債）"],"10,000"],[["Reserves (asset)","準備金（資產）"],"3,000"],[["Loans (asset)","放款（資產）"],"7,000"],[["Required reserves","法定準備"],"1,000"],[["Excess reserves","超額準備"],"2,000"],[["Maximum new loans First Bank can make","First Bank 最多可新增的放款"],"2,000"],[["Maximum change in the money supply from these excess reserves","這些超額準備最多能使貨幣供給增加"],"20,000"]],"b":[[2,1],[3,1],[4,1],[5,1],[6,1]]},"p":[{"q":["Fill in the table and show your work for the last row.","填寫表格，最後一列要寫出計算過程。"],"a":["Loans = 10,000 − 3,000 = $7,000; required reserves = 0.1 × 10,000 = $1,000; excess reserves = $2,000; First Bank can lend $2,000; money multiplier = 10, so the money supply can rise by 2,000 × 10 = $20,000.","放款 = 10,000 − 3,000 = 7,000；法定準備 = 0.1 × 10,000 = 1,000；超額準備 = 2,000；First Bank 可放款 2,000；貨幣乘數 = 10，貨幣供給最多增加 2,000 × 10 = 20,000 美元。"]},{"q":["The economy is in a recession. Identify an open-market operation the central bank could use.","經濟處於衰退。指出央行可以採取的公開市場操作。"],"a":["Buy government bonds.","買進公債。"]},{"q":["Draw a correctly labeled money market graph and show the effect of the policy in (b) on the nominal interest rate.","畫出正確標示的貨幣市場圖，表示 (b) 的政策對名目利率的影響。"],"a":["MS shifts right from MS₁ to MS₂; the nominal interest rate falls from i₁ to i₂.","MS 從 MS₁ 右移到 MS₂；名目利率從 i₁ 下降到 i₂。"],"af":{"xm":10,"ym":10,"xl":"Quantity of money","yl":"Nominal interest rate","ln":[{"p":[[4,0.4],[4,9.4]],"c":"s","l":"MS₁","lp":[4.15,9.4]},{"p":[[6,0.4],[6,9.4]],"c":"s","d":1,"l":"MS₂","lp":[6.15,9.4]},{"p":[[1,9],[9,1]],"c":"d","l":"MD"}],"g":[[4,6,"Q₁","i₁"],[6,4,"Q₂","i₂"]],"pt":[{"x":4,"y":6},{"x":6,"y":4}],"ar":[[[4.3,8],[5.7,8]]]}},{"q":["Explain how the change in the interest rate affects real GDP and the price level in the short run.","說明利率的變化在短期內如何影響實質 GDP 與物價水準。"],"a":["A lower interest rate increases investment (and interest-sensitive consumption), so AD increases; real GDP and the price level both rise.","利率下降使投資（與對利率敏感的消費）增加，AD 增加；實質 GDP 與物價水準都上升。"]},{"q":["If banks choose to keep some excess reserves instead of lending them all, how would the actual change in the money supply compare with your answer in (a)?","如果銀行選擇保留部分超額準備而不全部貸出，貨幣供給的實際增加和 (a) 的答案相比如何？"],"a":["It would be smaller, because less money is lent and re-deposited in each roun ht","右移"],["not shift","不移動"],["shift to the left","左移"]],"a":"C","e":["Workers and firms build expected inflation into wages and prices, so each unemployment rate comes with higher inflation.","勞工與廠商會把預期通膨反映在工資與價格中，每個失業率都對應更高的通膨。"]},{"k":"k","q":["An economy is on its short-run Phillips curve with unemployment below the natural rate. On an AD–AS graph, this economy has","某經濟體在短期菲利浦曲線上，失業率低於自然失業率。在 AD–AS 圖上，這個經濟體"],"o":[["output equal to full-employment output","產出等於充分就業產出"],["a vertical SRAS curve","SRAS 為垂直線"],["an inflationary gap","有膨脹缺口"],["a falling price level","物價下降"],["a recessionary gap","有衰退缺口"]],"a":"C","e":["Unemployment below the natural rate means output is above potential: an inflationary gap.","失業率低於自然失業率，代表產出高於潛在水準：膨脹缺口。"]},{"k":"c","q":["The money supply is $500 billion, the velocity of money is 4 and real output is $1,000 billion. According to MV = PY, the price level is","貨幣供給為 5,000 億美元，貨幣流通速度為 4，實質產出為 1 兆美元。根據 MV = PY，物價水準是"],"o":[["0.5","0.5"],["1","1"],["2","2"],["4","4"],["8","8"]],"a":"C","e":["P = MV ÷ Y = (500 × 4) ÷ 1,000 = 2.","P = MV ÷ Y =（500 × 4）÷ 1,000 = 2。"]},{"k":"c","q":["Nominal GDP is $20 trillion and the money supply is $5 trillion. The velocity of money is","名目 GDP 為 20 兆美元，貨幣供給為 5 兆美元。貨幣流通速度是"],"o":[["0.25","0.25"],["4","4"],["15","15"],["25","25"],["100","100"]],"a":"B","e":["V = nominal GDP ÷ M = 20 ÷ 5 = 4.","V = 名目 GDP ÷ M = 20 ÷ 5 = 4。"]},{"k":"c","q":["Velocity is constant. The money supply grows by 6% per year and real GDP grows by 2% per year. According to the quantity theory, inflation is about","流通速度固定。貨幣供給每年成長 6%，實質 GDP 每年成長 2%。根據貨幣數量學說，通膨率約為"],"o":[["2%","2%"],["3%","3%"],["4%","4%"],["6%","6%"],["8%","8%"]],"a":"C","e":["%ΔM + %ΔV = %ΔP + %ΔY, so 6% + 0 = %ΔP + 2%, and %ΔP = 4%.","%ΔM + %ΔV = %ΔP + %ΔY，6% + 0 = %ΔP + 2%，所以 %ΔP = 4%。"]},{"k":"k","q":["In the long run, an increase in the money supply will most likely","長期下，貨幣供給增加最可能"],"o":[["shift LRAS to the right","使 LRAS 右移"],["raise real GDP permanently","永久提 const LINKS={"key":"answers.html","practice":"practice.html","micro":"micro-board.html","macro":"macro-board.html"};
(function(){
const $=id=>document.getElementById(id);
let S={course:'micro',unit:'mi1',zh:true,showQ:true};
try{Object.assign(S,JSON.parse(localStorage.getItem('apk-ui')||'{}'));}catch(e){}
const h0=(location.hash||'').slice(1);if(DATA.some(u=>u.id===h0)){S.unit=h0;S.course=h0.startsWith('mi')?'micro':'macro';}
const saveUI=()=>{try{localStorage.setItem('apk-ui',JSON.stringify(S));}catch(e){}};
function renderUnits(){const us=DATA.filter(u=>u.c===S.course);if(!us.some(u=>u.id===S.unit))S.unit=us[0].id;
  $('units').innerHTML=us.map(u=>`<button data-unit="${u.id}" aria-pressed="${u.id===S.unit}">Unit ${u.n}: ${esc(u.t[0])} (${esc(u.t[1])})</button>`).join('');
  document.querySelectorAll('[data-course]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.course===S.course));
  $('practiceLink').href=LINKS.practice+'#'+S.unit;}
function render(){renderUnits();const u=DATA.find(x=>x.id===S.unit);
  let h=`<div class="unit-h"><h2>Unit ${u.n}: ${esc(u.t[0])}<span class="zh">${esc(u.t[1])}</span></h2><span class="meta">Answer key (解答)</span></div>`;
  h+=`<div class="q"><b>Quick key (答案速查)</b><div class="sheet">${u.mcq.map((q,i)=>`<span>${i+1}. <b style="color:var(--good)">${q.a}</b></span>`).join('')}</div></div>`;
  h+=`<p class="sec-h">SECTION I · MULTIPLE CHOICE (選擇題)</p>`;
  u.mcq.forEach((q,i)=>{const id=u.id+'-m'+(i+1);
    h+=`<article class="q" id="${id}"><div class="qh"><span class="qn">${i+1}.</span><span class="tag ${q.k==='c'?'calc':''}">${q.k==='c'?'Calculation (計算)':'Concept (觀念)'}</span><span class="key">Answer: ${q.a}</span><button class="tz" data-tz="${id}">中 / EN</button></div>`;
    h+=`<div class="qbody">${bi(q.q)}`;
    if(q.fig||q.tbl)h+=`<div class="figbox">${q.fig?figSVG(q.fig):''}${q.tbl?tableHTML(q.tbl,'a',id+'t'):''}</div>`;
    h+=`<div class="opts">`+q.o.map((o,j)=>`<div class="opt${LETTERS[j]===q.a?' correct':''}"><span class="L">${LETTERS[j]}</span>${bi(o,'span')}</div>`).join('')+'</div></div>';
    h+=`<div class="ans"><span class="lab">EXPLANATION (解析)</span>${bi(q.e)}</div></article>`;});
  h+=`<p class="sec-h">SECTION II · FREE RESPONSE (問答題)</p>`;
  u.frq.forEach((f,i)=>{const id=u.id+'-f'+(i+1);
    h+=`<article class="q" id="${id}"><div class="qh"><span class="qn">FRQ ${i+1}.</span><span class="tag">${esc(EN(f.len||'Short'))}</span><button class="tz" data-tz="${id}">中 / EN</button></div><div class="qbody">${bi(f.t,'p','ftitle')}${f.s?bi(f.s):''}</div>`;
    if(f.fig||f.tbl)h+=`<div class="figbox">${f.fig?`<div class="qbody">${figSVG(f.fig)}</div>`:''}${f.tbl?tableHTML(f.tbl,'a',id+'t'):''}</div>`;
    if(f.tbl&&f.tbl.b&&f.tbl.b.length)h+=`<p class="meta">Highlighted cells are the blanks students fill in. (底色標示的是學生要填的空格。)</p>`;
    h+='<ol class="parts">'+f.p.map((p,j)=>`<li class="part"><span class="pl">(${String.fromCharCode(97+j)})</span><div class="pb"><div class="qbody">${bi(p.q)}</div><div class="ans"><span class="lab">ANSWER (答案)</span>${bi(p.a)}${p.af?`<div class="figbox">${[].concat(p.af).map(figSVG).join('')}</div>`:''}</div></div></li>`).join('')+'</ol></article>';});
  $('main').innerHTML=h;saveUI();}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.course){S.course=t.dataset.course;render();window.scrollTo(0,0);}
  else if(t.dataset.unit){S.unit=t.dataset.unit;try{history.replaceState(null,'','#'+S.unit);}catch(_){}render();window.scrollTo(0,0);}
  else if(t.dataset.tz){const q=$(t.dataset.tz);const on=q.classList.contains('zh-on')||(!q.classList.contains('zh-off')&&S.zh);q.classList.toggle('zh-on',!on);q.classList.toggle('zh-off',on);}});

$('showQ').onchange=e=>{S.showQ=e.target.checked;document.body.classList.toggle('hide-q',!S.showQ);saveUI();};
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(DATA.some(u=>u.id===h)&&h!==S.unit){S.unit=h;S.course=h.startsWith('mi')?'micro':'macro';render();}});
render();
})();
</script>
