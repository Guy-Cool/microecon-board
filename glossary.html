<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>個經專有名詞發音表</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: companion to the econ board — sticky control bar, unit chips, then unit sections of tappable term cards in an auto-fill grid */
:root{
  --bg:#e9eee9; --surface:#f6f8f5; --card:#fdfefc; --ink:#1b2621; --muted:#5a6a61;
  --rule:#cdd7d0; --accent:#1d6b57; --accent-ink:#ffffff; --accent-soft:#d6e9e1;
  --abbr:#6a49c9; --abbr-bg:#ece6fb; --warn:#9a6400;
  --f-en:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-zh:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","KaiTi",serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111916; --surface:#17221e; --card:#1a2823; --ink:#e6eee8; --muted:#97aa9f;
    --rule:#2d3d36; --accent:#7ccfb4; --accent-ink:#0f1915; --accent-soft:#1f3a31;
    --abbr:#c4b3ff; --abbr-bg:#2a2342; --warn:#f0b54a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111916; --surface:#17221e; --card:#1a2823; --ink:#e6eee8; --muted:#97aa9f;
  --rule:#2d3d36; --accent:#7ccfb4; --accent-ink:#0f1915; --accent-soft:#1f3a31;
  --abbr:#c4b3ff; --abbr-bg:#2a2342; --warn:#f0b54a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header h1{font-family:var(--f-zh);font-weight:700;font-size:1.7rem;margin:0;line-height:1.15;text-wrap:balance}
header h1 small{font-size:.65em;font-weight:400;color:var(--muted)}
header p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;font:inherit;font-size:.95rem;padding:7px 10px 7px 32px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.grp{display:flex;align-items:center;gap:6px}
.grp>span{font-size:.78rem;color:var(--muted)}
.seg{display:flex;gap:2px;background:var(--bg);border-radius:8px;padding:2px}
.seg button{font:inherit;font-size:.82rem;border:0;background:transparent;color:var(--muted);padding:5px 10px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--rule)}
.chk{display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.btn{font:inherit;font-size:.82rem;border:1px solid var(--rule);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.stop{border-color:var(--accent);color:var(--accent);font-weight:600}
.units{display:flex;flex-wrap:wrap;gap:4px}
.units button{font:inherit;font-size:.82rem;border:1px solid var(--rule);background:var(--card);color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer}
.units button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.units .n{font-variant-numeric:tabular-nums;opacity:.75;margin-left:3px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{background:var(--card);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.88rem}
section.unit{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.uh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.uh h2{margin:0;font-family:var(--f-en);font-weight:600;font-size:1.25rem;letter-spacing:.005em}
.uh h2 span{font-family:var(--f-zh);font-weight:400;color:var(--muted);font-size:.95em;margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.term{font:inherit;text-align:left;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:10px 40px 10px 12px;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:2px;min-width:0}
.term:hover{border-color:var(--accent)}
.term .en{font-family:var(--f-en);font-weight:500;font-size:1.08rem;line-height:1.3;overflow-wrap:anywhere}
.term .zh{font-family:var(--f-zh);font-size:1rem;color:var(--muted);line-height:1.35}
.term .def{font-size:.8rem;color:var(--muted);line-height:1.5;margin-top:5px;margin-right:-28px;padding-top:5px;border-top:1px dashed var(--rule)}
.hide-def .term .def{display:none}
.hide-zh .term:not(.shown) .def{color:transparent;background:var(--rule);border-radius:4px;border-top-color:transparent;user-select:none}
.term abbr{font-family:var(--f-ui);font-size:.72rem;font-weight:600;text-decoration:none;color:var(--abbr);background:var(--abbr-bg);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.spk{position:absolute;right:10px;top:10px;width:22px;height:22px;color:var(--muted);display:flex;align-items:center;justify-content:center}
.term:hover .spk{color:var(--accent)}
.term.playing{border-color:var(--accent);background:var(--accent-soft)}
.term.playing .spk{color:var(--accent)}
.bars{display:none;gap:2px;align-items:flex-end;height:14px}
.bars i{display:block;width:3px;background:currentColor;border-radius:1px;height:40%}
.term.playing .ico{display:none}.term.playing .bars{display:flex}
@media (prefers-reduced-motion:no-preference){
  .term.playing .bars i{animation:eq .7s ease-in-out infinite}
  .term.playing .bars i:nth-child(2){animation-delay:.15s}.term.playing .bars i:nth-child(3){animation-delay:.3s}
  .term{transition:border-color .15s,background .15s}
}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
.hide-en .term:not(.shown) .en,.hide-zh .term:not(.shown) .zh{color:transparent;background:var(--rule);border-radius:4px;user-select:none}
.hide-en .term:not(.shown) .en abbr{visibility:hidden}
.hide-en .term:not(.shown) .en,.hide-zh .term:not(.shown) .zh{width:fit-content;max-width:100%}
.empty{color:var(--muted);text-align:center;padding:32px 0}
.foot{color:var(--muted);font-size:.8rem;margin-top:10px}
[hidden]{display:none!important}
@media (max-width:700px){
  .bar{position:static}
  .units{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .units button{flex:none;white-space:nowrap}
  .grid{grid-template-columns:minmax(0,1fr)}
}
.homelink{align-self:flex-start;font-size:.82rem;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--rule);background:var(--surface);padding:3px 12px;border-radius:999px}
.homelink:hover{border-color:var(--accent)}
</style>
</head>

<div class="app">
  <a class="homelink" href="index.html">← Home (首頁)</a>
  <header>
    <h1>Micro Econ Glossary <small>(個經專有名詞發音表)</small></h1>
    <p>Click a term to hear it in English (點一下名詞就會朗讀英文)</p>
  </header>

  <div class="bar">
    <div class="row">
      <label class="search"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6"/></svg>
        <input type="text" id="q" placeholder="Search English or 中文 (搜尋)" autocomplete="off" aria-label="Search (搜尋)"></label>
      <div class="grp"><span>Accent (口音)</span><div class="seg" role="group" aria-label="Accent (口音)"><button data-acc="en-US" id="accUS">US (美式)</button><button data-acc="en-GB" id="accGB">UK (英式)</button></div></div>
      <div class="grp"><span>Speed (速度)</span><div class="seg" role="group" aria-label="Speed (速度)"><button data-rate="1" id="rN">Normal (正常)</button><button data-rate="0.7" id="rS">Slow (慢速)</button></div></div>
    </div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="showEn" checked>Show English (顯示英文)</label>
      <label class="chk"><input type="checkbox" id="showZh" checked>Show Chinese (顯示中文)</label>
      <label class="chk"><input type="checkbox" id="showDef" checked>Show explanations (顯示說明)</label>
      <span style="flex:1"></span>
      <button class="btn" id="stopBtn" hidden>■ Stop (停止)</button>
    </div>
    <div class="units" id="units" role="group" aria-label="Units (單元)"></div>
  </div>

  <div class="notice" id="notice" hidden></div>
  <main id="list"></main>
  <p class="foot">Pronunciation uses the voices built into this device's browser; Chrome, Edge and Safari work best. (發音使用裝置瀏覽器內建語音，建議用 Chrome、Edge 或 Safari。)</p>
</div>

如廠房。", "Variable input": "短期內可以調整數量的投入，例如工人、原料。", "Short run": "至少有一種投入（通常是資本）固定不變的期間。", "Long run": "所有投入都可以調整的期間，廠商也能進入或退出市場。", "Total product": "在一定投入下生產的總產量。", "Marginal product": "多投入一單位要素所增加的產量。", "Average product": "總產量 ÷ 投入要素數量，即平均每單位投入的產量。", "Law of diminishing marginal returns": "其他投入固定時，持續增加某一投入，邊際產量最終會遞減。", "Stages of production": "依 AP、MP 的變化把生產分成三階段；理性廠商會在第二階段生產。", "Explicit cost": "實際付出金錢的成本，例如工資、租金、原料費。", "Implicit cost": "使用自有資源的機會成本，例如自己的時間或自有資金的利息。", "Sunk cost": "已經付出且無法收回的成本，不應影響之後的決策。", "Accounting profit": "總收益減外顯成本。", "Economic profit": "總收益減外顯成本與隱含成本。", "Normal profit": "經濟利潤為零時的會計利潤，剛好足以讓資源留在這個產業。", "Total fixed cost": "不隨產量改變的成本，產量為零也要支付，例如租金。", "Total variable cost": "隨產量改變的成本，例如原料與計時工資。", "Total cost": "總固定成本加總變動成本。", "Average fixed cost": "總固定成本 ÷ 產量；產量越大，AFC 越低。", "Average variable cost": "總變動成本 ÷ 產量。", "Average total cost": "總成本 ÷ 產量，等於 AFC + AVC。", "Marginal cost": "多生產一單位所增加的總成本。", "Long-run average total cost": "長期下各產量所能達到的最低平均成本連成的曲線。", "Economies of scale": "長期擴大規模時，平均成本下降。", "Diseconomies of scale": "長期擴大規模時，平均成本上升。", "Constant returns to scale": "長期擴大規模時，平均成本維持不變。", "Minimum efficient scale": "長期平均成本達到最低時的最小產量。", "Market structure": "依廠商數目、產品差異、進入難易度等，區分市場的競爭型態。", "Perfect competition": "買賣者很多、產品相同、可自由進出，每家廠商都是價格接受者。", "Price taker": "無法影響市場價格、只能接受市場價格的買者或賣者。", "Identical products": "各廠商的產品完全相同，買方不在乎跟誰買。", "Free entry and exit": "廠商可以沒有障礙地進入或退出市場。", "Total revenue": "價格 × 銷售數量。", "Average revenue": "總收益 ÷ 銷售數量，等於價格。", "Marginal revenue": "多賣一單位所增加的總收益；完全競爭時等於價格。", "Profit maximization": "選擇讓總收益減總成本最大的產量。", "Marginal revenue equals marginal cost": "利潤極大化條件：生產到 MR = MC 的產量。", "Shutdown point": "價格等於最低平均變動成本的點；價格再低，短期就該停業。", "Break-even point": "價格等於最低平均總成本的點，經濟利潤為零。", "Short-run supply curve": "完全競爭廠商在最低 AVC 以上的那一段 MC 曲線。", "Long-run equilibrium": "完全競爭長期下 P = MC = 最低 ATC，經濟利潤為零。", "Monopoly": "市場只有一家廠商，產品沒有相近替代品，而且有進入障礙。", "Barriers to entry": "阻止新廠商進入市場的因素，例如專利、規模經濟、政府特許。", "Market power": "廠商影響產品價格的能力。", "Price maker": "能自行決定價格的廠商，又稱價格制定者。", "Natural monopoly": "規模經濟很大，由一家廠商供應整個市場成本最低，例如自來水、電力。", "Patent": "政府給予發明者一段期間的獨家權利，是進入障礙之一。", "Price discrimination": "同樣商品對不同消費者收不同價格，而價差不是因為成本不同。", "Perfect price discrimination": "對每位消費者收取其最高願付價格，消費者剩餘全部變成廠商利潤。", "First-degree price discrimination": "即完全差別取價：每一單位都以買方的最高願付價格出售。", "Markup": "價格高於邊際成本的部分。", "Marginal cost pricing": "管制獨占以 P = MC 定價；有效率，但自然獨占可能虧損。", "Average cost pricing": "管制獨占以 P = ATC 定價，經濟利潤為零。", "Regulation": "政府對廠商的價格、產量或進入所做的規範。", "Antitrust law": "防止獨占、勾結等妨礙競爭行為的法律；台灣主要是《公平交易法》。", "Monopolistic competition": "廠商很多、產品有差異、可自由進出，例如餐廳、髮廊。", "Product differentiation": "讓自己的產品在品質、設計、品牌等方面與別人不同。", "Excess capacity": "獨占性競爭長期下，產量低於最低 ATC 所對應的產量。", "Advertising": "讓消費者知道並偏好自家產品的活動，是非價格競爭的方式。", "Brand name": "廠商用來區分產品、建立信譽的名稱或標誌。", "Oligopoly": "市場由少數幾家大廠商主導，彼此的決策互相影響。", "Duopoly": "市場只有兩家廠商的寡占。", "Interdependence": "寡占廠商做決策時，必須考慮對手的反應。", "Collusion": "廠商私下協議共同定價或限制產量，以提高利潤。", "Cartel": "正式聯合定價、分配產量的廠商組織，例如石油輸出國組織（OPEC）。", "Game theory": "分析參與者在策略互動下如何做決策的方法。", "Payoff matrix": "列出各參與者在各種策略組合下報酬的表格。", "Dominant strategy": "不論對手怎麼選，對自己都是最好的策略。", "Nash equilibrium": "每位參與者都已對對手的選擇做出最佳反應，沒有人想單獨改變。", "Prisoners' dilemma": "各自追求自身利益，結果反而比合作時更差的賽局。", "Kinked demand curve": "寡占模型：對手跟降不跟漲，需求曲線在現行價格處彎折，價格因此僵固。", "Factor market": "買賣勞動、土地、資本等生產要素的市場。", "Derived demand": "對生產要素的需求，來自對其產品的需求。", "Marginal revenue product": "多僱用一單位要素所增加的總收益，等於 MP × MR。", "Value of marginal product": "多僱用一單位要素所增加產量的市場價值，等於 MP × P。", "Marginal factor cost": "多僱用一單位要素所增加的總成本；完全競爭時等於工資。", "Wage rate": "每單位勞動（例如每小時）的價格。", "Rent": "使用土地等自然資源所支付的報酬。", "Interest": "使用資本所支付的報酬。", "Profit": "企業家精神的報酬，即總收益減總成本。", "Monopsony": "市場只有一個買方，例如小鎮唯一的雇主；僱用量與工資都會偏低。", "Human capital": "透過教育、訓練與經驗累積的知識與技能。"};
const ALL=[];UNITS.forEach(u=>u.t.forEach(t=>ALL.push({u:u.id,en:t[0],zh:t[1],ab:t[2]||''})));

/* settings */
const KEY='econ-glossary-v1';
let S={acc:'en-US',rate:1,showEn:true,showZh:true,showDef:true,unit:'all'};
try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
let q='';

const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const list=$('list'),unitsEl=$('units'),notice=$('notice'),stopBtn=$('stopBtn');

/* speech */
const synth=('speechSynthesis' in window)?window.speechSynthesis:null;
let voices=[];
function loadVoices(){if(!synth)return;voices=synth.getVoices().filter(v=>/^en[-_]/i.test(v.lang)||/^en$/i.test(v.lang));}
if(synth){loadVoices();if('onvoiceschanged' in synth)synth.onvoiceschanged=loadVoices;}
function pickVoice(){const want=S.acc.toLowerCase().replace('_','-');
  const match=voices.filter(v=>v.lang.toLowerCase().replace('_','-')===want);
  const pool=match.length?match:voices;
  return pool.find(v=>/google|natural|enhanced|premium|samantha|daniel|aria|jenny|libby|sonia/i.test(v.name))||pool[0]||null;}
let token=0;
function speak(text,done){if(!synth){showNotice();done&&done();return;}
  synth.cancel();const my=++token;
  setTimeout(()=>{if(my!==token)return;const u=new SpeechSynthesisUtterance(text);u.lang=S.acc;const v=pickVoice();if(v)u.voice=v;u.rate=S.rate;u.pitch=1;
    let fin=false;const end=()=>{if(fin)return;fin=true;if(my===token)done&&done();};
    u.onend=end;u.onerror=end;synth.speak(u);
    setTimeout(()=>{if(!fin&&!synth.speaking&&!synth.pending)end();},Math.max(4000,text.length*260/S.rate));},60);}
function stopAll(){token++;queue=null;if(synth)synth.cancel();document.querySelectorAll('.term.playing').forEach(c=>c.classList.remove('playing'));stopBtn.hidden=true;}
function showNotice(){notice.hidden=false;notice.textContent="This browser can't read text aloud. Please open the page in Chrome, Edge or Safari. (這個瀏覽器不支援朗讀，請改用 Chrome、Edge 或 Safari 開啟。)";}
if(!synth)showNotice();
else setTimeout(()=>{loadVoices();if(!voices.length){notice.hidden=false;notice.textContent="No English voice was found on this device yet. If clicking makes no sound, install an English voice in the system settings or try Chrome. (這台裝置目前找不到英文語音；若點了沒有聲音，請在系統設定加裝英文語音，或改用 Chrome。)";}},1500);

let queue=null;
function playCard(card,done){document.querySelectorAll('.term.playing').forEach(c=>c.classList.remove('playing'));
  card.classList.add('playing','shown');
  speak(card.dataset.say,()=>{card.classList.remove('playing');done&&done();});}
function playUnit(id){stopAll();const cards=[...list.querySelectorAll(`section[data-unit="${id}"] .term`)];if(!cards.length)return;
  const my={i:0};queue=my;stopBtn.hidden=false;
  const next=()=>{if(queue!==my)return;if(my.i>=cards.length){stopAll();return;}const c=cards[my.i++];c.scrollIntoView({block:'nearest',behavior:'smooth'});
    playCard(c,()=>{if(queue!==my)return;setTimeout(next,700);});};
  next();}

/* render */
const SPK='<svg class="ico" width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor"/><path d="M13 7.2a4 4 0 0 1 0 5.6M15.2 5a7 7 0 0 1 0 10" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg><span class="bars"><i></i><i></i><i></i></span>';
function matches(t){if(!q)return true;const s=q.toLowerCase();return t.en.toLowerCase().includes(s)||t.zh.includes(q)||t.ab.toLowerCase().includes(s);}
function renderUnits(){const counts={};ALL.filter(matches).forEach(t=>counts[t.u]=(counts[t.u]||0)+1);const total=Object.values(counts).reduce((a,b)=>a+b,0);
  unitsEl.innerHTML=`<button data-unit="all" aria-pressed="${S.unit==='all'}">All (全部)<span class="n">${total}</span></button>`+
    UNITS.map(u=>`<button data-unit="${u.id}" aria-pressed="${S.unit===u.id}">${esc(u.en)} (${esc(u.zh)})<span class="n">${counts[u.id]||0}</span></button>`).join('');}
function render(){stopAll();renderUnits();let h='';
  for(const u of UNITS){if(S.unit!=='all'&&S.unit!==u.id)continue;const ts=u.t.map(t=>({en:t[0],zh:t[1],ab:t[2]||''})).filter(matches);if(!ts.length)continue;
    h+=`<section class="unit" data-unit="${u.id}"><div class="uh"><h2>${esc(u.en)}<span>${esc(u.zh)}</span></h2><button class="btn" data-play="${u.id}">▶ Play this unit (依序朗讀本單元)</button></div><div class="grid">`+
      ts.map(t=>`<button class="term" data-say="${esc(t.en)}" aria-label="Play: ${esc(t.en)} (${esc(t.zh)})"><span class="spk">${SPK}</span><span class="en">${esc(t.en)}${t.ab?`<abbr>${esc(t.ab)}</abbr>`:''}</span><span class="zh">${esc(t.zh)}</span>${DEFS[t.en]?`<span class="def">${esc(DEFS[t.en])}</span>`:''}</button>`).join('')+'</div></section>';}
  list.innerHTML=h||'<p class="empty">No matching terms. Try another word. (找不到符合的名詞，請換個關鍵字。)</p>';}
function syncControls(){document.querySelectorAll('[data-acc]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.acc===S.acc));
  document.querySelectorAll('[data-rate]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.rate)===S.rate));
  $('showEn').checked=S.showEn;$('showZh').checked=S.showZh;
  document.body.classList.toggle('hide-en',!S.showEn);document.body.classList.toggle('hide-zh',!S.showZh);$('showDef').checked=S.showDef!==false;document.body.classList.toggle('hide-def',S.showDef===false);}

/* events */
list.addEventListener('click',e=>{const p=e.target.closest('[data-play]');if(p){playUnit(p.dataset.play);return;}
  const c=e.target.closest('.term');if(!c)return;queue=null;stopBtn.hidden=true;playCard(c);});
unitsEl.addEventListener('click',e=>{const b=e.target.closest('[data-unit]');if(!b)return;S.unit=b.dataset.unit;save();render();});
document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{S.acc=b.dataset.acc;save();syncControls();});
document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{S.rate=Number(b.dataset.rate);save();syncControls();});
$('showEn').onchange=e=>{S.showEn=e.target.checked;save();syncControls();list.querySelectorAll('.term.shown').forEach(c=>c.classList.remove('shown'));};
$('showDef').onchange=e=>{S.showDef=e.target.checked;save();syncControls();};
$('showZh').onchange=e=>{S.showZh=e.target.checked;save();syncControls();list.querySelectorAll('.term.shown').forEach(c=>c.classList.remove('shown'));};
$('q').addEventListener('input',e=>{q=e.target.value.trim();render();});
stopBtn.onclick=stopAll;

if(S.unit!=='all'&&!UNITS.some(u=>u.id===S.unit))S.unit='all';
syncControls();render();
window.__glossary={ALL,speak};
})();
</script>

</body>
</html>
